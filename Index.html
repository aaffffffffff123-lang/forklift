    --upright: #1560a8;      /* 기둥 */
    --upright-dk: #0e4680;
    --beam: #e8620f;         /* 로드빔 */
    --beam-dk: #b84a08;
    --safety: #f5c400;

    --bg: #e8eaec;
    --card: #ffffff;
    --panel: #f6f7f8;
    --line: #dcdfe3;
    --line-soft: #eceef0;

    --ink: #23272b;
    --ink-mid: #454c53;
    --ink-soft: #8a9198;
    --ink-faint: #b3b9be;

    --ui: 'GalmuriLocal', 'Noto Sans KR', sans-serif;
    --body: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;

    --fs-body: 1.06rem;
    --lh-body: 1.9;
    --fs-title: 1.55rem;
    --fs-cap: 33px;
  }

  html[data-fs="s"] { --fs-body: .96rem; --lh-body: 1.85; --fs-title: 1.35rem; --fs-cap: 22px; }
  html[data-fs="l"] { --fs-body: 1.2rem; --lh-body: 1.95; --fs-title: 1.7rem;  --fs-cap: 44px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16191c; --card: #1e2226; --panel: #23282d;
      --line: #333a40; --line-soft: #2a3035;
      --ink: #e2e6ea; --ink-mid: #b8bfc6; --ink-soft: #7f878e; --ink-faint: #5b6268;
      --upright: #4a93d8; --beam: #f0793a;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; overflow-x: hidden; touch-action: pan-y; }

  body {
    font-family: var(--body); background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }

  .px {
    font-family: var(--ui);
    -webkit-font-smoothing: none; font-smooth: never; letter-spacing: 0;
  }

  .ic { display: inline-block; vertical-align: -2px; flex-shrink: 0; }

  /* 안전 표시 줄무늬 */
  .hazard {
    height: 5px; width: 100%;
    background: repeating-linear-gradient(135deg,
      var(--safety) 0 7px, #2a2a2a 7px 14px);
  }

  /* ══════════════════════════════════════════
     랜딩
     ══════════════════════════════════════════ */
  #landing {
    position: absolute; inset: 0; z-index: 200; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .35s ease; padding: 24px;
  }
  /* 배경: 랙 실루엣 */
  /* 하단 랙 입면 — 기둥(파랑) + 로드빔(주황) */
  #landing::before {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 230px;
    pointer-events: none; opacity: .26;
    background-image:
      repeating-linear-gradient(90deg, var(--upright) 0 7px, transparent 7px 136px),
      repeating-linear-gradient(180deg, var(--beam) 0 5px, transparent 5px 68px);
    background-position: 0 0, 0 6px;
    mask-image: linear-gradient(180deg, transparent 0%, #000 62%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 62%);
  }
  /* 바닥선 */
  #landing::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
    background: var(--ink-faint); opacity: .5; pointer-events: none;
  }

  .team-sig {
    position: relative; font-size: 11px; color: var(--ink-faint); margin-bottom: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .team-sig .ic { color: var(--beam); }

  .landing-title {
    position: relative; font-size: 22px; line-height: 1.5; color: var(--ink);
    margin-bottom: 42px; text-align: center; word-break: keep-all;
  }
  .landing-title span { color: var(--beam); }

  .gate-group { position: relative; display: flex; gap: 22px; }

  .gate {
    width: 250px; height: 190px; background: var(--card);
    border: 1px solid var(--line); border-top: 6px solid var(--beam);
    border-radius: 3px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-decoration: none; color: inherit; position: relative; overflow: hidden;
    transition: transform .22s ease, box-shadow .22s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,.07);
  }
  /* 좌우 기둥 */
  .gate::before, .gate::after {
    content: ''; position: absolute; top: 6px; bottom: 0; width: 6px;
    background: repeating-linear-gradient(180deg,
      var(--upright) 0 12px, var(--upright-dk) 12px 15px);
  }
  .gate::before { left: 0; }
  .gate::after { right: 0; }
  .gate:hover { transform: translateY(-4px); box-shadow: 0 14px 26px rgba(0,0,0,.14); }
  .gate:active { transform: translateY(-1px) scale(.99); }

  .gate-icon { color: var(--upright); margin-bottom: 16px; }
  .gate:hover .gate-icon { color: var(--beam); }
  .gate-title { font-size: 13px; color: var(--ink); margin-bottom: 9px; }
  .gate-desc { font-size: .85rem; color: var(--ink-soft); text-align: center; line-height: 1.6; word-break: keep-all; }

  /* ── 이름 입력 ── */
  #name-modal {
    display: none; position: absolute; inset: 0; z-index: 300;
    background: rgba(0,0,0,.5); align-items: center; justify-content: center; padding: 24px;
  }
  #name-modal.on { display: flex; }

  .name-box {
    width: 100%; max-width: 380px; background: var(--card);
    border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
    box-shadow: 0 20px 44px rgba(0,0,0,.3);
  }
  .name-inner { padding: 26px 26px 22px 26px; }
  .name-title {
    font-size: 13px; color: var(--ink); margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .name-title .ic { color: var(--beam); }
  .name-desc { font-size: .85rem; line-height: 1.75; color: var(--ink-soft); margin-bottom: 20px; word-break: keep-all; }
  .name-input {
    width: 100%; font-family: var(--body); font-size: 1rem; padding: 13px 14px; margin-bottom: 8px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; outline: none;
  }
  .name-input:focus { border-color: var(--upright); }
  .name-hint { font-size: .76rem; color: var(--ink-faint); margin-bottom: 18px; min-height: 1.2em; }
  .name-btns { display: flex; gap: 8px; }
  .name-btn {
    flex: 1; font-size: 11px; padding: 13px 10px; cursor: pointer; border-radius: 3px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink-mid); transition: all .15s;
  }
  .name-btn:hover { border-color: var(--upright); color: var(--upright); }
  .name-btn.primary { background: var(--upright); color: #fff; border-color: var(--upright); flex: 1.4; }
  .name-btn.primary:hover { background: var(--upright-dk); color: #fff; }

  /* ══════════════════════════════════════════
     앱
     ══════════════════════════════════════════ */
  #app { display: none; width: 100%; height: 100%; }
  #app.on { display: flex; }

  #sidebar {
    width: 296px; flex-shrink: 0; background: var(--panel);
    display: flex; flex-direction: column; position: relative; z-index: 100;
    border-right: 1px solid var(--line);
  }
  /* 좌우 기둥 = 파랑 (타공 패턴) */
  #sidebar::before, #sidebar::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 8px; z-index: 3;
    background: repeating-linear-gradient(180deg,
      var(--upright) 0 13px, var(--upright-dk) 13px 17px);
  }
  #sidebar::before { left: 0; }
  #sidebar::after { right: 0; }

  .rack-head { background: var(--upright); color: #fff; position: relative; z-index: 2; }
  .rack-head-in { padding: 14px 18px 12px 18px; }
  .rack-head-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .rack-head-title { font-size: 12px; display: flex; align-items: center; gap: 7px; }
  .head-btns { display: flex; gap: 5px; }
  .head-btn {
    font-size: 11px; background: rgba(255,255,255,.14); color: #fff;
    border: 1px solid rgba(255,255,255,.3); border-radius: 3px; padding: 5px 7px;
    cursor: pointer; transition: background .15s;
  }
  .head-btn:hover { background: rgba(255,255,255,.28); }
  .head-btn.on { background: var(--safety); color: #26201a; border-color: var(--safety); }

  .fill-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: rgba(255,255,255,.85); margin-bottom: 6px;
  }
  .fill-row .lbl { display: flex; align-items: center; gap: 6px; }
  .fill-track {
    height: 10px; background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.22); border-radius: 2px; overflow: hidden;
  }
  .fill-bar {
    height: 100%; width: 0%;
    background: repeating-linear-gradient(90deg,
      var(--safety) 0 5px, #cfa400 5px 8px);
    transition: width .45s ease;
  }

  /* 검색 */
  .search-row { padding: 10px 14px; background: var(--upright-dk); position: relative; z-index: 2; }
  .search-box {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    background: rgba(0,0,0,.26); border: 1px solid rgba(255,255,255,.24); border-radius: 3px;
  }
  .search-box .ic { color: rgba(255,255,255,.65); }
  .search-box:focus-within { border-color: var(--safety); }
  #search-input {
    flex: 1; min-width: 0; background: none; border: none; outline: none;
    color: #fff; font-family: var(--body); font-size: .84rem;
  }
  #search-input::placeholder { color: rgba(255,255,255,.5); }
  .search-clear {
    background: none; border: none; color: rgba(255,255,255,.7);
    cursor: pointer; font-size: .9rem; padding: 0 2px; display: none;
  }
  .search-clear.on { display: block; }

  .who-row {
    padding: 8px 16px; background: var(--panel); color: var(--ink-soft);
    font-size: 11px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line); position: relative; z-index: 2;
  }
  .who-name {
    color: var(--ink-mid); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; max-width: 62%; display: flex; align-items: center; gap: 6px;
  }
  .who-btn {
    font-size: 11px; background: none; border: 1px solid var(--line);
    color: var(--ink-soft); border-radius: 3px; padding: 3px 7px; cursor: pointer;
  }
  .who-btn:hover { border-color: var(--upright); color: var(--upright); }

  #rack-body { flex: 1; overflow-y: auto; padding: 0 8px; }
  #rack-body::-webkit-scrollbar { width: 5px; }
  #rack-body::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 3px; }

  /* 월 = 로드빔 (주황) */
  .beam {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 13px; background: var(--beam); color: #fff; font-size: 11px;
    cursor: pointer; user-select: none;
    border-top: 2px solid var(--beam-dk); border-bottom: 2px solid var(--beam-dk);
  }
  .beam:hover { background: var(--beam-dk); }
  .beam-left { display: flex; align-items: center; gap: 7px; }
  /* 빔 볼트 구멍 */
  .beam-bolt {
    width: 4px; height: 4px; border-radius: 50%;
    background: rgba(0,0,0,.32); flex-shrink: 0;
  }
  .beam-right { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,.85); }
  .beam-arrow { transition: transform .2s; display: inline-block; }
  .beam.closed .beam-arrow { transform: rotate(-90deg); }
  .beam-slots.closed { display: none; }

  /* 슬롯 */
  .slot {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 13px;
    border-bottom: 1px solid var(--line-soft); cursor: pointer;
    position: relative; transition: background .15s;
  }
  .slot:hover { background: var(--line-soft); }
  .slot:active { background: var(--line); }
  .slot.active { background: var(--card); }
  .slot.active::after {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--beam);
  }
  .slot .ic { color: var(--ink-faint); margin-top: 2px; }
  .slot.read .ic { color: var(--upright); }

  .slot-text { min-width: 0; flex: 1; }
  .slot-date { font-size: 11px; color: var(--ink-faint); margin-bottom: 5px; }
  .slot-title {
    font-size: .88rem; line-height: 1.5; color: var(--ink-mid); word-break: keep-all;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .slot.read .slot-title { color: var(--ink-soft); }
  .slot.active .slot-title { color: var(--ink); font-weight: 700; }
  .slot mark { background: var(--safety); color: #2a2418; padding: 0 1px; border-radius: 1px; }

  .result-head {
    padding: 10px 13px; font-size: 11px; color: var(--ink-soft);
    background: var(--line-soft); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 7px;
  }

  .rack-empty {
    padding: 36px 20px; text-align: center; font-size: 11px;
    color: var(--ink-soft); line-height: 2.2;
  }
  .rack-empty .ic { color: var(--ink-faint); margin-bottom: 10px; }

  /* ── 메인 ── */
  #main { flex: 1; position: relative; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    height: 58px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: flex-end; padding: 0 20px; gap: 8px; position: relative; z-index: 2;
  }
  .icon-btn {
    background: var(--card); border: 1px solid var(--line); color: var(--ink-mid);
    width: 38px; height: 38px; border-radius: 3px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: .95rem; transition: all .15s;
  }
  .icon-btn:hover { border-color: var(--beam); color: var(--beam); }
  .icon-btn:active { transform: scale(.93); }
  .icon-btn:disabled { opacity: .3; cursor: not-allowed; transform: none; border-color: var(--line); color: var(--ink-mid); }
  .menu-btn { display: none; margin-right: auto; }

  .fs-group { display: flex; gap: 4px; margin-right: 6px; }
  .nav-arrows { display: flex; gap: 8px; }
  .fs-btn {
    font-size: 11px; background: var(--card); border: 1px solid var(--line); color: var(--ink-soft);
    width: 32px; height: 30px; border-radius: 3px; cursor: pointer; transition: all .15s;
  }
  .fs-btn.on { background: var(--upright); color: #fff; border-color: var(--upright); }

  #card-wrap {
    flex: 1; display: flex; justify-content: center; overflow: hidden;
    padding: 0 20px 22px 20px; position: relative; z-index: 2;
  }
  #card {
    width: 100%; max-width: 660px; height: 100%; background: var(--card);
    border: 1px solid var(--line); border-radius: 3px;
    overflow-y: auto; overflow-x: hidden; position: relative;
    box-shadow: 0 10px 30px rgba(0,0,0,.09);
  }
  #card::-webkit-scrollbar { width: 6px; }
  #card::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 3px; }

  /* 카드 상단 = 로드빔 + 진행바 */
  .beam-top {
    position: sticky; top: 0; z-index: 20; height: 12px; width: 100%;
    background: var(--beam); border-bottom: 2px solid var(--beam-dk);
    display: flex; align-items: center; gap: 26px; padding: 0 14px; overflow: hidden;
  }
  .beam-top i { width: 4px; height: 4px; border-radius: 50%; background: rgba(0,0,0,.3); flex-shrink: 0; }
  .prog-track { position: sticky; top: 12px; z-index: 19; height: 3px; width: 100%; background: var(--line); }
  .prog-bar { height: 100%; width: 0%; background: var(--upright); transition: width .08s linear; }

  .card-inner { padding: 32px 46px 60px 46px; animation: rise .38s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .loc-badge {
    display: inline-flex; align-items: center; gap: 8px; font-size: 11px;
    color: var(--ink-soft); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 2px; margin-bottom: 26px;
  }
  .loc-badge .ic { color: var(--ink-faint); }
  .loc-badge b { color: var(--ink-mid); font-weight: 400; }

  .sec-label {
    display: inline-flex; align-items: center; gap: 7px; font-size: 11px; color: #fff;
    padding: 7px 11px; border-radius: 2px; margin-bottom: 16px;
  }
  .label-h { background: var(--beam); }
  .label-c { background: var(--upright); }

  .sec-title {
    font-weight: 700; font-size: var(--fs-title); line-height: 1.45; color: var(--ink);
    margin-bottom: 22px; word-break: keep-all; letter-spacing: -.4px;
  }
  .sec-title em { font-style: normal; color: var(--accent); }

  .summary {
    font-size: calc(var(--fs-body) * .99); line-height: 1.75; font-weight: 500;
    padding: 20px 22px; margin-bottom: 34px; background: var(--sum-bg); color: var(--sum-ink);
    border-left: 4px solid var(--accent); border-radius: 0 3px 3px 0; word-break: keep-all;
  }

  .body-p {
    font-size: var(--fs-body); line-height: var(--lh-body); color: var(--ink-mid);
    margin-bottom: 2.1em; max-width: 33em; text-align: left;
    word-break: keep-all; overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .body-p.field { border-left: 2px solid var(--line); padding-left: 18px; margin-left: -2px; }

  /* 드롭캡: 이모지와 첫 글자를 한 덩어리로 묶어 통째로 float */
  .cap { float: left; display: flex; align-items: flex-end; gap: 5px; margin: 3px 1px 0 0; line-height: 1; }
  .cap-emoji { font-size: var(--fs-body); line-height: 1; position: relative; top: -1px; }
  .cap-char {
    font-family: var(--ui); -webkit-font-smoothing: none; font-smooth: never;
    font-size: var(--fs-cap); line-height: 1; color: var(--accent);
    letter-spacing: -0.06em; margin-right: -0.04em;
  }

  /* 통찰 = 물류 라벨 */
  .think {
    position: relative; margin: 6px 0 0 0; padding: 20px 22px 20px 34px;
    background: var(--card); border: 1px dashed var(--accent); border-radius: 3px;
    font-size: calc(var(--fs-body) * .97); line-height: 1.75; color: var(--ink); word-break: keep-all;
  }
  /* 라벨 좌측 바코드 */
  .think::before {
    content: ''; position: absolute; left: 12px; top: 16px; bottom: 16px; width: 8px;
    background: repeating-linear-gradient(180deg,
      var(--accent) 0 2px, transparent 2px 4px,
      var(--accent) 4px 7px, transparent 7px 9px,
      var(--accent) 9px 10px, transparent 10px 13px);
    opacity: .55;
  }
  .think-tag {
    position: absolute; top: -8px; left: 30px; font-size: 11px;
    background: var(--card); color: var(--accent); padding: 0 7px;
    display: flex; align-items: center; gap: 5px;
  }
  .think-hole {
    position: absolute; top: 12px; right: 12px; width: 9px; height: 9px;
    border-radius: 50%; border: 1px solid var(--accent); opacity: .5;
  }

  .sec-h { --accent: var(--beam); --sum-bg: #fdf1e8; --sum-ink: #7a3806; }
  .sec-c { --accent: var(--upright); --sum-bg: #eaf2fa; --sum-ink: #0d3f6e; }
  @media (prefers-color-scheme: dark) {
    .sec-h { --sum-bg: #2c2118; --sum-ink: #f0b98a; }
    .sec-c { --sum-bg: #182530; --sum-ink: #9dc8ec; }
  }

  /* 단 구분 = 로드빔 그래픽 */
  .tier-split {
    margin: 50px 0 44px 0; height: 10px; position: relative;
    background: var(--beam); border-top: 2px solid var(--beam-dk); border-bottom: 2px solid var(--beam-dk);
    display: flex; align-items: center; gap: 30px; padding: 0 12px; opacity: .82;
  }
  .tier-split i { width: 4px; height: 4px; border-radius: 50%; background: rgba(0,0,0,.32); }

  .read-toggle {
    margin-top: 50px; padding-top: 26px; border-top: 1px solid var(--line-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .read-btn {
    font-size: 11px; background: var(--card); color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 3px; padding: 13px 22px; cursor: pointer;
    transition: all .18s; display: flex; align-items: center; gap: 9px;
  }
  .read-btn:hover { border-color: var(--upright); color: var(--upright); }
  .read-btn.done { background: var(--upright); color: #fff; border-color: var(--upright); }

  .empty-main {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; font-size: 12px; color: var(--ink-soft); text-align: center;
    line-height: 2.2; padding: 30px; gap: 14px;
  }
  .empty-main .ic { color: var(--ink-faint); }

  #overlay { display: none; position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.42); }
  .float-nav { display: none; }

  /* ══════════════════════════════════════════
     모바일
     ══════════════════════════════════════════ */
  @media (max-width: 820px) {
    html, body { height: 100dvh; }

    .gate-group { flex-direction: column; width: 100%; max-width: 400px; gap: 12px; }
    .gate {
      width: 100%; height: 100px; flex-direction: row; justify-content: flex-start;
      padding: 0 22px 0 22px; border-top-width: 5px;
    }
    .gate-icon { margin: 0 18px 0 0; }
    .gate-title { margin-bottom: 5px; }
    .gate-desc { text-align: left; font-size: .78rem; }
    .gate-desc br { display: none; }

  <script>
  /* ═════════ 픽셀 아이콘 ═════════ */
  var ICON_PATHS = {

    pda: '<rect x=\"4\" y=\"1\" width=\"8\" height=\"1\"/><rect x=\"4\" y=\"2\" width=\"1\" height=\"12\"/><rect x=\"11\" y=\"2\" width=\"1\" height=\"12\"/><rect x=\"4\" y=\"14\" width=\"8\" height=\"1\"/><rect x=\"6\" y=\"4\" width=\"4\" height=\"4\"/><rect x=\"6\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"10\" width=\"1\" height=\"1\"/><rect x=\"6\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"9\" y=\"12\" width=\"1\" height=\"1\"/><rect x=\"12\" y=\"5\" width=\"4\" height=\"1\"/>',
    tape: '<rect x=\"5\" y=\"2\" width=\"6\" height=\"1\"/><rect x=\"3\" y=\"3\" width=\"2\" height=\"1\"/><rect x=\"11\" y=\"3\" width=\"2\" height=\"1\"/><rect x=\"2\" y=\"5\" width=\"1\" height=\"6\"/><rect x=\"13\" y=\"5\" width=\"1\" height=\"6\"/><rect x=\"3\" y=\"12\" width=\"2\" height=\"1\"/><rect x=\"11\" y=\"12\" width=\"2\" height=\"1\"/><rect x=\"5\" y=\"13\" width=\"6\" height=\"1\"/><rect x=\"6\" y=\"6\" width=\"4\" height=\"1\"/><rect x=\"6\" y=\"9\" width=\"4\" height=\"1\"/><rect x=\"6\" y=\"7\" width=\"1\" height=\"2\"/><rect x=\"9\" y=\"7\" width=\"1\" height=\"2\"/>',
    glove: '<rect x=\"3\" y=\"5\" width=\"2\" height=\"4\"/><rect x=\"6\" y=\"2\" width=\"2\" height=\"7\"/><rect x=\"9\" y=\"3\" width=\"2\" height=\"6\"/><rect x=\"12\" y=\"6\" width=\"2\" height=\"3\"/><rect x=\"3\" y=\"9\" width=\"11\" height=\"5\"/>',
    search: '<rect x=\"5\" y=\"1\" width=\"4\" height=\"1\"/><rect x=\"3\" y=\"2\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"2\" width=\"2\" height=\"1\"/><rect x=\"2\" y=\"3\" width=\"1\" height=\"2\"/><rect x=\"11\" y=\"3\" width=\"1\" height=\"2\"/><rect x=\"1\" y=\"5\" width=\"1\" height=\"4\"/><rect x=\"12\" y=\"5\" width=\"1\" height=\"4\"/><rect x=\"2\" y=\"9\" width=\"1\" height=\"2\"/><rect x=\"11\" y=\"9\" width=\"1\" height=\"2\"/><rect x=\"3\" y=\"11\" width=\"2\" height=\"1\"/><rect x=\"9\" y=\"11\" width=\"2\" height=\"1\"/><rect x=\"5\" y=\"12\" width=\"4\" height=\"1\"/><rect x=\"11\" y=\"11\" width=\"2\" height=\"2\"/><rect x=\"13\" y=\"13\" width=\"3\" height=\"3\"/>',
    check: '<rect x=\"2\" y=\"7\" width=\"3\" height=\"3\"/><rect x=\"4\" y=\"10\" width=\"3\" height=\"3\"/><rect x=\"7\" y=\"7\" width=\"3\" height=\"3\"/><rect x=\"9\" y=\"4\" width=\"3\" height=\"3\"/><rect x=\"11\" y=\"1\" width=\"3\" height=\"3\"/>'
  };
  function ic(name, size, cls) {
    var p = ICON_PATHS[name];
    if (!p) return '';
    size = size || 14;
    return '<svg class="ic ' + (cls || '') + '" viewBox="0 0 16 16" width="' + size +
           '" height="' + size + '" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true">' +
           p + '</svg>';
  }

  /* ═════════ 데이터 ═════════ */
  var DB = <?!= dataJson ?>;

  var LS_READ = 'logi_read_v2';
  var LS_FS   = 'logi_fs_v1';
  var LS_NAME = 'logi_name_v1';

  var readSet = {};
  var userName = '';
  var addQueue = [], delQueue = [], syncTimer = null;

  var currentIndex = 0;
  var unreadOnly = false;
  var openMonths = {};
  var query = '';
  var started = false;

  /* ═════════ 초기화 ═════════ */

  (function init() {
    if (!Array.isArray(DB)) DB = [];

    // 고정 아이콘 배치
    document.getElementById('team-sig').innerHTML = ic('rack', 12) + '<span>평택 재고관리팀</span>';
    document.getElementById('gate-ic-1').innerHTML = ic('roller', 40);
    document.getElementById('gate-ic-2').innerHTML = ic('tote', 40);
    document.getElementById('name-title').innerHTML = ic('pda', 14) + '<span>읽은 글 표시하기</span>';
    document.getElementById('rack-title').innerHTML = ic('rack', 13) + '<span>오늘의 1분</span>';
    document.getElementById('fill-label').innerHTML = ic('pallet_full', 12) + '<span>적재율</span>';
    document.getElementById('search-ic').innerHTML = ic('search', 13);

    try { userName = localStorage.getItem(LS_NAME) || ''; } catch (e) { userName = ''; }
    loadLocalRead();

    uniqueMonths().forEach(function (m, i) { openMonths[m] = (i === 0); });

    var fs = 'm';
    try { fs = localStorage.getItem(LS_FS) || 'm'; } catch (e) {}
    applyFontSize(fs);

    updateWho();
    bindSearch();
    currentIndex = Math.max(0, firstUnreadIndex());
    renderRack();
    renderCard();
  })();

  function loadLocalRead() {
    var local = [];
    try {
      var raw = localStorage.getItem(LS_READ);
      if (raw) local = JSON.parse(raw) || [];
    } catch (e) { local = []; }
    (local || []).forEach(function (d) { readSet[d] = true; });
  }

  function saveLocalRead() {
    try { localStorage.setItem(LS_READ, JSON.stringify(Object.keys(readSet))); } catch (e) {}
  }

  /* ═════════ 이름 ═════════ */

  function startApp() {
    if (!userName && !hasSkipped()) { openNameModal(); return; }
    enterApp();
  }

  function hasSkipped() {
    try { return localStorage.getItem(LS_NAME) !== null; } catch (e) { return false; }
  }

  function openNameModal() {
    var m = document.getElementById('name-modal');
    var i = document.getElementById('name-input');
    document.getElementById('name-hint').textContent = '';
    i.value = userName || '';
    m.classList.add('on');
    setTimeout(function () { try { i.focus(); } catch (e) {} }, 60);
  }

  function closeNameModal() { document.getElementById('name-modal').classList.remove('on'); }

  function submitName() {
    var v = document.getElementById('name-input').value.replace(/\s+/g, ' ').trim();
    if (!v) {
      document.getElementById('name-hint').textContent = '이름을 적거나, 안 적고 보기를 누르시면 됩니다.';
      return;
    }
    userName = v;
    try { localStorage.setItem(LS_NAME, v); } catch (e) {}
    updateWho(); closeNameModal(); enterApp(); pullServerRead();
  }

  function skipName() {
    userName = '';
    try { localStorage.setItem(LS_NAME, ''); } catch (e) {}
    updateWho(); closeNameModal(); enterApp();
  }

  function updateWho() {
    document.getElementById('who-name').innerHTML =
      ic('glove', 12) + '<span>' + (userName ? esc(userName) + ' 님' : '이 기기에만 저장') + '</span>';
  }

  function pullServerRead() {
    if (!userName) return;
    try {
      google.script.run
        .withSuccessHandler(function (dates) {
          if (dates && dates.length) {
            var changed = false;
            dates.forEach(function (d) { if (!readSet[d]) { readSet[d] = true; changed = true; } });
            if (changed) { saveLocalRead(); renderRack(); renderCard(); }
          }
          pushAll();
        })
        .withFailureHandler(function () {})
        .getReadDates(userName);
    } catch (e) {}
  }

  function pushAll() {
    var all = Object.keys(readSet);
    if (!all.length) return;
    addQueue = addQueue.concat(all);
    scheduleSync();
  }

  /* ═════════ 텍스트 ═════════ */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function mark(s, tag) {
    tag = tag || 'strong';
    return esc(s).replace(/\*([^*\n]+)\*/g, '<' + tag + '>$1</' + tag + '>');
  }

  function stripStar(s) { return esc(s).replace(/\*/g, ''); }

  // 이모지와 첫 글자를 한 덩어리로 묶어 통째로 float 합니다.
  function dropCap(s) {
    var t = String(s == null ? '' : s);
    var m = t.match(/[0-9A-Za-z가-힣]/);
    if (!m) return mark(t);

    var i = m.index;
    var lead = t.substring(0, i).trim();
    var ch = t.charAt(i);
    var rest = t.substring(i + 1);

    return '<span class="cap">'
         + (lead ? '<span class="cap-emoji">' + esc(lead) + '</span>' : '')
         + '<span class="cap-char">' + esc(ch) + '</span>'
         + '</span>' + mark(rest);
  }

  function monthOf(d) { return String(d || '').substring(0, 7); }

  function monthLabel(m) {
    var p = m.split('-');
    return p.length === 2 ? (p[0] + '년 ' + parseInt(p[1], 10) + '월') : m;
  }

  function uniqueMonths() {
    var seen = {}, out = [];
    DB.forEach(function (it) {
      var m = monthOf(it.date);
      if (!seen[m]) { seen[m] = true; out.push(m); }
    });
    return out;
  }

  function firstUnreadIndex() {
    for (var i = DB.length - 1; i >= 0; i--) if (!readSet[DB[i].date]) return i;
    return 0;
  }

  /* ═════════ 검색 ═════════ */

  function bindSearch() {
    var el = document.getElementById('search-input');
    el.addEventListener('input', function () {
      query = el.value.trim();
      document.getElementById('search-clear').classList.toggle('on', !!query);
      renderRack();
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { clearSearch(); el.blur(); }
      e.stopPropagation();
    });
  }

  function clearSearch() {
    query = '';
    document.getElementById('search-input').value = '';
    document.getElementById('search-clear').classList.remove('on');
    renderRack();
  }

  function haystack(it) {
    var h = it.history, c = it.concept;
    return [it.date,
      h.title, h.summary, h.body1, h.body2, h.body3, h.think,
      c.title, c.summary, c.body1, c.body2, c.body3, c.think
    ].join(' ').toLowerCase();
  }

  function matches(it) {
    if (!query) return true;
    var q = query.toLowerCase();
    var hay = haystack(it);
    // 공백으로 나눈 모든 낱말을 포함해야 통과
    return q.split(/\s+/).every(function (w) { return !w || hay.indexOf(w) !== -1; });
  }

  function highlight(text) {
    var safe = stripStar(text);
    if (!query) return safe;
    var words = query.split(/\s+/).filter(Boolean)
      .map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
    if (!words.length) return safe;
    try {
      return safe.replace(new RegExp('(' + words.join('|') + ')', 'gi'), '<mark>$1</mark>');
    } catch (e) { return safe; }
  }

  /* ═════════ 사이드바 ═════════ */

  function makeSlot(i) {
    var it = DB[i];
    var slot = document.createElement('div');
    slot.className = 'slot' + (readSet[it.date] ? ' read' : '') + (i === currentIndex ? ' active' : '');
    slot.id = 'slot-' + i;
    slot.innerHTML =
      ic(readSet[it.date] ? 'pallet_full' : 'pallet', 18) +
      '<div class="slot-text">' +
        '<div class="slot-date px">' + esc(it.date) + '</div>' +
        '<div class="slot-title">' + highlight(it.history.title) + '</div>' +
      '</div>';
    slot.onclick = function () {
      currentIndex = i;
      renderCard(); renderRack();
      if (window.innerWidth <= 820) closeSidebar();
    };
    return slot;
  }

  function renderRack() {
    var box = document.getElementById('rack-body');
    box.innerHTML = '';

    var total = DB.length;
    var readCount = DB.filter(function (it) { return readSet[it.date]; }).length;
    var pct = total ? Math.round(readCount / total * 100) : 0;

    document.getElementById('fill-pct').textContent = pct + '%';
    document.getElementById('fill-cnt').textContent = readCount + ' / ' + total;
    document.getElementById('fill-bar').style.width = pct + '%';

    if (!total) {
      box.innerHTML = '<div class="rack-empty px">' + ic('forklift', 26) +
        '<div>아직 적재된 항목이 없습니다.</div></div>';
      return;
    }

    // 검색 중에는 월 묶음을 풀고 결과만 나열합니다.
    if (query) {
      var hits = [];
      for (var i = 0; i < DB.length; i++) {
        if (!matches(DB[i])) continue;
        if (unreadOnly && readSet[DB[i].date]) continue;
        hits.push(i);
      }

      var head = document.createElement('div');
      head.className = 'result-head px';
      head.innerHTML = ic('search', 12) + '<span>검색 결과 ' + hits.length + '건</span>';
      box.appendChild(head);

      if (!hits.length) {
        box.innerHTML += '<div class="rack-empty px">' + ic('pda', 26) +
          '<div>일치하는 글이 없습니다.</div></div>';
        return;
      }
      hits.forEach(function (i) { box.appendChild(makeSlot(i)); });
      return;
    }

    var groups = {}, order = [];
    DB.forEach(function (it, idx) {
      var m = monthOf(it.date);
      if (!groups[m]) { groups[m] = []; order.push(m); }
      groups[m].push(idx);
    });

    var shown = 0;

    order.forEach(function (m) {
      var idxs = groups[m].filter(function (i) { return unreadOnly ? !readSet[DB[i].date] : true; });
      if (!idxs.length) return;

      var readN = groups[m].filter(function (i) { return readSet[DB[i].date]; }).length;
      var closed = !openMonths[m];

      var beam = document.createElement('div');
      beam.className = 'beam px' + (closed ? ' closed' : '');
      beam.innerHTML =
        '<span class="beam-left"><i class="beam-bolt"></i>' + monthLabel(m) + '</span>' +
        '<span class="beam-right"><span>' + readN + '/' + groups[m].length + '</span>' +
        '<span class="beam-arrow">▼</span></span>';
      beam.onclick = function () { openMonths[m] = !openMonths[m]; renderRack(); };
      box.appendChild(beam);

      var wrap = document.createElement('div');
      wrap.className = 'beam-slots' + (closed ? ' closed' : '');
      idxs.forEach(function (i) { wrap.appendChild(makeSlot(i)); shown++; });
      box.appendChild(wrap);
    });

    if (!shown) {
      box.innerHTML += '<div class="rack-empty px">' + ic('check', 26) +
        '<div>안 읽은 글이 없습니다.<br>모두 적재 완료입니다.</div></div>';
    }
  }

  function toggleFilter() {
    unreadOnly = !unreadOnly;
    document.getElementById('btn-filter').classList.toggle('on', unreadOnly);
    if (unreadOnly) uniqueMonths().forEach(function (m) { openMonths[m] = true; });
    renderRack();
  }

  /* ═════════ 카드 ═════════ */

  function bolts(n) {
    var s = '';
    for (var i = 0; i < n; i++) s += '<i></i>';
    return s;
  }

  function renderCard() {
    var card = document.getElementById('card');

    if (!DB.length) {
      card.innerHTML = '<div class="empty-main px">' + ic('forklift', 32) +
        '<div>표시할 글이 없습니다.<br>슬랙에 발송된 글이 쌓이면 여기에 나타납니다.</div></div>';
      return;
    }

    var it = DB[currentIndex];
    var isRead = !!readSet[it.date];
    var pos = (DB.length - currentIndex);

    card.innerHTML =
      '<div class="beam-top">' + bolts(14) + '</div>' +
      '<div class="prog-track"><div class="prog-bar" id="prog-bar"></div></div>' +
      '<div class="card-inner">' +

        '<div class="loc-badge px">' + ic('box', 12) + '<span>' + esc(it.date) +
          '</span><b>' + pos + ' / ' + DB.length + '</b></div>' +

        '<div class="sec-h">' +
          '<div class="sec-label label-h px">' + ic('roller', 12) + '<span>역사</span></div>' +
          '<div class="sec-title">' + mark(it.history.title, 'em') + '</div>' +
          (it.history.summary ? '<div class="summary">' + mark(it.history.summary) + '</div>' : '') +
          '<div class="body-p">' + dropCap(it.history.body1) + '</div>' +
          '<div class="body-p">' + mark(it.history.body2) + '</div>' +
          '<div class="body-p field">' + mark(it.history.body3) + '</div>' +
          (it.history.think
            ? '<div class="think"><span class="think-tag px">' + ic('tape', 11) + '<span>핵심</span></span>' +
              '<span class="think-hole"></span>' + stripStar(it.history.think) + '</div>' : '') +
        '</div>' +

        '<div class="tier-split">' + bolts(10) + '</div>' +

        '<div class="sec-c">' +
          '<div class="sec-label label-c px">' + ic('rack', 12) + '<span>개념</span></div>' +
          '<div class="sec-title">' + mark(it.concept.title, 'em') + '</div>' +
          (it.concept.summary ? '<div class="summary">' + mark(it.concept.summary) + '</div>' : '') +
          '<div class="body-p">' + dropCap(it.concept.body1) + '</div>' +
          '<div class="body-p">' + mark(it.concept.body2) + '</div>' +
          '<div class="body-p field">' + mark(it.concept.body3) + '</div>' +
          (it.concept.think
            ? '<div class="think"><span class="think-tag px">' + ic('tape', 11) + '<span>핵심</span></span>' +
              '<span class="think-hole"></span>' + stripStar(it.concept.think) + '</div>' : '') +
        '</div>' +

        '<div class="read-toggle">' +
          '<button class="read-btn px' + (isRead ? ' done' : '') + '" onclick="toggleRead()">' +
            ic(isRead ? 'pallet_full' : 'jack', 15) +
            '<span>' + (isRead ? '적재 완료' : '읽음으로 표시') + '</span>' +
          '</button>' +
        '</div>' +

      '</div>';

    card.scrollTop = 0;
    updateNav();
    card.onscroll = function () {
      var bar = document.getElementById('prog-bar');
      if (!bar) return;
      var h = card.scrollHeight - card.clientHeight;
      bar.style.width = (h > 0 ? (card.scrollTop / h * 100) : 0) + '%';
    };
  }

  function updateNav() {
    var atNewest = (currentIndex === 0);
    var atOldest = (currentIndex === DB.length - 1);
    ['btn-prev', 'f-prev'].forEach(function (id) {
      var b = document.getElementById(id); if (b) b.disabled = atNewest;
    });
    ['btn-next', 'f-next'].forEach(function (id) {
      var b = document.getElementById(id); if (b) b.disabled = atOldest;
    });
    var fm = document.getElementById('f-mark');
    if (fm && DB.length) fm.classList.toggle('done', !!readSet[DB[currentIndex].date]);
  }

  function move(dir) {
    var next = currentIndex + dir;
    if (next < 0 || next >= DB.length) return;
    currentIndex = next;
    renderCard(); renderRack();
  }

  /* ═════════ 읽음 ═════════ */

  function toggleRead() {
    if (!DB.length) return;
    var d = DB[currentIndex].date;
    if (readSet[d]) { delete readSet[d]; delQueue.push(d); }
    else { readSet[d] = true; addQueue.push(d); }
    saveLocalRead(); scheduleSync(); renderCard(); renderRack();
  }

  function scheduleSync() {
    if (!userName) return;
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(flushSync, 2000);
  }

  function flushSync() {
    if (!userName) return;
    if (addQueue.length) {
      var add = addQueue.slice(); addQueue = [];
      try {
        google.script.run
          .withFailureHandler(function () { addQueue = addQueue.concat(add); })
          .saveReadDates(userName, add);
      } catch (e) { addQueue = addQueue.concat(add); }
    }
    if (delQueue.length) {
      var del = delQueue.slice(); delQueue = [];
      try {
        google.script.run
          .withFailureHandler(function () { delQueue = delQueue.concat(del); })
          .removeReadDates(userName, del);
      } catch (e) { delQueue = delQueue.concat(del); }
    }
  }

  window.addEventListener('beforeunload', flushSync);

  /* ═════════ 글자 크기 ═════════ */

  function setFontSize(v) {
    applyFontSize(v);
    try { localStorage.setItem(LS_FS, v); } catch (e) {}
  }

  function applyFontSize(v) {
    document.documentElement.setAttribute('data-fs', v);
    Array.prototype.forEach.call(document.querySelectorAll('.fs-btn'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-fs') === v);
    });
  }

  /* ═════════ 화면 전환 ═════════ */

  function enterApp() {
    if (started) return;
    started = true;
    var l = document.getElementById('landing');
    l.style.opacity = '0';
    setTimeout(function () {
      l.style.display = 'none';
      document.getElementById('app').classList.add('on');
    }, 340);
    if (userName) pullServerRead();
  }

  function goHome() {
    closeSidebar(); started = false;
    document.getElementById('app').classList.remove('on');
    var l = document.getElementById('landing');
    l.style.display = 'flex';
    setTimeout(function () { l.style.opacity = '1'; }, 10);
  }

  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').style.display = 'block';
    var a = document.getElementById('slot-' + currentIndex);
    if (a) a.scrollIntoView({ block: 'center' });
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').style.display = 'none';
  }

  /* ═════════ 입력 ═════════ */

  document.addEventListener('keydown', function (e) {
    if (document.getElementById('name-modal').classList.contains('on')) {
      if (e.key === 'Enter') submitName();
      if (e.key === 'Escape') closeNameModal();
      return;
    }
    if (!document.getElementById('app').classList.contains('on')) return;

    if (e.key === '/') {
      e.preventDefault();
      openSidebar();
      try { document.getElementById('search-input').focus(); } catch (err) {}
      return;
    }
    if (e.key === 'ArrowLeft') move(-1);
    if (e.key === 'ArrowRight') move(1);
    if (e.key === 'Escape') closeSidebar();
  });

  (function swipe() {
    var sx = 0, sy = 0;
    var card = document.getElementById('card');
    card.addEventListener('touchstart', function (e) {
      sx = e.changedTouches[0].screenX; sy = e.changedTouches[0].screenY;
    }, { passive: true });
    card.addEventListener('touchend', function (e) {
      var dx = e.changedTouches[0].screenX - sx;
      var dy = e.changedTouches[0].screenY - sy;
      if (Math.abs(dy) > Math.abs(dx)) return;
      if (Math.abs(dx) < 110) return;
      move(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();
  </script>
</body>
</html>
