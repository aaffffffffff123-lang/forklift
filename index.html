<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>지게차 연수원</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
      media="print" onload="this.media='all'">
<style>
  :root{
    --ink:#1D2733; --ink-2:#5A6875; --line:#CBD5DE; --panel:#F1F5F8; --bg:#EDF3F8;
    --safety:#F2B705; --ok:#17A673; --warn:#E03B36; --steel:#E1E8EF; --knob:#3A4553;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", "Roboto Mono", Menlo, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    overscroll-behavior:none;touch-action:none;
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);}
  canvas#scene{display:block;width:100%;height:100%;touch-action:none;}
  #hud{position:fixed;inset:0;pointer-events:none;touch-action:none;}
  #boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#D7E0E8;}
  #boot.gone{display:none;}
  .bootbox{background:#F1F5F8;border:1px solid #CBD5DE;border-radius:12px;padding:18px 26px;
    font-size:14px;font-weight:700;color:#5A6875;box-shadow:0 4px 18px rgba(29,39,51,.10);}
  .card{position:absolute;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 2px 10px rgba(29,39,51,.08);}

  #task{top:12px;left:12px;max-width:320px;padding:9px 11px;
    border-left:4px solid var(--safety);opacity:.72;transition:opacity .16s;
    background:rgba(241,245,248,.80);}
  #task:hover, #task.live{opacity:1;background:rgba(241,245,248,.96);}
  #task .eyebrow{font-size:10px;letter-spacing:.08em;color:var(--ink-2);font-weight:700;}
  #task .title{font-size:14px;font-weight:700;line-height:1.3;margin-top:3px;}
  #task .desc{font-size:11.5px;color:var(--ink-2);line-height:1.5;margin-top:5px;
    max-height:20vh;overflow:auto;}

  body.touch #task .desc{font-size:11px;max-height:15vh;}


  .code{font-family:var(--mono);font-weight:700;}

  #stat{top:12px;right:12px;padding:8px 11px;display:flex;gap:14px;
    opacity:.78;transition:opacity .16s;background:rgba(241,245,248,.82);}
  #stat:hover{opacity:1;}
  #stat div{text-align:right;}
  #stat .k{font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);font-weight:700;}
  #stat .v{font-family:var(--mono);font-size:18px;font-weight:700;line-height:1.2;}
  #stat .v.bad{color:var(--warn);}

  /* 계기판 — 가로를 다 쓰고 세로로 얇게. 왼쪽 조향각, 오른쪽 수치 */
  /* 계기판 — 좌우로 갈라 조향휠·레버 위에 각각 얹는다. 가운데는 비운다. */
  #panel{position:absolute;left:12px;right:12px;display:flex;justify-content:space-between;
    align-items:flex-end;gap:10px;}
  
  
  .pbox{background:rgba(241,245,248,.66);border:1px solid rgba(203,213,222,.72);
    border-radius:10px;box-shadow:0 2px 10px rgba(29,39,51,.06);
    padding:5px 10px;min-width:0;
    text-shadow:0 1px 0 rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}



  /* 왼쪽 상자 = 아크가 남는 폭을 다 쓰고, 속도는 오른쪽 끝에 붙는다 */
  .steerBox{width:100%;display:flex;align-items:center;}
  .steerBox canvas{display:block;flex:1 1 auto;width:auto;min-width:0;height:auto;}
  .steerBox .col{flex:0 0 62px;width:62px;padding-left:8px;margin-left:8px;
    border-left:1px solid var(--line);}
  #panel .col{display:flex;justify-content:space-around;gap:6px;min-width:0;}
  #panel .row{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;}
  #panel .k{font-size:9px;font-weight:800;letter-spacing:0;color:var(--ink-2);white-space:nowrap;}
  #panel .v{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--ink);}
  #panel .v.ok{color:var(--ok);} #panel .v.bad{color:var(--warn);} #panel .v.blue{color:#1A73E8;}
  body.touch #panel .k{font-size:9.5px;}
  body.touch #panel .v{font-size:15px;}

  /* 정렬 게이지 — 계기판 위에 반투명으로 겹친다 */
  /* 정렬 게이지 — 화면 좌우 끝에 하나씩 붙여 가운데를 비운다 */
  .alignBox{display:none;padding:5px 7px;width:104px;
    background:rgba(241,245,248,.86);}
  #alignL{left:12px;}
  #alignR{right:12px;}
  .alignBox canvas{display:block;width:100%;height:auto;}
  .alignBox .pt{font-size:8.5px;font-weight:800;color:var(--ink-2);letter-spacing:0;margin-bottom:1px;}
  .alignBox .lbl{font-size:10.5px;font-weight:800;color:var(--ink-2);text-align:center;
    line-height:1.25;margin-top:3px;padding-top:3px;border-top:1px solid var(--line);}
  .alignBox .lbl.ok{color:var(--ok);} .alignBox .lbl.bad{color:var(--warn);}
  .alignBox .lbl2{font-family:var(--mono);font-size:11px;font-weight:800;text-align:center;
    color:var(--ink-2);margin-top:3px;padding-top:3px;border-top:1px solid var(--line);}
  .alignBox .lbl2.ok{color:var(--ok);} .alignBox .lbl2.bad{color:var(--warn);}
  body.touch .alignBox{width:114px;}
  body.portrait .alignBox{width:98px;}




  /* 배회 정보 — 지시서 안에 이어 붙인다 */
  #roam{display:none;margin-top:7px;padding-top:7px;border-top:1px solid var(--line);}
  #roam canvas{display:block;width:100%;height:auto;margin-top:8px;
    border:1px solid var(--line);border-radius:6px;background:#E3EAF1;}
  #roamMore{display:none;margin-top:7px;padding-top:6px;border-top:1px solid var(--line);}
  #roamMore.on{display:block;}
  #roam .rows{display:grid;grid-template-columns:1fr auto;gap:2px 8px;}
  #roam .k{font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--ink-2);}
  #roam .v{font-family:var(--mono);font-size:11.5px;font-weight:800;text-align:right;}
  #roam .v.ok{color:var(--ok);}
  #roam .goal .k{font-size:9.5px;}
  #roam .goal .id{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--ink);margin-top:1px;}
  #roam .goal .d{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-2);}

  #toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:var(--warn);color:#fff;
    font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .18s;}
  #toast.show{opacity:1;}
  #toast.good{background:var(--ok);}

  #risk{position:absolute;top:140px;left:50%;transform:translateX(-50%);width:262px;
    background:#FBEEED;border:1px solid #E8A9A6;border-radius:10px;padding:9px 12px 10px;display:none;
    box-shadow:0 2px 10px rgba(224,59,54,.14);}
  #risk .msg{font-size:12.5px;font-weight:800;color:#B02722;margin-bottom:7px;}
  #risk .bar{height:6px;border-radius:3px;background:#F0D4D2;overflow:hidden;}
  #risk .bar i{display:block;height:100%;background:var(--warn);width:0%;transition:width .08s linear;}
  #risk.warn{background:#FDF6E4;border-color:#E4C468;box-shadow:0 2px 10px rgba(200,150,10,.14);}
  #risk.warn .msg{color:#8A6A05;} #risk.warn .bar{background:#F0E2BC;} #risk.warn .bar i{background:var(--safety);}

  .ctl{position:absolute;bottom:12px;padding:12px 15px;display:flex;align-items:flex-end;gap:12px;
    pointer-events:auto;user-select:none;touch-action:none;
    opacity:.72;transition:opacity .16s;background:rgba(241,245,248,.80);}
  .ctl.live{opacity:1;background:rgba(241,245,248,.96);}
  #ctlLeft{left:12px;transform:scale(var(--ui,1));transform-origin:bottom left;}
  #ctlRight{right:12px;transform:scale(var(--ui,1));transform-origin:bottom right;
    position:absolute;padding-top:18px;}
  .ctl .sep{width:1px;align-self:stretch;background:var(--line);margin:0 1px;}
  .cap{font-size:10px;color:var(--ink-2);font-weight:700;text-align:center;margin-top:6px;white-space:nowrap;}
  .cap b{font-family:var(--mono);color:var(--ink);font-weight:700;}

  /* 핸들 — 오른쪽 아래 대각선 빈 자리에 브레이크를 작게 붙인다 */
  .wheelBox{position:relative;}
  .wheelWrap{position:relative;width:140px;height:140px;cursor:grab;}
  .wheelWrap:active{cursor:grabbing;}
  .wheelWrap svg{display:block;width:100%;height:100%;}
  .tick{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:2px;height:10px;
    background:var(--ink-2);border-radius:1px;}
  #pedal{position:absolute;right:-16px;bottom:-8px;width:50px;height:50px;border-radius:50%;
    border:1px solid var(--line);background:var(--steel);font-family:inherit;
    font-size:10px;font-weight:800;color:var(--ink-2);cursor:pointer;z-index:2;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(29,39,51,.18);}
  #pedal.on{background:var(--safety);border-color:#D8A104;color:var(--ink);}

  /* 경음기 — 레버 모듈 위로 살짝 튀어나온 버튼 */
  #horn{position:absolute;left:50%;top:-15px;transform:translateX(-50%);
    width:52px;height:30px;border-radius:15px 15px 4px 4px;
    border:1px solid #A32723;border-bottom:none;background:#D93B34;
    font-family:inherit;font-size:10px;font-weight:800;color:#fff;cursor:pointer;z-index:2;}
  #horn.on{background:#F25A4E;border-color:#8E1D16;color:#fff;}

  .levers{display:flex;gap:10px;align-items:flex-end;}
  .lever{width:40px;}
  .lever .dir{font-size:9px;font-weight:700;color:#8A96A2;text-align:center;height:12px;line-height:12px;}
  .lever .slot{position:relative;width:30px;margin:0 auto;border-radius:999px;background:var(--steel);border:1px solid var(--line);}
  .lever .mid{position:absolute;left:5px;right:5px;top:50%;height:1px;background:#C7D0D9;}
  .lever .stem{position:absolute;left:50%;width:5px;background:#B9C2CC;border-radius:3px;transform:translateX(-50%);}
  .lever .knob{position:absolute;left:50%;width:26px;height:30px;border-radius:12px;background:var(--knob);
    transform:translate(-50%,-50%);box-shadow:0 2px 5px rgba(29,39,51,.3);}
  .lever.act .knob{background:#26313D;}

  .thr{width:44px;}
  .thr .dir{font-size:9px;font-weight:700;color:#8A96A2;text-align:center;height:12px;line-height:12px;}
  .thr .slot{position:relative;width:34px;height:104px;margin:0 auto;border-radius:999px;background:var(--steel);border:1px solid var(--line);}
  .thr .mid{position:absolute;left:5px;right:5px;top:50%;height:1px;background:#C7D0D9;}
  .thr .stem{position:absolute;left:50%;width:6px;background:#B9C2CC;border-radius:3px;transform:translateX(-50%);}
  .thr .knob{position:absolute;left:50%;width:30px;height:32px;border-radius:12px;background:var(--knob);
    transform:translate(-50%,-50%);box-shadow:0 2px 5px rgba(29,39,51,.3);}
  .thr.act .knob{background:#26313D;}

  body.touch .lever .slot::after,
  body.touch .thr .slot::after,
  body.touch #horn::after{content:'';position:absolute;inset:-12px;}
  body.touch .lever{width:48px;} body.touch .lever .slot{width:40px;}
  body.touch .lever .knob{width:34px;height:34px;}
  body.touch .lever .dir{font-size:10.5px;height:14px;line-height:14px;}
  body.touch .thr{width:54px;} body.touch .thr .slot{width:46px;}
  body.touch .thr .knob{width:40px;height:36px;}
  body.touch .thr .dir{font-size:10.5px;height:14px;line-height:14px;}
  body.touch #horn{width:60px;height:34px;top:-17px;font-size:11px;}
  body.touch #pedal{width:58px;height:58px;font-size:11px;right:-20px;bottom:-10px;}
  body.touch .wheelWrap{width:158px;height:158px;}
  body.touch .cap{font-size:11px;}
  body.touch .cap b{display:none;}
  body.touch #zoom button{min-width:50px;height:44px;font-size:16px;}


  /* 세로에서도 배치는 같다. 폭에 맞춰 줄어들 뿐이다. */

  body.portrait #panel .k{font-size:8.5px;}
  body.portrait #panel .v{font-size:12.5px;}
  body.portrait .steerBox .col{flex:0 0 54px;width:54px;}
  
  body.portrait #overlay.corner{padding:8px;align-items:flex-start;}
  body.portrait #overlay.corner .sheet{width:calc(100% - 16px);max-width:none;}

  /* 충전 점검표 — 지시서 안에 들어간다. 그때는 다른 정보가 필요 없다 */
  #chargeBox{display:none;margin-top:7px;padding-top:7px;border-top:1px solid var(--line);
    pointer-events:auto;}
  #chargeBox .ttl{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--ink-2);margin-bottom:5px;}
  #chargeBox ul{margin:0 0 8px;padding-left:14px;font-size:11.5px;line-height:1.65;color:var(--ok);font-weight:700;}
  #chargeBox li.no{color:var(--warn);}
  #chargeBox button{width:100%;padding:8px;border-radius:8px;border:1px solid #D8A104;
    background:var(--safety);font-family:inherit;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer;}
  #chargeBox button:disabled{background:var(--steel);border-color:var(--line);color:#9AA5AE;cursor:default;}

  .chg svg{display:block;width:100%;height:auto;margin-bottom:14px;}
  .chg .hs{cursor:pointer;}
  .chg .msg{font-size:13px;font-weight:700;line-height:1.5;margin-bottom:12px;min-height:38px;}
  .chg .msg.ng{color:var(--warn);} .chg .msg.ok{color:var(--ok);}
  .chg .bar{height:14px;border-radius:7px;background:var(--steel);border:1px solid var(--line);overflow:hidden;margin-bottom:6px;}
  .chg .bar i{display:block;height:100%;background:var(--ok);width:0%;}
  .chg .pct{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--ink-2);margin-bottom:14px;}

  /* 첫 진입 안내 — 실제 버튼을 짚어가며 하나씩 보여준다 */
  #tour{position:absolute;display:none;width:min(74vw,300px);z-index:12;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;box-shadow:0 6px 22px rgba(29,39,51,.22);pointer-events:auto;}
  #tour .ttl{font-size:14px;font-weight:800;margin-bottom:4px;}
  #tour .txt{font-size:12px;color:var(--ink-2);line-height:1.55;margin-bottom:10px;}
  #tour .foot{display:flex;align-items:center;gap:8px;}
  #tour .n{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--ink-2);flex:1;}
  #tour button{padding:7px 12px;border-radius:8px;font-family:inherit;
    font-size:12.5px;font-weight:800;cursor:pointer;border:1px solid var(--line);}
  #tour .skip{background:#E7EDF3;color:var(--ink-2);}
  #tour .next{background:var(--safety);border-color:#D8A104;color:var(--ink);}
  .tourHit{animation:tourBlink 1s ease-in-out infinite;}
  @keyframes tourBlink{
    0%,100%{box-shadow:0 0 0 0 rgba(242,183,5,0);}
    50%{box-shadow:0 0 0 5px rgba(242,183,5,.85);}
  }
  #tourRing{position:absolute;display:none;border:3px solid var(--safety);border-radius:12px;
    pointer-events:none;z-index:11;animation:tourBlink 1s ease-in-out infinite;}

  #guide{position:absolute;display:none;align-items:center;gap:6px;transform:translate(-50%,-50%);
    background:#17A673;color:#fff;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;
    box-shadow:0 2px 10px rgba(29,39,51,.25);}
  #guideArrow{display:inline-block;font-size:14px;line-height:1;}

  #zoom{right:12px;top:74px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;
    justify-content:flex-end;pointer-events:auto;
    opacity:.70;transition:opacity .16s;background:rgba(241,245,248,.78);}
  #zoom:hover, #zoom.live{opacity:1;background:rgba(241,245,248,.96);}
  #zoom.closed{opacity:.55;}
  #zoom.closed.live{opacity:1;}
  #zoom.up{top:12px;}
  #zoomItems{display:contents;}
  #zoom.closed #zoomItems{display:none;}
  #btnBar{font-size:17px;letter-spacing:1px;}
  @keyframes barBlink{
    0%,100%{background:var(--steel);border-color:var(--line);color:var(--ink);}
    50%{background:var(--safety);border-color:#D8A104;color:var(--ink);}
  }
  #btnBar.blink{animation:barBlink 1.05s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){ #btnBar.blink{animation:none;background:var(--safety);} }
  #zoom button.hide{display:none;}
  #zoom button.on{background:var(--safety);border-color:#D8A104;}
  #zoom button.off{color:#9AA5AE;text-decoration:line-through;}
  #zoom button{min-width:42px;height:36px;padding:0 8px;border-radius:8px;border:1px solid var(--line);
    background:var(--steel);font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;line-height:1;}

  .sheet table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px;}
  .sheet table td, .sheet table th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;}
  .sheet table th{font-size:11px;color:var(--ink-2);font-weight:800;letter-spacing:.04em;}
  .sheet table .num{text-align:right;font-family:var(--mono);font-weight:700;}
  .sheet table .dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);}
  .sheet table.calc td{color:var(--ink-2);}
  .sheet table.calc tr.sum td{color:var(--ink);font-weight:800;font-size:15px;border-bottom:none;}
  .sheet table .none{color:var(--ink-2);text-align:center;padding:20px 0;}
  .namebox{margin-bottom:14px;}
  .namebox input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);}
  .namebox input:focus{outline:3px solid #3F7FD1;outline-offset:1px;}
  .namebox .hint{font-size:11.5px;color:var(--ink-2);font-weight:700;margin-top:6px;}

  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(215,224,232,.94);pointer-events:auto;overflow:auto;
    touch-action:pan-y;overscroll-behavior:contain;}
  #overlay.hide{display:none;}
  /* 충전처럼 화면을 다 덮을 필요가 없는 것은 왼쪽 위에 붙인다 */
  #overlay.corner{background:transparent;align-items:flex-start;justify-content:flex-start;
    pointer-events:none;padding:12px;}
  #overlay.corner .sheet{pointer-events:auto;margin:0;width:min(46vw,400px);
    padding:16px 18px;max-height:calc(100% - 24px);overflow:auto;
    box-shadow:0 8px 30px rgba(29,39,51,.22);}
  #overlay.corner .sheet h1{font-size:18px;}
  #overlay.corner .sheet .sub{font-size:12px;margin-bottom:10px;}
  #overlay.corner .chg svg{margin-bottom:10px;}
  #overlay.corner .chg .msg{font-size:12.5px;min-height:34px;margin-bottom:10px;}
  #overlay.corner .btn{min-width:0;padding:11px 12px;font-size:13px;}
  body.touch #overlay.corner .sheet{width:min(52vw,380px);}
  .sheet{background:#F1F5F8;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 30px rgba(29,39,51,.12);padding:26px 28px;width:min(92vw,470px);margin:auto;}
  .sheet h1{font-size:22px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em;}
  .sheet .sub{font-size:13px;color:var(--ink-2);margin-bottom:16px;}
  .sheet ul{margin:0 0 18px;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.75;}
  .sheet ul b{color:var(--ink);}
  .sheet .row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{flex:1;min-width:150px;padding:13px 16px;border-radius:10px;border:1px solid var(--line);
    background:#E7EDF3;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;}
  .btn.primary{background:var(--safety);border-color:#D8A104;}
  .btn:focus-visible{outline:3px solid #3F7FD1;outline-offset:2px;}
  .result{display:flex;gap:22px;margin-bottom:20px;}

function updateLabels(){
  const near = [];
  const push = (p, y, z, id)=>{
    const d = Math.hypot(truck.x - p.x, truck.z - p.z);
    if(d < 26) near.push({ d:d, x:p.x, y:y, z:z, id:id });
  };
  for(const s of slots) push(s, s.y + 0.42, s.labelZ, s.id);
  for(const z0 of zones) push(z0, 0.55, z0.z + 0.78, z0.id);
  near.sort((a,b)=> a.d - b.d);
  for(let i=0;i<LABEL_N;i++){
    const L = labelPool[i], t = near[i];
    if(!t){ L.spr.visible = false; L.id = null; continue; }
    L.spr.visible = true;
    L.spr.position.set(t.x, t.y, t.z);
    if(L.id !== t.id){ L.id = t.id; paintLabel(L, t.id); }
  }
}

const PAL_KINDS = [
  { n:'아주렌탈', deck:0x9FBE38, foot:0x86A32C },
  { n:'KPP',      deck:0x7A2333, foot:0x5F1A27 }

let _deckTex = null, _palMat = null;
function palletDeckTex(){
  if(_deckTex) return _deckTex;
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(0,0,0,.26)'; g.lineWidth = 5;
  for(let i=18;i<128;i+=23){
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 128); g.stroke();
    g.beginPath(); g.moveTo(0, i); g.lineTo(128, i); g.stroke();
  }
  g.strokeStyle = 'rgba(0,0,0,.42)'; g.lineWidth = 9;
  g.strokeRect(5, 5, 118, 118);
  _deckTex = new THREE.CanvasTexture(c);
  return _deckTex;
}
function palMats(){
  if(_palMat) return _palMat;
  _palMat = PAL_KINDS.map(k=>({
    deck: new THREE.MeshStandardMaterial({ color:k.deck, map:palletDeckTex(), roughness:0.55 }),
    foot: new THREE.MeshStandardMaterial({ color:k.foot, roughness:0.6 })
  }));
  return _palMat;
}
function makePallet(seed){
  const g = new THREE.Group();
  const m = palMats()[(seed || 0) % PAL_KINDS.length];
  // 상판 — 격자무늬 성형면
  const deck = new THREE.Mesh(new THREE.BoxGeometry(1.10, 0.050, 1.10), m.deck);
  deck.position.y = 0.125; deck.castShadow = true; g.add(deck);
  // 다리 9개 — 사방 어디서든 지겟발이 들어간다
  const fi = new THREE.InstancedMesh(new THREE.BoxGeometry(0.20, 0.100, 0.20), m.foot, 9);
  const mx = new THREE.Matrix4();
  let k = 0;
  for(const bx of [-0.43, 0, 0.43]) for(const bz of [-0.43, 0, 0.43]){
    mx.makeTranslation(bx, 0.050, bz); fi.setMatrixAt(k++, mx);
  }
  fi.instanceMatrix.needsUpdate = true;
  g.add(fi);
  return g;
}

function makeLoad(seed){
  const g = new THREE.Group();
  const n = 1 + (seed % 3);
  for(let i=0;i<n;i++){
    const c = COLOR.box[(seed + i) % COLOR.box.length];
    const w = 0.44 + ((seed+i)%3)*0.06;
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, 0.34, w), mat(c, 0.9));
    b.position.set(((i%2)?1:-1)*0.24, 0.15 + 0.34*Math.floor(i/2) + 0.17, ((i%3)-1)*0.20);
    b.rotation.y = ((seed*7+i*13)%20 - 10) * 0.01;
    b.castShadow = true; g.add(b);
  }

function makeRackRow(row){
  const g = new THREE.Group();
  const step = 2.7, span = step*row.n;
  const upGeo = new THREE.BoxGeometry(0.11, 4.4, 0.11);
  const upMat = mat(COLOR.upright, 0.6);
  const cnt = (row.n + 1) * 2;
  const im = new THREE.InstancedMesh(upGeo, upMat, cnt);
  im.castShadow = true;
  const m = new THREE.Matrix4();
  let k = 0;
  for(let i=0;i<=row.n;i++){
    const x = row.x0 - step/2 + i*step;
    for(const dz of [-0.5, 0.5]){
      m.makeTranslation(x, 2.2, row.z + dz);
      im.setMatrixAt(k++, m);
    }
  }
  im.instanceMatrix.needsUpdate = true;
  g.add(im);

  const bmMat = mat(COLOR.beam, 0.55);
  for(let l=1;l<LEVEL_Y.length;l++){
    const y = LEVEL_Y[l] - 0.09;
    for(const dz of [-0.5, 0.5]){
      const b = new THREE.Mesh(new THREE.BoxGeometry(span + 0.2, 0.14, 0.08), bmMat);
      b.position.set(row.x0 + span/2 - step/2, y, row.z + dz);
      b.castShadow = true; g.add(b);
    }
  }
  return g;
}

const seeThrough = [];
function markSeeThrough(m, faint){
  m.material = m.material.clone();
  m.userData.faint = !!faint;
  m.userData.shadowOrig = !!m.castShadow;
  seeThrough.push(m);
  return m;
}
let seeThroughOn = null;
function setSeeThrough(on){
  if(seeThroughOn === on) return;
  seeThroughOn = on;
  for(const m of seeThrough){
    m.material.transparent = on;
    m.material.opacity = on ? (m.userData.faint ? 0.12 : 0.20) : 1;
    m.material.depthWrite = !on;
    m.material.needsUpdate = true;
    m.castShadow = on ? false : m.userData.shadowOrig;
  }
}

function floorTexture(base, lineCol, cell){
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,128,128);
  g.strokeStyle = lineCol; g.lineWidth = 2;
  g.beginPath(); g.moveTo(0,0); g.lineTo(128,0); g.moveTo(0,0); g.lineTo(0,128); g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(cell, cell);
  return t;
}

function addPaint(x, z, w, d, col, rot){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d),
    new THREE.MeshBasicMaterial({color:col===undefined?COLOR.line:col}));
  m.rotation.x = -Math.PI/2;
  if(rot) m.rotation.z = rot;
  m.position.set(x, 0.006, z);
  scene.add(m);
  return m;
}

  for(let px=-33; px<=33; px+=16.5) for(let pz=6; pz<=78; pz+=14.4){

  /* 도로 위 차량 */

function place(id){ return slots.find(v=>v.id===id) || zones.find(v=>v.id===id); }
function pal(id){ const s = place(id); return s ? s.pallet : null; }
function near(x, z, r){ return Math.hypot(truck.x - x, truck.z - z) < r; }

function spawnPallet(pl, seed){
  const g = new THREE.Group();
  g.rotation.order = 'YXZ';
  g.add(makePallet(seed));
  g.add(makeLoad(seed));
  scene.add(g);
  const cg = CARGO[(seed || 0) % CARGO.length];
  const p = {
    cargo:cg, w:cg.w,
    id:'P'+pallets.length, x:pl.x, z:pl.z, y:pl.y, yaw:pl.yaw||0, pitch:0, pickY:pl.y,
    mesh:g, slot:null, zone:null, carried:false, inserted:false, broken:false, fallV:0, falling:false
  };
  if(pl.kind === 'slot'){ p.slot = pl; pl.pallet = p; } else { p.zone = pl; pl.pallet = p; }
  pallets.push(p);
  return p;
}

function setupPallets(){
  ['2F-A1-1-1','2F-A1-2-2','2F-A1-3-1','2F-A1-5-2','2F-A1-6-1','2F-A1-7-3']
    .forEach((id, i)=>{ const s = place(id); if(s) spawnPallet(s, i+1); });
  ['2F-C1-1-1','2F-C1-4-1','2F-C1-7-1','2F-C1-10-1']
    .forEach((id, i)=>{ const s = place(id); if(s) spawnPallet(s, 7+i); });
  // 안쪽 랙과 평치에도 흩어놓는다
  let n = 11;
  for(const row of ['A2','A3','A4','A5','A6','A7']){
    for(const b of [5, 15]){
      for(const l of [1, 2]){
        const s = place('2F-' + row + '-' + b + '-' + l);
        if(s && !s.pallet && Math.random() < 0.5) spawnPallet(s, n++);
      }
    }
  }
  for(let i=1;i<=24;i+=6){
    const s = place('2F-C2-' + i + '-1');
    if(s && !s.pallet) spawnPallet(s, n++);
  }
}

function forkBase(){
  const d = CFG.mastBase + truck.reach;
  return { x: truck.x + dirX(truck.h)*d, z: truck.z + dirZ(truck.h)*d };
}
function carryPose(){
  const fb = forkBase();
  return { x: fb.x + dirX(truck.h)*0.68, z: fb.z + dirZ(truck.h)*0.68 };
}
function relToFork(p){
  const fb = forkBase();
  const rx = p.x - fb.x, rz = p.z - fb.z;
  return {
    long: rx*dirX(truck.h) + rz*dirZ(truck.h),
    lat:  rx*nrmX(truck.h) + rz*nrmZ(truck.h),
    ang:  wrapQuarter(p.yaw - truck.h)
  };
}

function bindControls(){
  const wrap = document.getElementById('wheelWrap');
  const svg = document.getElementById('wheelSvg');
  let wDrag = false, wLast = 0;
  const angleOf = e=>{
    const r = wrap.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height/2), e.clientX - (r.left + r.width/2));
  };
  /* 중심에 가까울수록 손가락이 조금만 움직여도 각도가 크게 튄다.
     안쪽 구역에서는 각도를 이어받기만 하고 돌리지는 않는다. */
  const radOf = e=>{
    const r = wrap.getBoundingClientRect();
    return Math.hypot(e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2))
           / (r.width/2 || 1);
  };
  wrap.addEventListener('pointerdown', e=>{
    e.preventDefault(); wDrag = true; wLast = angleOf(e);
    try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
  });
  wrap.addEventListener('pointermove', e=>{
    if(!wDrag) return;
    e.preventDefault();
    const a = angleOf(e);
    let d = a - wLast;
    while(d >  Math.PI) d -= 2*Math.PI;
    while(d < -Math.PI) d += 2*Math.PI;
    wLast = a;
    if(radOf(e) < 0.30) return;            // 축 근처는 무시
    d = clamp(d, -0.6, 0.6);               // 한 번에 튀는 양 제한
    G.wheel = clamp(G.wheel + d, -CFG.wheelMax, CFG.wheelMax);
  });
  const wEnd = ()=>{ wDrag = false; };
  wrap.addEventListener('pointerup', wEnd);
  wrap.addEventListener('pointercancel', wEnd);
  wrap.addEventListener('lostpointercapture', wEnd);
  svg.style.pointerEvents = 'none';

  document.querySelectorAll('.lever').forEach(el=>{
    const name = el.getAttribute('data-lever');
    const L = levers[name];
    const slot = el.querySelector('.slot');
    let sy = 0, sv = 0;
    slot.addEventListener('pointerdown', e=>{
      e.preventDefault(); L.drag = true; sy = e.clientY; sv = L.val;
      el.classList.add('act'); buzz(12);
      try{ slot.setPointerCapture(e.pointerId); }catch(err){}
    });
    slot.addEventListener('pointermove', e=>{
      if(!L.drag) return;
      L.val = clamp(sv + (sy - e.clientY)/((L.h/2) - 15), -1, 1);
    });
    const end = ()=>{ if(L.drag){ L.drag = false; L.val = 0; el.classList.remove('act'); } };
    slot.addEventListener('pointerup', end);
    slot.addEventListener('pointercancel', end);
    slot.addEventListener('lostpointercapture', end);
  });

  // 손을 대고 있는 동안만 조작반이 진해진다
  let liveT = null;
  window.addEventListener('pointerdown', e=>{
    const c = e.target.closest && e.target.closest('.ctl, #task, #zoom');
    if(!c) return;
    c.classList.add('live');
    if(liveT) clearTimeout(liveT);
  }, true);
  window.addEventListener('pointerup', ()=>{
    if(liveT) clearTimeout(liveT);
    liveT = setTimeout(()=>{
      const l = document.querySelectorAll('.live');
      for(let i=0;i<l.length;i++) l[i].classList.remove('live');
    }, 1400);
  }, true);

  window.addEventListener('pointerup', releaseLevers);
  window.addEventListener('pointercancel', releaseLevers);
  window.addEventListener('blur', releaseLevers);

  const thrEl = document.getElementById('thr');
  const thrSlot = thrEl.querySelector('.slot');
  let ty = 0, tv = 0;
  thrSlot.addEventListener('pointerdown', e=>{
    e.preventDefault(); THR.drag = true; ty = e.clientY; tv = G.throttle;
    thrEl.classList.add('act'); buzz(12);
    try{ thrSlot.setPointerCapture(e.pointerId); }catch(err){}
  });
  thrSlot.addEventListener('pointermove', e=>{
    if(!THR.drag) return;
    G.throttle = clamp(tv + (ty - e.clientY)/((THR.h/2) - 16), -1, 1);
  });
  const tEnd = ()=>{ if(THR.drag){ THR.drag = false; G.throttle = 0; thrEl.classList.remove('act'); } };
  thrSlot.addEventListener('pointerup', tEnd);
  thrSlot.addEventListener('pointercancel', tEnd);
  thrSlot.addEventListener('lostpointercapture', tEnd);

  const hornEl = document.getElementById('horn');
  hornEl.addEventListener('pointerdown', e=>{
    e.preventDefault(); resumeAudio(); setHorn(true);
    try{ hornEl.setPointerCapture(e.pointerId); }catch(err){}
  });
  const hOff = ()=> setHorn(false);
  hornEl.addEventListener('pointerup', hOff);
  hornEl.addEventListener('pointercancel', hOff);
  hornEl.addEventListener('lostpointercapture', hOff);

  document.getElementById('tourNext').addEventListener('click', e=>{ e.stopPropagation(); tourNext(); });
  document.getElementById('tourSkip').addEventListener('click', e=>{ e.stopPropagation(); tourEnd(); });

  const ped = document.getElementById('pedal');
  ped.addEventListener('pointerdown', e=> e.stopPropagation());
  ped.addEventListener('click', e=>{ e.stopPropagation(); setPedal(!G.pedal); buzz(18); });

  document.getElementById('chargeStart').addEventListener('click', ()=>{
    if(chargeChecks().every(c=>c.ok)) openCharge();
  });
  document.getElementById('btnExit').addEventListener('click', ()=>{
    if(G.mode === 'menu') return;
    if(history.state && history.state.sim) history.back(); else backToMenu();
  });
  document.getElementById('btnMute').addEventListener('click', e=>{
    resumeAudio(); SND.on = !SND.on;
    e.target.classList.toggle('off', !SND.on);
  });
  document.getElementById('zoom').addEventListener('click', e=>{
    if(e.target.getAttribute('data-b')){ toggleBar(); return; }
    if(e.target.getAttribute('data-v')){ cycleView(); return; }
    if(e.target.getAttribute('data-r')){ toggleRear(); return; }
    if(e.target.getAttribute('data-f')){ toggleFull(); return; }
    if(e.target.getAttribute('data-m')){ toggleMap(); return; }
    if(e.target.getAttribute('data-u')){ cycleUi(); return; }
    const z = e.target.getAttribute('data-z');
    if(!z) return;
    G.zoom = clamp(G.zoom * (z === 'in' ? 0.82 : 1.22), 0.70, 3.6);
  });

  const cv = document.getElementById('scene');
  cv.addEventListener('wheel', e=>{
    e.preventDefault();
    G.zoom = clamp(G.zoom * (1 + Math.sign(e.deltaY)*0.10), 0.70, 3.8);
  }, {passive:false});

  let pDrag = false, pLX = 0, pLY = 0;
  cv.addEventListener('pointerdown', e=>{
    e.preventDefault(); resumeAudio();
    pDrag = true; pLX = e.clientX; pLY = e.clientY;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  });
  cv.addEventListener('pointermove', e=>{
    if(!pDrag) return;
    e.preventDefault();
    const dx = e.clientX - pLX, dy = e.clientY - pLY;
    pLX = e.clientX; pLY = e.clientY;
    const k = 0.021 * camera.userData.z;
    G.pan.x -= (dx*0.913 + dy*0.408) * k;
    G.pan.z -= (dx*-0.408 + dy*0.913) * k;
    const d = Math.hypot(G.pan.x, G.pan.z);
    if(d > 130){ G.pan.x *= 130/d; G.pan.z *= 130/d; }
  });
  const pEnd = ()=>{ pDrag = false; };
  cv.addEventListener('pointerup', pEnd);
  cv.addEventListener('pointercancel', pEnd);
  cv.addEventListener('lostpointercapture', pEnd);

  document.addEventListener('touchmove', e=>{
    const ov = document.getElementById('overlay');
    if(!ov.classList.contains('hide') && ov.contains(e.target)) return;
    if(e.cancelable) e.preventDefault();
  }, { passive:false });
  document.addEventListener('gesturestart', e=> e.preventDefault());
  document.addEventListener('dblclick', e=> e.preventDefault());

  const block = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '];
  window.addEventListener('keydown', e=>{
    if(e.target && e.target.tagName === 'INPUT') return;
    if(e.key === 'Escape'){ if(G.mode !== 'menu'){ if(history.state && history.state.sim) history.back(); else backToMenu(); } return; }
    if(block.indexOf(e.key) >= 0) e.preventDefault();
    const k = e.key.toLowerCase();
    if(!e.repeat && k === ' ') setPedal(!G.pedal);
    if(!e.repeat && k === 'h') setHorn(true);
    keys[k] = true;
  });
  window.addEventListener('keyup', e=>{
    if(e.target && e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if(k === 'h') setHorn(false);
    keys[k] = false;
  });
  window.addEventListener('blur', ()=>{ for(const k in keys) keys[k] = false; setHorn(false); });
}

function readControls(dt){
  let ws = 0;
  if(keys['a'] || keys['arrowleft'])  ws -= 1;
  if(keys['d'] || keys['arrowright']) ws += 1;
  if(ws !== 0){
    G.wheelHold += dt;
    const t = Math.min(G.wheelHold / CFG.wheelRamp, 1);
    const rate = CFG.wheelRate0 + (CFG.wheelRate1 - CFG.wheelRate0) * t;
    G.wheel = clamp(G.wheel + ws*rate*dt, -CFG.wheelMax, CFG.wheelMax);
  }else G.wheelHold = 0;

  if(!THR.drag){
    const ti = ((keys['w'] || keys['arrowup']) ? 1 : 0) - ((keys['s'] || keys['arrowdown']) ? 1 : 0);
    if(ti !== 0) G.throttle = clamp(G.throttle + ti * dt / CFG.thrRise, -1, 1);
    else{
      const s = Math.sign(G.throttle);
      G.throttle -= s * Math.min(Math.abs(G.throttle), dt / CFG.thrFall);
    }
  }

  const kb = {
    lift:  (keys['f']?1:0) - (keys['r']?1:0),
    reach: (keys['e']?1:0) - (keys['q']?1:0),
    tilt:  (keys['g']?1:0) - (keys['t']?1:0)
  };
  const sticky = !!G.defects.ctrl;
  if(sticky && (kb.lift || kb.reach || kb.tilt)) defectHit('ctrl');
  for(const n in kb){
    const L = levers[n];
    if(L.drag) continue;
    if(sticky) L.val += (kb[n] - L.val) * (1 - Math.exp(-2.0*dt));
    else L.val = kb[n];
  }

  /* 핸들을 돌리는 동안 걸림쇠처럼 짧게 떤다. 8도마다 한 번. */
  const dw = Math.abs(G.wheel - G.wheelLast);
  G.wheelLast = G.wheel;
  if(dw > 0.0002){
    G.wheelAcc += dw;
    if(G.wheelAcc > 0.14){ G.wheelAcc = 0; buzz(6); }
    if(Math.abs(G.wheel) >= CFG.wheelMax - 1e-6 && !G.wheelLock){ G.wheelLock = true; buzz(28); }
  }else G.wheelAcc = Math.max(0, G.wheelAcc - 0.02);
  if(Math.abs(G.wheel) < CFG.wheelMax - 0.02) G.wheelLock = false;

  truck.steer = (G.wheel / CFG.wheelMax) * CFG.steerMax;
}

function releaseLevers(){
  G.throttle = 0;
  if(G.defects.ctrl){
    // 조종장치 결함 — 손을 떼도 곧바로 중립으로 돌아오지 않는다
    const thrEl0 = document.getElementById('thr');
    if(thrEl0){ THR.drag = false; thrEl0.classList.remove('act'); }
    for(const n in levers){
      const L = levers[n];
      if(L.drag){ L.drag = false; if(L.el) L.el.classList.remove('act'); }
      L.val *= 0.7;
    }
    setHorn(false);
    return;
  }
  const thrEl = document.getElementById('thr');
  if(thrEl){ THR.drag = false; thrEl.classList.remove('act'); }
  for(const n in levers){
    const L = levers[n];
    if(L.drag){ L.drag = false; if(L.el) L.el.classList.remove('act'); }
    L.val = 0;
  }
  setHorn(false);
}

function paintControls(){
  document.getElementById('wheelSvg').style.transform = 'rotate(' + (G.wheel*180/Math.PI) + 'deg)';
  const deg = Math.abs(G.wheel)*180/Math.PI;
  const off = deg > 6, left = G.wheel < 0;
  const wk = document.getElementById('wheelKnob');
  wk.setAttribute('fill', off ? (left ? '#D93025' : '#1A73E8') : '#F2B705');
  wk.setAttribute('stroke', off ? (left ? '#8E1D16' : '#0F4A9C') : '#8B6E06');

  for(const n in levers){
    const L = levers[n];
    if(!L.knob) continue;
    const c = L.h/2, tr = c - 15, top = c - L.val*tr;
    L.knob.style.top = top + 'px';
    L.stem.style.top = (L.val > 0 ? top : c) + 'px';
    L.stem.style.height = Math.abs(c - top) + 'px';
  }
  const tk = document.querySelector('#thr .knob'), ts = document.querySelector('#thr .stem');
  if(tk){
    const c = THR.h/2, tr = c - 16, top = c - G.throttle*tr;
    tk.style.top = top + 'px';
    ts.style.top = (G.throttle > 0 ? top : c) + 'px';
    ts.style.height = Math.abs(c - top) + 'px';
  }
  document.getElementById('horn').classList.toggle('on', G.horn);
}

   주행
   ============================================================ */
/* 짐이 무거울수록 마스트가 아래로 처진다. 그래서 더 젖혀야 수평이 된다. */
/* 못 찾은 결함이 실제로 드러나는 순간, 왜 그런지 한 번 알려준다.
   모르면 그냥 버그로 보인다. */
function defectHit(k){
  if(!G.defects[k] || G.defectSeen[k]) return;
  G.defectSeen[k] = true;
  const d = DEFECTS.find(v=> v.k === k);
  if(!d) return;
  toast(d.n + ' 결함 · 시업점검에서 놓친 항목입니다');
  thud(0.25);
}

function loadRatio(){ return truck.carry ? clamp((truck.carry.w || 0)/RATED_KG, 0, 1.3) : 0; }
function forkDroop(){
  return 0.060 * loadRatio() * (0.45 + 0.55 * clamp(truck.lift/CFG.liftMax, 0, 1));
}
/* 레버로 준 각도에서 처짐을 빼고 흔들림을 더한 것이 실제 지겟발 각도 */
function forkAngle(){ return truck.tilt - forkDroop() + G.sway; }

function updateSway(dt){
  const wR = loadRatio();
  const hi = clamp(truck.lift/CFG.liftMax, 0, 1);
  if(wR < 0.02 && Math.abs(G.sway) < 1e-4 && Math.abs(G.swayV) < 1e-4){
    G.sway = 0; G.swayV = 0; G.lastV = truck.v; return;
  }
  // 무겁고 높을수록 느리게, 오래 흔들린다
  const stiff = 32 - 17*wR - 8*hi;
  const damp  = 4.2 - 2.2*wR - 0.8*hi;
  const imp = (truck.v - G.lastV) * 0.85 * wR * (0.25 + 0.75*hi)
            + (-levers.lift.val) * CFG.liftSpeed * dt * 1.6 * wR * hi;
  G.swayV += (-stiff*G.sway - damp*G.swayV) * dt + imp;
  G.sway = clamp(G.sway + G.swayV*dt, -0.075, 0.075);
  G.lastV = truck.v;
}

function speedCap(){
  let cap = Infinity;
  if(G.defects.wheel && Math.abs(truck.v) > 0.6){ cap = Math.min(cap, CFG.maxFwd*0.78); defectHit('wheel'); }
  if(truck.carry) cap = Math.min(cap, CFG.maxFwd*(1 - 0.30*loadRatio()));
  if(truck.lift > CFG.liftTip)   cap = Math.min(cap, 0.70);
  else if(truck.lift > 1.00)     cap = Math.min(cap, 1.10);
  if(truck.reach > CFG.reachOut) cap = Math.min(cap, 0.55);
  if(G.batt <= 0)                cap = Math.min(cap, 0.35);
  else if(G.batt < 20)           cap = Math.min(cap, 0.85);
  return cap;
}

function confine(prevZ){
  // 셔터가 열려 있고 문 안에 있을 때만 벽을 통과한다
  const gateOk = G.outUnlocked && GATES.some(gx=> Math.abs(truck.x - gx) < 3.3);
  if(!gateOk){
    if(prevZ <= WALL_Z && truck.z > IN.z1){ truck.z = IN.z1; truck.v *= 0.2; }
    if(prevZ >  WALL_Z && truck.z < WALL_Z + 1.2){ truck.z = WALL_Z + 1.2; truck.v *= 0.2; }
  }
  if(truck.z < WALL_Z){
    truck.x = clamp(truck.x, -IN.x, IN.x);
    truck.z = Math.max(truck.z, IN.z0);
  }else{
    truck.x = clamp(truck.x, -OUT.x, OUT.x);
    truck.z = Math.min(truck.z, OUT.z1);
  }
}

function drive(dt){
  let target = 0;
  if(G.pedal && G.throttle !== 0){
    const mx = G.throttle > 0 ? CFG.maxFwd : CFG.maxRev;
    target = G.throttle * mx;
    const cap = speedCap();
    if(Math.abs(target) > cap) target = Math.sign(target) * cap;
  }
  if(target !== 0){
    const rate = (Math.sign(target) !== Math.sign(truck.v) && truck.v !== 0) ? CFG.brake : CFG.accel;
    truck.v += clamp(target - truck.v, -rate*dt, rate*dt);
  }else{
    let rate = G.pedal ? CFG.coast : CFG.brake;
    if(G.defects.brake){ rate *= 0.45; if(Math.abs(truck.v) > 0.8) defectHit('brake'); }
    const s = Math.sign(truck.v);
    truck.v -= s * Math.min(Math.abs(truck.v), rate*dt);
  }

  const px = truck.x, pz = truck.z;
  const h0 = truck.h;
  truck.h += (-truck.v * Math.sin(truck.steer) / CFG.wheelBase) * dt;
  const md = h0 + truck.steer;
  truck.x += Math.sin(md) * truck.v * dt;
  truck.z += Math.cos(md) * truck.v * dt;
  truck.h = wrapPi(truck.h);

  const bx = truck.x, bz = truck.z;
  confine(pz);
  if((bx !== truck.x || bz !== truck.z) && Math.abs(truck.v) > 0.9 && G.bumpCool <= 0){
    toast('벽 접촉'); impact('concrete', 1.0); G.damage += 1; G.bumpCool = 1.5;
  }
  if(G.bumpCool > 0) G.bumpCool -= dt;

  for(const o of obstacles){
    const dx = truck.x - o.x, dz = truck.z - o.z;
    const d = Math.hypot(dx, dz);
    if(d < o.r + 0.55 && d > 0.0001){
      if(!o.hit){
        o.hit = true; G.drillMiss++;
        impact(o.cone ? 'plastic' : 'steel', 0.9);
        toast(o.cone ? '콘 접촉' : '벽 접촉'); drillTask();
      }
      if(o.cone && o.mesh){ o.mesh.position.x += dx/d*0.4; o.mesh.position.z += dz/d*0.4; o.mesh.rotation.z = 0.9; }
      else{
        const push = (o.r + 0.55 - d);
        truck.x += dx/d*push; truck.z += dz/d*push; truck.v *= 0.3;
      }
    }
  }

  // 랙 충돌 — 마스트는 들어가야 하니 차체만 막는다
  for(const row of ALL_ROWS){
    const x0 = row.x0 - 1.35, x1 = row.x0 + row.n*2.7 - 1.35;
    if(truck.x < x0 - 0.7 || truck.x > x1 + 0.7) continue;
    const dz = truck.z - row.z;
    const lim = 1.42;
    if(Math.abs(dz) < lim){
      truck.z = row.z + (dz >= 0 ? lim : -lim);
      if(Math.abs(truck.v) > 0.7 && G.bumpCool <= 0){
        toast('랙 접촉'); impact('steel', 1.0); G.damage += 1; G.bumpCool = 1.5;
      }
      truck.v *= 0.22;
    }
  }

  for(const q of PILLARS){
    for(const pt of [{x:truck.x, z:truck.z},
                     {x:truck.x + dirX(truck.h)*1.0, z:truck.z + dirZ(truck.h)*1.0}]){
      const dx = pt.x - q.x, dz = pt.z - q.z;
      const d = Math.hypot(dx, dz);
      if(d < 0.95 && d > 0.0001){
        const push = (0.95 - d);
        truck.x += dx/d * push; truck.z += dz/d * push;
        if(Math.abs(truck.v) > 0.8 && G.bumpCool <= 0){
          toast('기둥 접촉'); impact('concrete', 1.1); G.damage += 1; G.bumpCool = 1.5;
        }
        truck.v *= 0.25;
      }
    }
  }

  G.dist += Math.hypot(truck.x - px, truck.z - pz);

  let hyd = G.batt <= 0 ? 0.40 : 1;
  if(G.defects.chain){ hyd *= 0.55; if(Math.abs(levers.lift.val) > 0.05) defectHit('chain'); }
  hyd *= 1 - 0.42*loadRatio();          // 무거우면 유압이 굼뜨다
  const lift0 = truck.lift, reach0 = truck.reach;
  truck.lift  = clamp(truck.lift  - levers.lift.val  * CFG.liftSpeed  * hyd * dt, 0, CFG.liftMax);
  // 누유 — 올려둔 포크가 저절로 내려간다
  if(G.defects.hose && truck.lift > 0.25 && Math.abs(levers.lift.val) < 0.05){
    truck.lift = Math.max(0, truck.lift - 0.055*dt);
    defectHit('hose');
  }
  // 편마모 — 주행 중 잔진동
  if(G.defects.wheel && Math.abs(truck.v) > 0.4){
    G.jolt += dt;
    if(G.jolt > 0.9){ G.jolt = 0; thud(0.10); }
  }
  truck.reach = clamp(truck.reach + levers.reach.val * CFG.reachSpeed * hyd * dt, 0, CFG.reachMax);
  truck.tilt  = clamp(truck.tilt  - levers.tilt.val  * CFG.tiltSpeed  * hyd * dt, -CFG.tiltFwd, CFG.tiltBack);

  // 정격 초과 — 그 높이 이상으로는 올라가지 않는다
  if(truck.carry){
    const lim = maxLiftFor(truck.carry.w || 0);
    if(truck.lift > lim){
      truck.lift = lim;
      if(levers.lift.val < -0.05 && G.capCool <= 0){
        G.capCool = 2.4;
        toast('정격 초과 · 이 높이가 한계입니다');
      }
    }
  }
  if(G.capCool > 0) G.capCool -= dt;

  updateSway(dt);

  SND.relief =
    (Math.abs(levers.lift.val)  > 0.05 && truck.lift  === lift0  && (truck.lift <= 0 || truck.lift >= CFG.liftMax)) ||
    (Math.abs(levers.reach.val) > 0.05 && truck.reach === reach0 && (truck.reach <= 0 || truck.reach >= CFG.reachMax));
}

/* ============================================================
   포크 - 팔레트
   ============================================================ */
/* 놓을 자리 판정.
   예전에는 범위 안에서 가장 높은 칸을 골랐다. 그러다 보니 등을 맞댄 뒷줄 랙이
   잡혀서, 팔레트가 1m 넘게 순간이동한 뒤 허용 오차를 벗어나 랙 안쪽으로
   떨어져 버렸다. 지금은 포크 높이와 거리로 가장 가까운 칸을 고른다. */
function supportUnder(x, z, lift){
  let best = { y:0, place:null, cost:Infinity };
  for(const s of slots){
    if(s.pallet) continue;
    const dx = Math.abs(x - s.x), dz = Math.abs(z - s.z);
    if(dx > 0.75 || dz > 0.75) continue;
    if(s.y > lift + 0.30) continue;
    const cost = Math.abs(lift - s.y)*2.0 + Math.hypot(dx, dz);
    if(cost < best.cost) best = { y:s.y, place:s, cost:cost };
  }
  for(const z0 of zones){
    if(z0.pallet) continue;
    const d = Math.hypot(x - z0.x, z - z0.z);
    if(d > 0.90) continue;
    const cost = lift*2.0 + d;
    if(cost < best.cost) best = { y:0, place:z0, cost:cost };
  }
  return best;
}

/* 랙 안쪽에 떨어지면 구조물에 가려 보이지도, 다시 집지도 못한다.
   통로 쪽으로 밀어내 눈에 보이게 한다. */
function nudgeOutOfRack(p){
  for(const row of ALL_ROWS){
    if(Math.abs(p.z - row.z) < 1.0){
      p.z = row.z + row.face * 1.75;
      return true;
    }
  }
  return false;
}

/* 지금 짐을 내려놓게 될 자리를 찾는다. 실제 적재 판정보다 넓게 잡아서
   자리에 들어가기 전부터 게이지가 보이도록 한다. */
function placeTarget(p){
  /* 실제로 놓이는 자리와 같은 기준으로 골라야 한다.
     예전에는 게이지는 가까운 칸, 실제 적재는 포크 높이에 가까운 칸을 골라서
     1단에 놓으라는데 2단 기준으로 높이가 표시되는 일이 있었다.
     지금 작업 대상으로 지정된 칸이 사정거리에 있으면 그걸 우선한다. */
  const goal = objectivePlace();
  if(goal && !goal.pallet &&
     Math.abs(p.x - goal.x) < 1.7 && Math.abs(p.z - goal.z) < 1.7 &&
     truck.lift - goal.y > -0.35 && truck.lift - goal.y < 1.10) return goal;

  let best = null, bc = Infinity;
  const take = (pl, d, dy)=>{
    const cost = Math.abs(dy)*2.0 + d;      // supportUnder 와 같은 기준
    if(cost < bc){ bc = cost; best = pl; }
  };
  for(const s0 of slots){
    if(s0.pallet) continue;
    const dx = p.x - s0.x, dz = p.z - s0.z;
    if(Math.abs(dx) > 1.7 || Math.abs(dz) > 1.7) continue;
    const dy = truck.lift - s0.y;
    if(dy < -0.35 || dy > 1.10) continue;
    take(s0, Math.hypot(dx, dz), dy);
  }
  for(const z0 of zones){
    if(z0.pallet) continue;
    const d = Math.hypot(p.x - z0.x, p.z - z0.z);
    if(d > 1.7 || truck.lift > 1.10) continue;
    take(z0, d, truck.lift);
  }
  return best;
}

/* 지금 지시받은 목적지 */
function objectivePlace(){
  if((G.mode === 'mission' || G.mode === 'rush') && G.mission && G.mission.to) return G.mission.to;
  if(G.mode === 'edu'){
    const st = TUT[G.step];
    if(st && st.highlight) return place(st.highlight);
  }
  return null;
}

function dropCarried(){
  const p = truck.carry;
  const pose = carryPose();
  p.x = pose.x; p.z = pose.z; p.yaw = truck.h;
  const sup = supportUnder(p.x, p.z, truck.lift);
  const tilted = Math.abs(forkAngle()) > CFG.putTilt;
  const onRack = sup.place && sup.place.kind === 'slot' && sup.place.y > 0.2;
  // 랙 단 위에 얹을 때만 기울기로 떨어진다. 바닥은 삐뚤게 놓일 뿐이다.
  if(tilted && onRack){ breakPallet(p, '마스트 기울어짐 · 낙하'); return; }
  if(tilted) toast('마스트를 수평으로 하고 내리세요');
  if(sup.place && sup.place.kind === 'slot'){
    const off = Math.hypot(p.x - sup.place.x, p.z - sup.place.z);
    const ang = Math.abs(wrapQuarter(p.yaw - sup.place.yaw));
    if(off <= CFG.putTolXZ && ang <= CFG.putTolAng){
      p.x = sup.place.x; p.z = sup.place.z; p.y = sup.place.y;
      p.yaw = sup.place.yaw + Math.round((p.yaw - sup.place.yaw)/(Math.PI/2))*(Math.PI/2);
      p.pitch = 0; p.slot = sup.place; sup.place.pallet = p;
      truck.carry = null; p.carried = false; p.inserted = true;
      blip(720, 0.13, 'triangle', 0.05); toast('적재 완료', true);
    }else breakPallet(p, '적재 위치 이탈 · 낙하');
  }else if(sup.place && sup.place.kind === 'zone'){
    p.x = sup.place.x; p.z = sup.place.z; p.y = 0; p.pitch = 0;
    p.zone = sup.place; sup.place.pallet = p;
    truck.carry = null; p.carried = false; p.inserted = true;
  }else{
    p.y = 0; p.pitch = 0;
    if(nudgeOutOfRack(p)) toast('랙 안쪽에는 놓을 수 없습니다');
    truck.carry = null; p.carried = false; p.inserted = true;
  }
}

function breakPallet(p, msg){
  // 연습에서는 부수지 않는다. 헛손질로만 세고 다시 놓는다
  if(G.mode === 'drill'){
    if(truck.carry === p) truck.carry = null;
    p.carried = false; p.inserted = false;
    G.drillMiss++;
    thud(0.28); toast(msg);
    if(G.drill === 'pick' && p === G.drillPallet){ pickStartPose(); pickSpawn(); }
    drillTask();
    return;
  }
  p.y = Math.max(p.y, 0);
  p.falling = true; p.fallV = 0; p.broken = true; p.pitch = 0;
  if(p.slot){ p.slot.pallet = null; p.slot = null; }
  if(p.zone){ p.zone.pallet = null; p.zone = null; }
  if(truck.carry === p) truck.carry = null;
  p.carried = false; p.inserted = false;
  nudgeOutOfRack(p);
  p.yaw += 0.35;
  G.damage += 1 + (p.cargo ? p.cargo.c : 0);
  thud(0.45);
  const obj = objectivePallet();
  toast(msg + (obj === p ? ' · 다시 실어 옮기세요' : ''));
}

function forkLogic(dt){
  if(truck.carry){
    const p = truck.carry;
    const pose = carryPose();
    p.x = pose.x; p.z = pose.z; p.yaw = truck.h; p.y = truck.lift; p.pitch = -forkAngle();

    let overRack = false;
    for(const row of ALL_ROWS) if(Math.abs(p.z - row.z) < 0.95){ overRack = true; break; }
    const clear = truck.lift - (p.pickY || 0);
    G.carryCatch = overRack && (p.pickY || 0) > 0.20 && clear < CFG.pickClear;
    if(G.carryCatch && levers.reach.val < -0.05 && truck.reach > 0.03){
      breakPallet(p, '들어올림 부족 · 팔레트가 걸려 이탈');
      G.carryCatch = false;
      return;
    }

    const t = placeTarget(p);
    if(t){
      const rx = p.x - t.x, rz = p.z - t.z;
      G.place = {
        lat: rx*nrmX(truck.h) + rz*nrmZ(truck.h),
        lon: rx*dirX(truck.h) + rz*dirZ(truck.h),
        ang: wrapQuarter(t.yaw - truck.h),
        dy:  truck.lift - t.y,
        tilt: forkAngle(),
        rack: t.kind === 'slot' && t.y > 0.20,
        id: t.id
      };
    }else G.place = null;

    const sup = supportUnder(p.x, p.z, truck.lift);
    const supY = sup.place ? sup.place.y : 0;
    if(truck.lift <= supY + 0.005){ truck.lift = supY; dropCarried(); }
    G.gauge = null;
    return;
  }
  G.carryCatch = false;
  G.place = null;

  let gt = null;
  for(const p of pallets){
    if(p.carried || p.falling) continue;
    if(Math.abs(p.x - truck.x) > 5 || Math.abs(p.z - truck.z) > 5) continue;
    const r = relToFork(p);
    if(r.long < -0.3 || r.long > 2.4 || Math.abs(r.lat) > 0.85){ p.inserted = false; continue; }
    if(gt === null || r.long < gt.r.long) gt = { p:p, r:r };
  }

  if(gt){
    const p = gt.p, r = gt.r;
    const pen = CFG.forkTip + CFG.palHalf - r.long;
    const dy = truck.lift - (p.y + CFG.holeY);
    const okT = Math.abs(forkAngle()) < CFG.tolTilt;
    // 리치를 충분히 내밀어야 지겟발이 구멍에 들어간다.
    // 리치를 넣은 채로는 앞다리와 캐리지가 팔레트를 밀어버린다.
    const okR = truck.reach >= CFG.reachPick;
    const aligned = Math.abs(r.lat) < CFG.tolLat && Math.abs(r.ang) < CFG.tolAng &&
                    Math.abs(dy) < CFG.tolY && okT;
    const ok = aligned && okR;
    // 지겟발이 팔레트보다 한참 높으면 그냥 위로 지나간다
    const over = dy > CFG.overHead;
    G.gauge = { lat:r.lat, ang:r.ang, dy:dy, tilt:forkAngle(), pen:pen,
                ok:ok, okR:okR, reach:truck.reach, over:over };

    // 리치를 내미는 동안에도 지겟발은 앞으로 나간다
    const adv = truck.v + Math.max(0, levers.reach.val) * CFG.reachSpeed;

    if(pen > 0 && Math.abs(r.ang) < 0.7 && !over){
      if(ok || (p.inserted && pen > 0.50)){
        p.inserted = true;
        if(pen > 0.85 && truck.lift > p.y + 0.035){
          p.pickY = p.slot ? p.slot.y : (p.zone ? p.zone.y : 0);
          if(p.slot){ p.slot.pallet = null; p.slot = null; }
          if(p.zone){ p.zone.pallet = null; p.zone = null; }
          p.carried = true; p.inserted = true; truck.carry = p;
          blip(560, 0.10, 'triangle', 0.05);
        }
      }else if(!p.inserted && adv > 0.05){
        const push = Math.min(pen, adv * dt * 1.6 + 0.004);
        p.x += dirX(truck.h) * push;
        p.z += dirZ(truck.h) * push;
        if(Math.abs(r.lat) > CFG.tolLat) p.yaw += Math.sign(r.lat) * push * 0.9;
        if(G.bumpCool <= 0){
          if(G.mode === 'drill'){ G.drillMiss++; setTimeout(drillTask, 0); }
          if(!okR && aligned){
            // 자세는 맞는데 리치를 안 내민 경우 — 알려만 주고 감점하지 않는다
            toast('리치를 내밀고 꽂으세요'); thud(0.16); G.bumpCool = 1.4;
          }else{
            toast(!okT ? '포크 기울어짐' : (Math.abs(dy) >= CFG.tolY ? '포크 높이 불량' : '포크 정렬 불량'));
            thud(0.22); G.damage += 1; G.bumpCool = 1.4;
          }
        }
        if(p.slot){
          const off = Math.hypot(p.x - p.slot.x, p.z - p.slot.z);
          if(off > 0.50 && p.slot.y > 0.2){ impact('steel', 0.8); breakPallet(p, '랙에서 팔레트 낙하'); }
          else if(off > 0.50){ p.slot.pallet = null; p.slot = null; }
        }else if(p.zone){
          if(Math.hypot(p.x - p.zone.x, p.z - p.zone.z) > 0.55){ p.zone.pallet = null; p.zone = null; }
        }
      }
    }else if(pen <= 0 || over) p.inserted = false;
  }else G.gauge = null;

  for(const p of pallets){
    if(!p.falling) continue;
    p.fallV += 9.8 * dt;
    p.y -= p.fallV * dt;
    if(p.y <= 0){ p.y = 0; p.falling = false; p.fallV = 0; }
  }
}

/* 사람을 친 것은 되돌릴 수 없는 사고다. 그 자리에서 끝난다. */
function hitPerson(){

  truck.v = 0; G.throttle = 0; setPedal(false);
  G.damage += 5;
  toast('인명사고 · 보행자를 쳤습니다');

        '<ul><li>사람이 있는 통로에서는 <b>경적</b>을 울리고 서행합니다</li>' +
        '<li>교차로와 랙 끝단은 사각지대입니다. 정지 후 좌우를 확인하고 진입합니다</li>' +
        '<li>화물이 시야를 가리면 후진으로 이동합니다</li></ul>' +

function tipOver(){
  if(truck.carry) breakPallet(truck.carry, '전도 · 적재물 낙하');
  G.damage += 2;
  truck.v = 0; G.throttle = 0; G.highTravel = 0;
  impact('concrete', 1.3);
  setTimeout(()=> impact('steel', 0.9), 200);
  toast('전도 · 마스트를 올린 채 주행했습니다');
}

function hazards(dt){
  const soft = G.mode === 'drill';      // 연습은 경고만 하고 사고로 잇지 않는다
  const sp = Math.abs(truck.v);
  const moving = sp > 0.45;      // 이 밑은 자리 잡는 중으로 본다
  const step = sp * dt;
  /* 랙 앞에서 작업 중일 때는 주행 판정을 걸지 않는다.
     리치를 내밀었거나 지겟발 앞에 팔레트가 있으면 작업 중이다.
     높이 올리는 것 자체는 잘못이 아니고, 그 상태로 통로를 이동하는 것이 잘못이다. */
  const working = truck.reach > CFG.reachOut || G.gauge !== null || G.place !== null;

  let top = null;
  const rank = c => c.lv === 'crit' ? 1 : 0;
  const put = (msg, r, lv)=>{
    const c = { msg:msg, r:clamp(r, 0, 1), lv:lv || 'crit' };
    if(!top || rank(c) > rank(top) || (rank(c) === rank(top) && c.r > top.r)) top = c;
  };

  /* 1. 마스트를 올린 채 통로를 이동 — 누적 이동거리로 본다.
        높을수록 허용 거리가 짧아진다. 포크를 내리면 초기화된다. */
  if(truck.lift <= CFG.liftSafe){
    G.highTravel = 0;
  }else{
    if(moving && !working) G.highTravel += step;
    const warnD = Math.max(1.2, 4.0 - truck.lift*0.9);
    const failD = warnD * 2.6;
    if(G.highTravel > failD){
      if(soft) G.highTravel = 0;
      else if(truck.lift > CFG.liftTip) tipOver();
      else if(truck.carry){ breakPallet(truck.carry, '높이 든 채 이동 · 적재물 낙하'); G.highTravel = 0; }
      else{ G.damage += 1; G.highTravel = 0; thud(0.35); toast('마스트를 올린 채 이동'); }
    }else if(G.highTravel > warnD){
      put('포크를 내리고 이동하세요', (G.highTravel - warnD)/(failD - warnD));
    }
  }

  /* 2. 지겟발을 바닥에 붙인 채 이동 */
  if(truck.lift < CFG.scrapeLift && moving && !working){
    G.scrapeT += dt;
    SND.scrape = clamp(sp/1.4, 0, 1);
    if(G.scrapeT > 3.0){ if(!soft) G.damage += 1; G.scrapeT = 0; toast('지겟발이 바닥에 끌립니다'); }
    else if(G.scrapeT > 0.5) put('지겟발을 지면에서 띄우고 이동하세요', (G.scrapeT - 0.5)/2.5);
  }else{ G.scrapeT = Math.max(0, G.scrapeT - dt*1.5); SND.scrape = 0; }

  /* 3. 후경 없이 짐을 싣고 이동 — 이것도 거리로 본다 */
  if(!truck.carry || forkAngle() >= CFG.keepTilt){
    G.tiltTravel = 0;
  }else{
    if(moving && !working) G.tiltTravel += step;
    if(G.tiltTravel > 9.0){ if(!soft) breakPallet(truck.carry, '적재물 전방 이탈'); G.tiltTravel = 0; }
    else if(G.tiltTravel > 2.5) put('마스트를 후경으로 당기세요', (G.tiltTravel - 2.5)/6.5);
  }

  /* 4. 랙에서 뽑을 때 들어올림이 모자란 상태 */
  if(truck.carry && G.carryCatch) put('더 올린 다음 리치를 넣으세요', 1, 'warn');

  /* 5. 리치를 내민 채 이동 */
  if(truck.reach > CFG.reachOut){
    if(sp > 0.12) G.reachTravel += step;
    if(!G.reachFlag){
      const fail = CFG.reachFail * (1 - 0.45*loadRatio());
      if(G.reachTravel > fail){
        G.reachFlag = true; if(!soft) G.damage += 1; thud(0.3);
        toast('리치를 내민 채 이동 · 전도 위험');
      }else if(G.reachTravel > CFG.reachWarn*(1 - 0.40*loadRatio())){
        const wr = CFG.reachWarn*(1 - 0.40*loadRatio());
        put('리치를 넣고 이동하세요', (G.reachTravel - wr)/Math.max(fail - wr, 0.1));
      }
    }
  }else{ G.reachTravel = 0; G.reachFlag = false; }

  G.risk = top;
}

   보행자 · 신호수 · 도로 차량
   ============================================================ */
function updatePeds(dt){
  const roam = G.mode === 'roam';
  for(const p of peds){
    const dx = truck.x - p.mesh.position.x;
    const dz = truck.z - p.mesh.position.z;
    const d = Math.hypot(dx, dz);

    // 지게차가 다가오면 비켜준다. 경적을 울리면 더 빨리 물러난다
    if(G.horn && G.defects.horn) defectHit('horn');
    const hornOk = G.horn && !G.defects.horn;
    if(G.defects.light && d < 12) defectHit('light');
    const see = (hornOk ? 11 : 7) * (G.defects.light ? 0.6 : 1);
    const alert = d < see && Math.abs(truck.v) > 0.15;
    p.yield += ((alert ? 1 : 0) - p.yield) * (1 - Math.exp(-(hornOk ? 6 : 3)*dt));
    p.side += ((alert ? (dx > 0 ? -1.5 : 1.5) : 0) - p.side) * (1 - Math.exp(-2.6*dt));

    const speed = alert ? 0.25 : 1.15;
    p.z += p.dir * speed * dt;
    if(p.z > p.path.z1){ p.z = p.path.z1; p.dir = -1; }
    if(p.z < p.path.z0){ p.z = p.path.z0; p.dir = 1; }

    p.mesh.position.set(p.path.x + p.side, 0, p.z);
    p.mesh.rotation.y = p.dir > 0 ? 0 : Math.PI;

    p.t += dt * speed * 3.2;
    const sw = Math.sin(p.t) * 0.5;
    const u = p.mesh.userData;
    u.legL.rotation.x = sw; u.legR.rotation.x = -sw;
    u.armL.rotation.x = -sw*0.7; u.armR.rotation.x = sw*0.7;

    // 접촉 — 사람은 다른 어떤 사고보다 크게 다룬다
    if(d < 1.6 && Math.abs(truck.v) > 0.55 && G.npcHitCool <= 0){
      G.npcHitCool = 3.0;
      p.side += dx > 0 ? -1.8 : 1.8;
      if(roam){ impact('plastic', 0.6); toast('보행자가 놀라 물러났습니다'); }
      else if(G.mode === 'drill'){ G.drillMiss++; impact('person', 0.8); toast('보행자 접촉'); drillTask(); }
      else hitPerson();
    }
  }
  if(G.npcHitCool > 0) G.npcHitCool -= dt;

  for(const s of signals){
    s.t += dt;
    s.mesh.userData.armR.rotation.x = -1.1 + Math.sin(s.t*2.1)*0.55;
  }
}

function updateCars(dt){
  const on = G.outUnlocked;
  for(const c of cars){
    c.mesh.visible = on;
    if(!on) continue;
    const lz = ROAD.lane[c.lane];
    // 지게차가 같은 차선 앞에 있으면 감속하고 경적을 울린다
    let blocked = false;
    if(Math.abs(truck.z - lz) < 3.4){
      const ahead = (truck.x - c.x) * c.dir;
      if(ahead > 0 && ahead < 26) blocked = true;
    }
    const want = blocked ? Math.min(2.0, Math.abs(truck.v) + 0.6) : c.base;
    c.v += (want - c.v) * (1 - Math.exp(-1.8*dt));
    c.x += c.dir * c.v * dt;
    if(c.x > 126) c.x = -126;
    if(c.x < -126) c.x = 126;
    c.mesh.position.set(c.x, 0, lz);

    c.honk -= dt;
    if(blocked && c.v < 3.2 && c.honk <= 0){
      c.honk = 1.1 + Math.random()*1.4;
      carHonk();
    }
  }
}

/* ============================================================
   지도 · 배회
   ============================================================ */
function cellKey(x, z){
  return Math.floor((x + 48)/CELL) + ',' + Math.floor((z + 12)/CELL);
}
const INDOOR_CELLS = (function(){
  const set = {};
  for(let x=-IN.x; x<=IN.x; x+=2) for(let z=IN.z0; z<=IN.z1; z+=2) set[cellKey(x, z)] = 1;
  return Object.keys(set);
})();

function markCell(){
  const k = cellKey(truck.x, truck.z);
  if(!G.cells[k]){
    G.cells[k] = 1;
    if(!G.outUnlocked && exploreRate() >= UNLOCK_RATE){
      G.outUnlocked = true;
      toast('도크 셔터가 열렸습니다', true);
      blip(660, 0.18, 'sine', 0.06);
      setTimeout(()=> blip(990, 0.26, 'sine', 0.05), 170);
      saveRoam();
    }
  }
}
function exploreRate(){
  let n = 0;
  for(const k of INDOOR_CELLS) if(G.cells[k]) n++;
  return n / INDOOR_CELLS.length;
}

function pickGoal(){
  const pool = slots.filter(s=> s.y === 0 && !s.practice).concat(zones);
  for(let i=0;i<40;i++){
    const c = pool[Math.floor(Math.random()*pool.length)];
    if(c && Math.hypot(c.x - truck.x, c.z - truck.z) > 22) return c;
  }
  return pool[0];
}
function updateGoal(){
  if(G.mode !== 'roam') return;
  if(!G.goal) G.goal = pickGoal();
  const d = Math.hypot(truck.x - G.goal.x, truck.z - G.goal.z);
  if(d < 3.5){
    G.found++;
    toast(G.goal.id + ' 도착', true);
    blip(820, 0.14, 'triangle', 0.05);
    G.goal = pickGoal();
    saveRoam();
  }
}
function updateDiscoveries(){
  for(const d of discMeshes){
    const got = !!G.disc[d.def.id];
    d.halo.visible = !got;
    if(!got && Math.hypot(truck.x - d.def.x, truck.z - d.def.z) < 2.6){
      G.disc[d.def.id] = 1;
      toast('발견 · ' + d.def.name, true);
      blip(700, 0.16, 'sine', 0.055);
      setTimeout(()=> blip(1050, 0.20, 'sine', 0.045), 150);
      saveRoam();
    }
  }
}

function roamStoreKey(){ return ROAM_KEY + ':' + (G.playerName || 'guest'); }
function saveRoam(){
  try{
    window.localStorage.setItem(roamStoreKey(), JSON.stringify({
      cells: Object.keys(G.cells), dist: Math.round(G.dist),
      found: G.found, disc: Object.keys(G.disc), out: G.outUnlocked
    }));
  }catch(e){}
}
function loadRoam(){
  G.cells = {}; G.dist = 0; G.found = 0; G.disc = {}; G.outUnlocked = false;
  try{
    const raw = window.localStorage.getItem(roamStoreKey());
    if(!raw) return;
    const v = JSON.parse(raw);
    (v.cells || []).forEach(k=> G.cells[k] = 1);
    (v.disc || []).forEach(k=> G.disc[k] = 1);
    G.dist = v.dist || 0; G.found = v.found || 0; G.outUnlocked = !!v.out;
  }catch(e){}
}

const miniCtx = document.getElementById('mini').getContext('2d');
function drawMini(){
  const W = 364, H = 300;
  const x0 = -48, x1 = 48, z0 = -12, z1 = 144;
  const sx = W/(x1-x0), sz = H/(z1-z0);
  const px = x => (x - x0)*sx, pz = z => (z - z0)*sz;

  miniCtx.clearRect(0,0,W,H);
  miniCtx.fillStyle = '#E3EAF1'; miniCtx.fillRect(0,0,W,H);

  // 탐사한 칸
  miniCtx.fillStyle = '#CBDCEA';
  for(const k in G.cells){
    const p = k.split(',');
    const cx = (+p[0])*CELL - 48, cz = (+p[1])*CELL - 12;
    miniCtx.fillRect(px(cx), pz(cz), CELL*sx, CELL*sz);
  }

  // 연습장
  miniCtx.strokeStyle = '#C8A85E'; miniCtx.lineWidth = 1.5;
  miniCtx.setLineDash([4,3]);
  miniCtx.strokeRect(px(YARD.x0), pz(YARD.z0), (YARD.x1-YARD.x0)*sx, (YARD.z1-YARD.z0)*sz);
  miniCtx.setLineDash([]);

  // 랙
  miniCtx.fillStyle = '#B0684E';
  for(const row of ALL_ROWS){
    const w = row.n*2.7;
    miniCtx.fillRect(px(row.x0 - 1.35), pz(row.z) - 2, w*sx, 4);
  }
  // 평치
  miniCtx.fillStyle = '#C8A85E';
  for(const z of zones) miniCtx.fillRect(px(z.x)-2, pz(z.z)-2, 4, 4);

  // 벽 · 셔터
  miniCtx.strokeStyle = '#8A96A2'; miniCtx.lineWidth = 2;
  miniCtx.strokeRect(px(-42), pz(-6.5), 84*sx, (WALL_Z+6.5)*sz);
  miniCtx.fillStyle = G.outUnlocked ? '#17A673' : '#9AA5AE';
  for(const gx of GATES) miniCtx.fillRect(px(gx)-3.5, pz(WALL_Z)-2, 7, 4);

  // 도로
  miniCtx.fillStyle = '#8E959C';
  miniCtx.fillRect(0, pz(ROAD.z0), W, (ROAD.z1-ROAD.z0)*sz);

  // 충전 구역
  miniCtx.fillStyle = '#F2B705';
  miniCtx.fillRect(px(CHARGE.x)-4, pz(CHARGE.z)-4, 8, 8);
  miniCtx.strokeStyle = '#8B6E06'; miniCtx.lineWidth = 1.4;
  miniCtx.strokeRect(px(CHARGE.x)-4, pz(CHARGE.z)-4, 8, 8);

  // 발견물
  for(const d of discMeshes){
    miniCtx.fillStyle = G.disc[d.def.id] ? '#17A673' : '#F2B705';
    miniCtx.beginPath(); miniCtx.arc(px(d.def.x), pz(d.def.z), 3.4, 0, 7); miniCtx.fill();
  }

  // 목표
  if(G.goal){
    miniCtx.strokeStyle = '#1A73E8'; miniCtx.lineWidth = 2;
    miniCtx.beginPath(); miniCtx.arc(px(G.goal.x), pz(G.goal.z), 6, 0, 7); miniCtx.stroke();
  }

  // 지게차
  miniCtx.save();
  miniCtx.translate(px(truck.x), pz(truck.z));
  miniCtx.rotate(-truck.h);
  miniCtx.fillStyle = '#E03B36';
  miniCtx.beginPath();
  miniCtx.moveTo(0, -7); miniCtx.lineTo(5, 6); miniCtx.lineTo(-5, 6);
  miniCtx.closePath(); miniCtx.fill();
  miniCtx.restore();
}

function updateRoamPanel(dt){
  if(G.mode !== 'roam') return;
  if(G.showMap){
    G.miniT -= dt;
    if(G.miniT <= 0){ G.miniT = 0.25; drawMini(); }
  }
  const rate = exploreRate();
  const ex = document.getElementById('rExp');
  ex.textContent = Math.round(rate*100) + '%';
  ex.className = 'v' + (G.outUnlocked ? ' ok' : '');
  document.getElementById('rDist').textContent = fmtDist(G.dist);
  document.getElementById('rGrade').textContent = gradeOf(G.dist);
  let dn = 0; for(const k in G.disc) dn++;
  document.getElementById('rDisc').textContent = dn + ' / ' + DISCOVERIES.length;
  document.getElementById('rGoal').textContent = G.goal ? G.goal.id : '-';
  document.getElementById('rGoalD').textContent = G.goal
    ? Math.round(Math.hypot(truck.x - G.goal.x, truck.z - G.goal.z)) + 'm · 누적 ' + G.found + '곳'
    : '';
}

   동기화
   ============================================================ */
function sync(dt){
  truckGroup.position.set(truck.x, 0, truck.z);
  truckGroup.rotation.y = truck.h;
  mastGroup.position.z = CFG.mastBase + truck.reach;
  mastGroup.rotation.x = -forkAngle();
  carriage.position.y = truck.lift;
  innerMast.position.y = truck.lift * 0.5;

  for(const p of pallets){
    p.mesh.position.set(p.x, p.y, p.z);
    p.mesh.rotation.y = p.yaw;
    p.mesh.rotation.x = p.pitch || 0;
    if(p.broken && !p.mesh.userData.tinted){
      p.mesh.userData.tinted = true;
      p.mesh.traverse(o=>{
        if(o.isMesh && o.material && o.material.color) o.material = mat(COLOR.broken, 0.9);
      });
    }
  }

  // 셔터 개폐
  const wantY = G.outUnlocked ? 8.4 : 3.0;
  G.shutterT += (wantY - G.shutterT) * (1 - Math.exp(-1.6*(dt||0.016)));
  for(const s of shutters) s.position.y = G.shutterT;
}

/* 게이지가 뜨면 그만큼 화면을 왼쪽으로 밀고, 밀린 만큼 화각을 넓혀 잘리지 않게 한다.
   투영 자체를 옮기므로 어느 시점에서든 똑같이 동작한다. */
function panelPad(){
  if(!G.alignShown || G.portrait) return 0;   // 세로에서는 계기판이 아래에 있다
  return (G.panelW || 272) * (G.uipNow || 1) + 26;
}

function effView(){
  if(G.view === 'auto') return (G.gauge || G.place) ? 'fork' : 'quarter';
  return G.view;
}

const _eye = new THREE.Vector3(), _look = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
function updateCamera(dt){
  const v = effView();
  const z = camera.userData.z;

  if(v === 'quarter'){
    if(Math.abs(truck.v) > 0.20){
      const b = 1 - Math.exp(-3.0*dt);
      G.pan.x -= G.pan.x * b;
      G.pan.z -= G.pan.z * b;
    }
    const k = 1 - Math.exp(-4.5*dt);
    camera.userData.tx += (truck.x + G.pan.x - camera.userData.tx) * k;
    camera.userData.tz += (truck.z + G.pan.z - camera.userData.tz) * k;
    camera.userData.z  += (G.zoom - z) * (1 - Math.exp(-7*dt));
    const zz = camera.userData.z;
    _eye.set(camera.userData.tx + 4.2*zz, 11.4*zz, camera.userData.tz + 9.6*zz);
    _look.set(camera.userData.tx, 1.0, camera.userData.tz);
    _up.set(0, 1, 0);
  }else{
    camera.userData.z += (G.zoom - z) * (1 - Math.exp(-7*dt));
    camera.userData.tx = truck.x; camera.userData.tz = truck.z;
    G.pan.x = 0; G.pan.z = 0;
    const fx = dirX(truck.h), fz = dirZ(truck.h);
    const nx = nrmX(truck.h), nz = nrmZ(truck.h);
    if(v === 'cab'){
      /* 실제로는 옆을 보고 서지만, 화면에서는 진행 방향을 정면으로 둔다.
         후진을 넣으면 고개를 돌리듯 시선이 뒤로 넘어간다. */
      /* 랙 앞에서 잠깐 뺐다 넣는 동작까지 시점이 돌면 아무것도 안 보인다.
         작업 중이거나 짧게 물러나는 정도면 앞을 그대로 본다. */
      const backing = (G.throttle < -0.05 || truck.v < -0.25);
      const working = truck.reach > CFG.reachOut || G.gauge || G.place;
      /* 쌓인 값에 상한을 두지 않으면 오래 후진할수록 앞으로 돌아오는 데
         그만큼 오래 걸린다. 0.9 에서 멈추고, 전진을 넣으면 더 빨리 푼다. */
      const back = G.rearLook && backing && !working;
      G.backT = back ? Math.min(0.9, G.backT + dt)
                     : Math.max(0, G.backT - dt*(G.throttle > 0.05 ? 8.0 : 4.0));
      const wantBack = G.backT > 0.55 ? 1 : 0;
      G.headTurn += (wantBack - G.headTurn) * (1 - Math.exp(-4.2*dt));
      const hv = truck.h + G.headTurn*Math.PI;
      const vx = Math.sin(hv), vz = Math.cos(hv);
      /* 눈을 옆으로 빼면 가까이 있는 지겟발이 한쪽으로 치우쳐 보인다.
         실제 운전석은 옆에 있지만, 화면에서는 차체 중심선에 둔다. */
      _eye.set(truck.x - vx*1.15, 2.15, truck.z - vz*1.15);
      const ahead = CFG.mastBase + truck.reach + CFG.forkTip + 3.4;
      _look.set(truck.x + vx*ahead,
                0.45 + truck.lift*0.55*(1 - G.headTurn),
                truck.z + vz*ahead);
      _up.set(0, 1, 0);
    }else{
      // 지겟발 바로 위에서 내려다본다
      const fb = forkBase();
      const ox = fb.x + fx*0.78, oz = fb.z + fz*0.78;
      const hgt = 4.4 * clamp(camera.userData.z/1.35, 0.65, 1.7);
      _eye.set(ox, truck.lift + hgt, oz);
      _look.set(ox, truck.lift, oz);
      _up.set(fx, 0, fz);
    }
  }

  // 화각 — 운전석은 넓게. 게이지가 뜬 만큼 더 넓혀서 밀려도 잘리지 않게 한다.
  const W = window.innerWidth, H = window.innerHeight;
  G.padNow += (panelPad() - G.padNow) * (1 - Math.exp(-4.0*dt));
  G.padYNow += ((G.padY || 0) - G.padYNow) * (1 - Math.exp(-4.0*dt));
  const widen = Math.max(1 + Math.min(G.padNow / Math.max(W, 1), 0.55),
                         1 + Math.min(G.padYNow / Math.max(H, 1), 0.55));
  const base = v === 'cab' ? 66 : (v === 'fork' ? 42 : 38);
  const wantFov = Math.min(94,
    2 * Math.atan(Math.tan(base*Math.PI/360) * widen) * 180/Math.PI);
  G.fovNow += (wantFov - G.fovNow) * (1 - Math.exp(-6*dt));
  camera.fov = G.fovNow;
  if(G.padNow > 2 || G.padYNow > 2)
    camera.setViewOffset(W, H, G.padNow*0.5, G.padYNow*0.5, W, H);
  else if(camera.view && camera.view.enabled) camera.clearViewOffset();
  else camera.updateProjectionMatrix();

  setSeeThrough(v === 'cab');

  const s2 = 1 - Math.exp(-11*dt);
  camera.position.lerp(_eye, s2);
  if(!camera.userData.look) camera.userData.look = _look.clone();
  camera.userData.look.lerp(_look, s2);
  camera.up.lerp(_up, s2).normalize();
  camera.lookAt(camera.userData.look);

  sunLight.position.set(truck.x + 9, 16, truck.z + 11);
  sunLight.target.position.set(truck.x, 0, truck.z);
  sunLight.target.updateMatrixWorld();
}

/* 시간대 — 배회 모드에 들어갈 때마다 달라진다 */
const TIMES = [
  { n:'새벽', sky:0x6E7A88, sun:0xC8D2E0, si:0.42, hi:0.40, fog:[40,104] },
  { n:'아침', sky:0x9DAAB4, sun:0xFFE8C0, si:0.86, hi:0.48, fog:[52,130] },
  { n:'한낮', sky:0x7C8996, sun:0xFFF0D2, si:0.92, hi:0.46, fog:[54,136] },
  { n:'해질녘', sky:0x93858A, sun:0xFFC98A, si:0.70, hi:0.40, fog:[44,116] },
  { n:'심야', sky:0x4A535E, sun:0x9FB0C4, si:0.30, hi:0.34, fog:[34,92] }
];
function applyTime(i){
  const t = TIMES[i % TIMES.length];
  scene.background = new THREE.Color(t.sky);
  scene.fog.color = new THREE.Color(t.sky);
  scene.fog.near = t.fog[0]; scene.fog.far = t.fog[1];
  sunLight.color = new THREE.Color(t.sun);
  sunLight.intensity = t.si;
  hemiLight.intensity = t.hi;
  return t.n;
}
