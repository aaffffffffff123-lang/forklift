<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>지게차 연수원</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
      media="print" onload="this.media='all'">
<style>
  :root{
    --ink:#1D2733; --ink-2:#5A6875; --line:#CBD5DE; --panel:#F1F5F8; --bg:#EDF3F8;
    --safety:#F2B705; --ok:#17A673; --warn:#E03B36; --steel:#E1E8EF; --knob:#3A4553;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", "Roboto Mono", Menlo, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    overscroll-behavior:none;touch-action:none;
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:var(--ink);}
  canvas#scene{display:block;width:100%;height:100%;touch-action:none;}
  #hud{position:fixed;inset:0;pointer-events:none;touch-action:none;}
  #boot{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#D7E0E8;}
  #boot.gone{display:none;}
  .bootbox{background:#F1F5F8;border:1px solid #CBD5DE;border-radius:12px;padding:18px 26px;
    font-size:14px;font-weight:700;color:#5A6875;box-shadow:0 4px 18px rgba(29,39,51,.10);}
  .card{position:absolute;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 2px 10px rgba(29,39,51,.08);}

  #task{top:12px;left:12px;max-width:320px;padding:9px 11px;
    border-left:4px solid var(--safety);opacity:.72;transition:opacity .16s;
    background:rgba(241,245,248,.80);}
  #task:hover, #task.live{opacity:1;background:rgba(241,245,248,.96);}
  #task .eyebrow{font-size:10px;letter-spacing:.08em;color:var(--ink-2);font-weight:700;}
  #task .title{font-size:14px;font-weight:700;line-height:1.3;margin-top:3px;}
  #task .desc{font-size:11.5px;color:var(--ink-2);line-height:1.5;margin-top:5px;
    max-height:20vh;overflow:auto;}

  body.touch #task .desc{font-size:11px;max-height:15vh;}


  .code{font-family:var(--mono);font-weight:700;}

  #stat{top:12px;right:12px;padding:8px 10px;display:flex;gap:11px;
    opacity:.78;transition:opacity .16s;background:rgba(241,245,248,.82);}
  #stat:hover{opacity:1;}
  #stat div{text-align:right;}
  #stat .k{font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);font-weight:700;}
  #stat .v{font-family:var(--mono);font-size:18px;font-weight:700;line-height:1.2;}
  #stat .v.bad{color:var(--warn);}
  #stat .v.blue{color:#1A73E8;}

  /* 계기판 — 가로를 다 쓰고 세로로 얇게. 왼쪽 조향각, 오른쪽 수치 */
  /* 계기판 — 좌우로 갈라 조향휠·레버 위에 각각 얹는다. 가운데는 비운다. */
  #panel{position:absolute;left:12px;right:12px;display:flex;justify-content:space-between;
    align-items:flex-end;gap:10px;}
  
  
  .pbox{background:rgba(241,245,248,.66);border:1px solid rgba(203,213,222,.72);
    border-radius:10px;box-shadow:0 2px 10px rgba(29,39,51,.06);
    padding:5px 10px;min-width:0;
    text-shadow:0 1px 0 rgba(255,255,255,.55);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}



  /* 왼쪽 상자 = 아크가 남는 폭을 다 쓰고, 속도는 오른쪽 끝에 붙는다 */
  .steerBox{width:100%;display:flex;align-items:center;}
  .steerBox canvas{display:block;flex:1 1 auto;width:auto;min-width:0;height:auto;}
  .steerBox .col{flex:0 0 62px;width:62px;padding-left:8px;margin-left:8px;
    border-left:1px solid var(--line);}
  #panel .col{display:flex;justify-content:space-around;gap:6px;min-width:0;}
  #panel .row{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;}
  #panel .k{font-size:9px;font-weight:800;letter-spacing:0;color:var(--ink-2);white-space:nowrap;}
  #panel .v{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--ink);}
  #panel .v.ok{color:var(--ok);} #panel .v.bad{color:var(--warn);} #panel .v.blue{color:#1A73E8;}
  body.touch #panel .k{font-size:9.5px;}
  body.touch #panel .v{font-size:15px;}

  /* 정렬 게이지 — 계기판 위에 반투명으로 겹친다 */
  /* 정렬 게이지 — 화면 좌우 끝에 하나씩 붙여 가운데를 비운다 */
  .alignBox{display:none;padding:5px 7px;width:104px;
    background:rgba(241,245,248,.86);}
  #alignL{left:12px;}
  #alignR{right:12px;}
  .alignBox canvas{display:block;width:100%;height:auto;}
  .alignBox .pt{font-size:8.5px;font-weight:800;color:var(--ink-2);letter-spacing:0;margin-bottom:1px;}
  .alignBox .lbl{font-size:10.5px;font-weight:800;color:var(--ink-2);text-align:center;
    line-height:1.25;margin-top:3px;padding-top:3px;border-top:1px solid var(--line);}
  .alignBox .lbl.ok{color:var(--ok);} .alignBox .lbl.bad{color:var(--warn);}
  .alignBox .lbl2{font-family:var(--mono);font-size:11px;font-weight:800;text-align:center;
    color:var(--ink-2);margin-top:3px;padding-top:3px;border-top:1px solid var(--line);}
  .alignBox .lbl2.ok{color:var(--ok);} .alignBox .lbl2.bad{color:var(--warn);}
  body.touch .alignBox{width:114px;}
  body.portrait .alignBox{width:98px;}




  /* 배회 정보 — 지시서 안에 이어 붙인다 */
  #roam{display:none;margin-top:7px;padding-top:7px;border-top:1px solid var(--line);}
  #roam canvas{display:block;width:100%;height:auto;margin-top:8px;
    border:1px solid var(--line);border-radius:6px;background:#E3EAF1;}
  #roamMore{display:none;margin-top:7px;padding-top:6px;border-top:1px solid var(--line);}
  #roamMore.on{display:block;}
  #roam .rows{display:grid;grid-template-columns:1fr auto;gap:2px 8px;}
  #roam .k{font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--ink-2);}
  #roam .v{font-family:var(--mono);font-size:11.5px;font-weight:800;text-align:right;}
  #roam .v.ok{color:var(--ok);}
  #roam .goal .k{font-size:9.5px;}
  #roam .goal .id{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--ink);margin-top:1px;}
  #roam .goal .d{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink-2);}

  #toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);background:var(--warn);color:#fff;
    font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .18s;}
  #toast.show{opacity:1;}
  #toast.good{background:var(--ok);}

  #risk{position:absolute;top:140px;left:50%;transform:translateX(-50%);width:262px;
    background:#FBEEED;border:1px solid #E8A9A6;border-radius:10px;padding:9px 12px 10px;display:none;
    box-shadow:0 2px 10px rgba(224,59,54,.14);}
  #risk .msg{font-size:12.5px;font-weight:800;color:#B02722;margin-bottom:7px;}
  #risk .bar{height:6px;border-radius:3px;background:#F0D4D2;overflow:hidden;}
  #risk .bar i{display:block;height:100%;background:var(--warn);width:0%;transition:width .08s linear;}
  #risk.warn{background:#FDF6E4;border-color:#E4C468;box-shadow:0 2px 10px rgba(200,150,10,.14);}
  #risk.warn .msg{color:#8A6A05;} #risk.warn .bar{background:#F0E2BC;} #risk.warn .bar i{background:var(--safety);}

  .ctl{position:absolute;bottom:12px;padding:12px 15px;display:flex;align-items:flex-end;gap:12px;
    pointer-events:auto;user-select:none;touch-action:none;
    opacity:.72;transition:opacity .16s;background:rgba(241,245,248,.80);}
  .ctl.live{opacity:1;background:rgba(241,245,248,.96);}
  #ctlLeft{left:12px;transform:scale(var(--ui,1));transform-origin:bottom left;}
  #ctlRight{right:12px;transform:scale(var(--ui,1));transform-origin:bottom right;
    position:absolute;padding-top:18px;}
  .ctl .sep{width:1px;align-self:stretch;background:var(--line);margin:0 1px;}
  .cap{font-size:10px;color:var(--ink-2);font-weight:700;text-align:center;margin-top:6px;white-space:nowrap;}
  .cap b{font-family:var(--mono);color:var(--ink);font-weight:700;}

  /* 핸들 — 오른쪽 아래 대각선 빈 자리에 브레이크를 작게 붙인다 */
  .wheelBox{position:relative;}
  .wheelWrap{position:relative;width:140px;height:140px;cursor:grab;}
  .wheelWrap:active{cursor:grabbing;}
  .wheelWrap svg{display:block;width:100%;height:100%;}
  .tick{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:2px;height:10px;
    background:var(--ink-2);border-radius:1px;}
  #pedal{position:absolute;right:-16px;bottom:-8px;width:50px;height:50px;border-radius:50%;
    border:1px solid var(--line);background:var(--steel);font-family:inherit;
    font-size:10px;font-weight:800;color:var(--ink-2);cursor:pointer;z-index:2;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(29,39,51,.18);}
  #pedal.on{background:var(--safety);border-color:#D8A104;color:var(--ink);}

  /* 경음기 — 레버 모듈 위로 살짝 튀어나온 버튼 */
  #horn{position:absolute;left:50%;top:-15px;transform:translateX(-50%);
    width:52px;height:30px;border-radius:15px 15px 4px 4px;
    border:1px solid #A32723;border-bottom:none;background:#D93B34;
    font-family:inherit;font-size:10px;font-weight:800;color:#fff;cursor:pointer;z-index:2;}
  #horn.on{background:#F25A4E;border-color:#8E1D16;color:#fff;}
  /* 랩핑 — 경음기 옆. 조건이 맞을 때만 살아난다 */
  #wrapBtn{position:absolute;left:calc(50% + 46px);top:-15px;transform:translateX(-50%);
    width:52px;height:30px;border-radius:15px 15px 4px 4px;
    border:1px solid #9AA6B2;border-bottom:none;background:#C9D2DA;
    font-family:inherit;font-size:10px;font-weight:800;color:#6B7785;cursor:default;z-index:2;}
  #wrapBtn.can{background:#F4F8FC;border-color:#5A6875;color:#1D2733;cursor:pointer;box-shadow:0 0 0 2px rgba(23,166,115,.35);}
  body.touch #wrapBtn{width:60px;height:34px;top:-17px;font-size:11px;left:calc(50% + 54px);}
  .calc.habits td{font-size:11.5px;} .calc td.dim{color:#8A96A2;}
  .btn small{display:block;font-size:10px;font-weight:600;opacity:.75;margin-top:2px;}

  .levers{display:flex;gap:10px;align-items:flex-end;}
  .lever{width:40px;}
  .lever .dir{font-size:9px;font-weight:700;color:#8A96A2;text-align:center;height:12px;line-height:12px;}
  .lever .slot{position:relative;width:30px;margin:0 auto;border-radius:999px;background:var(--steel);border:1px solid var(--line);}
  .lever .mid{position:absolute;left:5px;right:5px;top:50%;height:1px;background:#C7D0D9;}
  .lever .stem{position:absolute;left:50%;width:5px;background:#B9C2CC;border-radius:3px;transform:translateX(-50%);}
  .lever .knob{position:absolute;left:50%;width:26px;height:30px;border-radius:12px;background:var(--knob);
    transform:translate(-50%,-50%);box-shadow:0 2px 5px rgba(29,39,51,.3);}
  .lever.act .knob{background:#26313D;}

  .thr{width:44px;}
  .thr .dir{font-size:9px;font-weight:700;color:#8A96A2;text-align:center;height:12px;line-height:12px;}
  .thr .slot{position:relative;width:34px;height:104px;margin:0 auto;border-radius:999px;background:var(--steel);border:1px solid var(--line);}
  .thr .mid{position:absolute;left:5px;right:5px;top:50%;height:1px;background:#C7D0D9;}
  .thr .stem{position:absolute;left:50%;width:6px;background:#B9C2CC;border-radius:3px;transform:translateX(-50%);}
  .thr .knob{position:absolute;left:50%;width:30px;height:32px;border-radius:12px;background:var(--knob);
    transform:translate(-50%,-50%);box-shadow:0 2px 5px rgba(29,39,51,.3);}
  .thr.act .knob{background:#26313D;}

  body.touch .lever .slot::after,
  body.touch .thr .slot::after,
  body.touch #horn::after{content:'';position:absolute;inset:-12px;}
  body.touch .lever{width:48px;} body.touch .lever .slot{width:40px;}
  body.touch .lever .knob{width:34px;height:34px;}
  body.touch .lever .dir{font-size:10.5px;height:14px;line-height:14px;}
  body.touch .thr{width:54px;} body.touch .thr .slot{width:46px;}
  body.touch .thr .knob{width:40px;height:36px;}
  body.touch .thr .dir{font-size:10.5px;height:14px;line-height:14px;}
  body.touch #horn{width:60px;height:34px;top:-17px;font-size:11px;}
  body.touch #pedal{width:58px;height:58px;font-size:11px;right:-20px;bottom:-10px;}
  body.touch .wheelWrap{width:158px;height:158px;}
  body.touch .cap{font-size:11px;}
  body.touch .cap b{display:none;}
  body.touch #zoom button{min-width:50px;height:44px;font-size:16px;}


  /* 세로에서도 배치는 같다. 폭에 맞춰 줄어들 뿐이다. */

  body.portrait #panel .k{font-size:8.5px;}
  body.portrait #panel .v{font-size:12.5px;}
  body.portrait .steerBox .col{flex:0 0 54px;width:54px;}
  
  body.portrait #overlay.corner{padding:8px;align-items:flex-start;}
  body.portrait #overlay.corner .sheet{width:calc(100% - 16px);max-width:none;}

  /* 충전 점검표 — 지시서 안에 들어간다. 그때는 다른 정보가 필요 없다 */
  #chargeBox{display:none;margin-top:7px;padding-top:7px;border-top:1px solid var(--line);
    pointer-events:auto;}
  #chargeBox .ttl{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--ink-2);margin-bottom:5px;}
  #chargeBox ul{margin:0 0 8px;padding-left:14px;font-size:11.5px;line-height:1.65;color:var(--ok);font-weight:700;}
  #chargeBox li.no{color:var(--warn);}
  #chargeBox button{width:100%;padding:8px;border-radius:8px;border:1px solid #D8A104;
    background:var(--safety);font-family:inherit;font-size:12.5px;font-weight:800;color:var(--ink);cursor:pointer;}
  #chargeBox button:disabled{background:var(--steel);border-color:var(--line);color:#9AA5AE;cursor:default;}

  .chg svg{display:block;width:100%;height:auto;margin-bottom:14px;}
  .chg .hs{cursor:pointer;}
  .chg .msg{font-size:13px;font-weight:700;line-height:1.5;margin-bottom:12px;min-height:38px;}
  .chg .msg.ng{color:var(--warn);} .chg .msg.ok{color:var(--ok);}
  .chg .bar{height:14px;border-radius:7px;background:var(--steel);border:1px solid var(--line);overflow:hidden;margin-bottom:6px;}
  .chg .bar i{display:block;height:100%;background:var(--ok);width:0%;}
  .chg .pct{font-family:var(--mono);font-size:12px;font-weight:800;color:var(--ink-2);margin-bottom:14px;}

  /* 첫 진입 안내 — 실제 버튼을 짚어가며 하나씩 보여준다 */
  #tour{position:absolute;display:none;width:min(74vw,300px);z-index:12;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 13px;box-shadow:0 6px 22px rgba(29,39,51,.22);pointer-events:auto;}
  #tour .ttl{font-size:14px;font-weight:800;margin-bottom:4px;}
  #tour .txt{font-size:12px;color:var(--ink-2);line-height:1.55;margin-bottom:10px;}
  #tour .foot{display:flex;align-items:center;gap:8px;}
  #tour .n{font-family:var(--mono);font-size:11px;font-weight:800;color:var(--ink-2);flex:1;}
  #tour button{padding:7px 12px;border-radius:8px;font-family:inherit;
    font-size:12.5px;font-weight:800;cursor:pointer;border:1px solid var(--line);}
  #tour .skip{background:#E7EDF3;color:var(--ink-2);}
  #tour .next{background:var(--safety);border-color:#D8A104;color:var(--ink);}
  .tourHit{animation:tourBlink 1s ease-in-out infinite;}
  @keyframes tourBlink{
    0%,100%{box-shadow:0 0 0 0 rgba(242,183,5,0);}
    50%{box-shadow:0 0 0 5px rgba(242,183,5,.85);}
  }
  #tourRing{position:absolute;display:none;border:3px solid var(--safety);border-radius:12px;
    pointer-events:none;z-index:11;animation:tourBlink 1s ease-in-out infinite;}

  #guide{position:absolute;display:none;align-items:center;gap:6px;transform:translate(-50%,-50%);
    background:#17A673;color:#fff;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;
    box-shadow:0 2px 10px rgba(29,39,51,.25);}
  #guideArrow{display:inline-block;font-size:14px;line-height:1;}

  #zoom{right:12px;top:74px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;
    justify-content:flex-end;pointer-events:auto;
    opacity:.70;transition:opacity .16s;background:rgba(241,245,248,.78);}
  #zoom:hover, #zoom.live{opacity:1;background:rgba(241,245,248,.96);}
  #zoom.closed{opacity:.55;}
  #zoom.closed.live{opacity:1;}
  #zoom.up{top:12px;}
  #zoomItems{display:contents;}
  #zoom.closed #zoomItems{display:none;}
  #btnBar{font-size:17px;letter-spacing:1px;}
  @keyframes barBlink{
    0%,100%{background:var(--steel);border-color:var(--line);color:var(--ink);}
    50%{background:var(--safety);border-color:#D8A104;color:var(--ink);}
  }
  #btnBar.blink{animation:barBlink 1.05s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){ #btnBar.blink{animation:none;background:var(--safety);} }
  #zoom button.hide{display:none;}
  #zoom button.on{background:var(--safety);border-color:#D8A104;}
  #zoom button.off{color:#9AA5AE;text-decoration:line-through;}
  #zoom button{min-width:42px;height:36px;padding:0 8px;border-radius:8px;border:1px solid var(--line);
    background:var(--steel);font-size:15px;font-weight:800;color:var(--ink);cursor:pointer;font-family:inherit;line-height:1;}

  .sheet table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px;}
  .sheet table td, .sheet table th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;}
  .sheet table th{font-size:11px;color:var(--ink-2);font-weight:800;letter-spacing:.04em;}
  .sheet table .num{text-align:right;font-family:var(--mono);font-weight:700;}
  .sheet table .dt{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);}
  .sheet table.calc td{color:var(--ink-2);}
  .sheet table.calc tr.sum td{color:var(--ink);font-weight:800;font-size:15px;border-bottom:none;}
  .sheet table .none{color:var(--ink-2);text-align:center;padding:20px 0;}
  .namebox{margin-bottom:14px;}
  .namebox input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
    background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);}
  .namebox input:focus{outline:3px solid #3F7FD1;outline-offset:1px;}
  .namebox .hint{font-size:11.5px;color:var(--ink-2);font-weight:700;margin-top:6px;}

  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(215,224,232,.94);pointer-events:auto;overflow:auto;
    touch-action:pan-y;overscroll-behavior:contain;}
  #overlay.hide{display:none;}
  /* 충전처럼 화면을 다 덮을 필요가 없는 것은 왼쪽 위에 붙인다 */
  #overlay.corner{background:transparent;align-items:flex-start;justify-content:flex-start;
    pointer-events:none;padding:12px;}
  #overlay.corner .sheet{pointer-events:auto;margin:0;width:min(46vw,400px);
    padding:16px 18px;max-height:calc(100% - 24px);overflow:auto;
    box-shadow:0 8px 30px rgba(29,39,51,.22);}
  #overlay.corner .sheet h1{font-size:18px;}
  #overlay.corner .sheet .sub{font-size:12px;margin-bottom:10px;}
  #overlay.corner .chg svg{margin-bottom:10px;}
  #overlay.corner .chg .msg{font-size:12.5px;min-height:34px;margin-bottom:10px;}
  #overlay.corner .btn{min-width:0;padding:11px 12px;font-size:13px;}
  body.touch #overlay.corner .sheet{width:min(52vw,380px);}
  .sheet{background:#F1F5F8;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 30px rgba(29,39,51,.12);padding:26px 28px;width:min(92vw,470px);margin:auto;}
  .sheet h1{font-size:22px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em;}
  .sheet .sub{font-size:13px;color:var(--ink-2);margin-bottom:16px;}
  .sheet ul{margin:0 0 18px;padding-left:18px;font-size:13px;color:var(--ink-2);line-height:1.75;}
  .sheet ul b{color:var(--ink);}
  .sheet .row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{flex:1;min-width:150px;padding:13px 16px;border-radius:10px;border:1px solid var(--line);
    background:#E7EDF3;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;}
  .btn.primary{background:var(--safety);border-color:#D8A104;}
  .btn:focus-visible{outline:3px solid #3F7FD1;outline-offset:2px;}
  .result{display:flex;gap:22px;margin-bottom:20px;}
  .result div .k{font-size:11px;font-weight:700;color:var(--ink-2);letter-spacing:.05em;}
  .result div .v{font-family:var(--mono);font-size:26px;font-weight:800;}
  .insp .fig{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;}
  .insp .fig svg{display:block;width:100%;height:auto;}
  .insp .prog{font-family:var(--mono);font-size:11.5px;font-weight:800;color:var(--ink-2);margin-bottom:8px;letter-spacing:.04em;}
  .insp .q{font-size:16px;font-weight:800;margin-bottom:6px;}
  .insp .hint{font-size:12.5px;color:var(--ink-2);line-height:1.6;margin-bottom:14px;}
  .insp .fb{font-size:13px;font-weight:700;line-height:1.65;margin-bottom:14px;min-height:44px;}
  .insp .fb.ok{color:var(--ok);} .insp .fb.ng{color:var(--warn);}
  .chk{margin:0 0 18px;padding:0;list-style:none;font-size:13px;}
  .chk li{padding:7px 2px;border-bottom:1px solid var(--line);font-weight:700;
    display:flex;justify-content:space-between;gap:10px;}
  .chk li .r{font-family:var(--mono);font-weight:800;}
  .chk li.ok .r{color:var(--ok);} .chk li.ng .r{color:var(--warn);}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .brand svg{width:112px;height:auto;flex:none;}
  .brand .top{font-size:11.5px;font-weight:800;letter-spacing:.09em;color:var(--ink-2);}
  .brand h1{font-size:28px;margin:3px 0 0;letter-spacing:-.02em;}
  .brand .sub2{font-size:12.5px;color:var(--ink-2);margin-top:4px;font-weight:700;}
  .discList{margin:0 0 18px;padding:0;list-style:none;font-size:13px;}
  .discList li{padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink-2);font-weight:700;}
  .discList li.got{color:var(--ink);}
  .discList li.got::before{content:'●';color:var(--ok);margin-right:8px;}
  .discList li::before{content:'○';color:#B9C2CC;margin-right:8px;}
</style>
</head>
<body>
<div id="boot"><div class="bootbox">지게차 연수원 · 불러오는 중</div></div>
<canvas id="scene"></canvas>

<div id="hud">
  <div class="card" id="task" style="pointer-events:auto">
    <div class="eyebrow" id="taskEyebrow">지시</div>
    <div class="title" id="taskTitle">-</div>
    <div class="desc" id="taskDesc"></div>
    <div id="roam">
      <div class="goal">
        <div class="k">찾아갈 지번</div>
        <div class="id" id="rGoal">-</div>
        <div class="d" id="rGoalD"></div>
      </div>
      <div id="roamMore">
        <div class="rows">
          <span class="k">탐사</span><span class="v" id="rExp">0%</span>
          <span class="k">주행거리</span><span class="v" id="rDist">0 m</span>
          <span class="k">등급</span><span class="v" id="rGrade">견습</span>
          <span class="k">발견</span><span class="v" id="rDisc">0 / 0</span>
        </div>
        <canvas id="mini" width="364" height="300"></canvas>
      </div>
    </div>
    <div id="chargeBox">
      <div class="ttl">충전 구역</div>
      <ul id="chargeChk"></ul>
      <button id="chargeStart">충전 절차 시작</button>
    </div>
  </div>

  <div class="card" id="stat">
    <div><div class="k">시간</div><div class="v" id="statTime">0:00</div></div>
    <div><div class="k">파손</div><div class="v" id="statDmg">0</div></div>
    <div><div class="k">지적</div><div class="v" id="statFault">0</div></div>
    <div><div class="k">배터리</div><div class="v" id="statBatt">100%</div></div>
  </div>

  <div id="panel">
    <div class="pbox" id="panelL">
      <div class="steerBox">
        <canvas id="steerCv" width="180" height="112"></canvas>
        <div class="col"><div class="row">
          <span class="k" id="kSpd">속도 km/h</span><span class="v" id="gSpd">0.0</span>
        </div></div>
      </div>
    </div>
    <div class="pbox" id="panelR">
      <div class="col">
        <div class="row"><span class="k" id="kLift">리프트 m</span><span class="v" id="gLift">0.00</span></div>
        <div class="row"><span class="k" id="kReach">리치 cm</span><span class="v" id="gReach">0</span></div>
        <div class="row"><span class="k">마스트</span><span class="v" id="gTilt">수평</span></div>
        <div class="row"><span class="k" id="kLoad">적재 kg</span><span class="v" id="gLoad">없음</span></div>
      </div>
    </div>
  </div>

  <div class="card alignBox" id="alignL">
    <div class="pt">위에서 본 모습</div>
    <canvas id="alignTop" width="218" height="150"></canvas>
    <div class="lbl" id="alignLbl">정렬</div>
  </div>
  <div class="card alignBox" id="alignR">
    <div class="pt">옆에서 본 모습</div>
    <canvas id="alignSide" width="218" height="92"></canvas>
    <div class="lbl2" id="alignLbl2"></div>
  </div>

  <div id="toast"></div>

  <div id="risk">
    <div class="msg" id="riskMsg"></div>
    <div class="bar"><i id="riskBar"></i></div>
  </div>

  <div class="card ctl" id="ctlLeft">
    <div class="wheelBox">
      <div class="wheelWrap" id="wheelWrap">
        <div class="tick"></div>
        <svg viewBox="0 0 100 100" id="wheelSvg">
          <circle cx="50" cy="50" r="44" fill="#3A4553"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="#242D38" stroke-width="3"/>
          <circle cx="50" cy="50" r="31" fill="none" stroke="#4C5766" stroke-width="1.5"/>
          <circle cx="50" cy="50" r="6" fill="#4C5766"/>
          <circle id="wheelKnob" cx="50" cy="19" r="9.5" fill="#F2B705" stroke="#8B6E06" stroke-width="1.5"/>
        </svg>
      </div>
      <button id="pedal" title="브레이크 (Space)"><span id="pedalSt">제동</span></button>
    </div>
  </div>

  <div class="card ctl" id="ctlRight">
    <button id="horn" title="경음기 (H)">경음기</button>
    <button id="wrapBtn" title="랩핑 (L)" disabled>랩핑</button>
    <div class="levers" id="levers"></div>
    <div class="sep"></div>
    <div class="thr" id="thr">
      <div class="dir">전진</div>
      <div class="slot"><div class="mid"></div><div class="stem"></div><div class="knob"></div></div>
      <div class="dir">후진</div>
      <div class="cap">전·후진 <b>W S</b></div>
    </div>
  </div>

  <div id="tour">
    <div class="ttl" id="tourTtl"></div>
    <div class="txt" id="tourTxt"></div>
    <div class="foot">
      <span class="n" id="tourN"></span>
      <button class="skip" id="tourSkip">건너뛰기</button>
      <button class="next" id="tourNext">다음</button>
    </div>
  </div>

  <div id="tourRing"></div>
  <div id="guide"><span id="guideArrow">➤</span><span id="guideDist"></span></div>

  <div class="card closed" id="zoom">
    <button data-b="bar" id="btnBar">⋯</button>
    <span id="zoomItems">
      <button data-z="out" id="zoomOut">−</button>
      <button data-z="in">+</button>
      <button data-u="cycle" id="btnUi">조작반</button>
      <button data-v="cycle" id="btnView">시점</button>
      <button data-r="rear" id="btnRear">후방</button>
      <button data-f="full" id="btnFull">전체</button>
      <button data-m="map" id="btnMap" class="hide">정보</button>
      <button id="btnMute">♪</button>
      <button id="btnExit">메뉴</button>
    </span>
  </div>

  <div id="overlay"><div class="sheet" id="sheet"></div></div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/pallet.js"></script>
<script src="js/phys.js"></script>
<script src="js/assets.js"></script>
<script src="js/world.js"></script>
<script src="js/dock.js"></script>
<script src="js/driver.js"></script>
<script src="js/controls.js"></script>
<script src="js/truck.js"></script>
<script src="js/fork.js"></script>
<script src="js/hazard.js"></script>
<script src="js/roam.js"></script>
<script src="js/camera.js"></script>
<script src="js/gauge.js"></script>
<script src="js/inspect.js"></script>
<script src="js/edu.js"></script>
<script src="js/practice.js"></script>
<script src="js/workday.js"></script>
<script src="js/rush.js"></script>
<script src="js/drive.js"></script>
<script src="js/audio.js"></script>
<script src="js/charge.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
