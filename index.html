   계기판 · 정렬 게이지
   ============================================================ */
function drawInstruments(){
  const dg = v => (Math.round(Math.abs(v)*180/Math.PI*10)/10).toFixed(1);
  const gl = document.getElementById('gLift');
  gl.textContent = truck.lift.toFixed(2);
  gl.className = 'v' + (truck.lift > CFG.liftSafe ? ' bad' : '');
  const gr = document.getElementById('gReach');
  gr.textContent = String(Math.round(truck.reach*100));
  gr.className = 'v' + (truck.reach > CFG.reachOut ? ' bad' : '');
  const fa = forkAngle();
  const gt = document.getElementById('gTilt');
  const shake = Math.abs(G.sway) > 0.012 ? ' ~' : '';
  if(fa < -0.005){ gt.textContent = '전경 ' + dg(fa) + '°' + shake; gt.className = 'v bad'; }
  else if(fa >= CFG.keepTilt){ gt.textContent = '후경 ' + dg(fa) + '°' + shake; gt.className = 'v ok'; }
  else { gt.textContent = '수평 ' + dg(fa) + '°' + shake; gt.className = 'v blue'; }

  const gld = document.getElementById('gLoad');
  if(truck.carry){
    const w = truck.carry.w || 0;
    const use = Math.round(w / Math.max(residualKg(truck.lift), 1) * 100);
    gld.textContent = w + '·' + use + '%';
    gld.className = 'v' + (use >= 100 ? ' bad' : (use >= 80 ? ' blue' : ' ok'));
  }else{
    gld.textContent = '없음';
    gld.className = 'v';
  }

  const kmh = Math.abs(truck.v) * 3.6;
  const gv = document.getElementById('gSpd');
  gv.textContent = kmh.toFixed(1);
  gv.className = 'v' + (truck.lift > CFG.liftSafe && kmh > 1.6 ? ' bad' : '');

  drawSteer(truck.steer * 180/Math.PI);
}

/* 조향 계기 — 실제 장비의 구동륜 방향 표시등과 같은 형태.
   반원보다 조금 넓은 호에 램프를 늘어놓고, 지금 향한 칸을 밝힌다. */
const steerCtx = document.getElementById('steerCv').getContext('2d');
const STEER_SEG = 13, STEER_ARC = 104;   // 편도 104° — 조향 최대 90° 보다 조금 넓게
function drawSteer(deg){
  /* 좌표계를 아크 크기에 맞춰 좁혔다. 예전에는 300 폭에 아크가 절반만 써서
     상자를 넓혀도 그림만 작게 그려졌다. */
  const W = 180, H = 112, cx = 90, cy = 104, r0 = 52, r1 = 76;
  const c = steerCtx;
  c.clearRect(0, 0, W, H);

  const active = Math.round(((deg + STEER_ARC) / (2*STEER_ARC)) * (STEER_SEG - 1));
  const mid = (STEER_SEG - 1) / 2;
  const neutral = Math.abs(deg) < 3;
  const hot = neutral ? '#17A673' : (deg < 0 ? '#D93025' : '#1A73E8');

  for(let i=0;i<STEER_SEG;i++){
    const t = i/(STEER_SEG-1);
    const a = (-STEER_ARC + t*2*STEER_ARC) * Math.PI/180;
    const sx = Math.sin(a), sy = -Math.cos(a);
    const between = (i >= Math.min(mid, active) && i <= Math.max(mid, active));
    let col = '#C7D0D9';
    if(i === active) col = hot;
    else if(between && !neutral) col = deg < 0 ? '#F0BDB9' : '#B9D2F5';
    else if(i === mid) col = '#9AA5AE';
    c.strokeStyle = col;
    c.lineWidth = (i === active) ? 13 : 9;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(cx + sx*r0, cy + sy*r0);
    c.lineTo(cx + sx*r1, cy + sy*r1);
    c.stroke();
  }

  const a2 = deg * Math.PI/180;
  c.strokeStyle = hot; c.lineWidth = 5; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(cx, cy);
  c.lineTo(cx + Math.sin(a2)*(r0 - 12), cy - Math.cos(a2)*(r0 - 12));
  c.stroke();
  c.fillStyle = hot;
  c.beginPath(); c.arc(cx, cy, 7, 0, 7); c.fill();

  c.strokeStyle = '#B9C2CC'; c.lineWidth = 3;
  c.beginPath();
  c.moveTo(cx - 22, cy + 4); c.lineTo(cx - 22, cy - 22);
  c.moveTo(cx + 22, cy + 4); c.lineTo(cx + 22, cy - 22);
  c.stroke();

  const av = Math.abs(deg);
  c.fillStyle = hot;
  c.font = 'bold 22px ui-monospace, "Roboto Mono", monospace';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(neutral ? '중립' : ((deg < 0 ? '좌 ' : '우 ') + Math.round(av) + '°'), cx, 52);
  c.font = 'bold 11px Pretendard, sans-serif';
  c.fillStyle = '#5A6875';
  c.fillText('구동륜 방향', cx, 72);
}

const gTop = document.getElementById('alignTop').getContext('2d');
const gSide = document.getElementById('alignSide').getContext('2d');
const PAL_FILL = '#D9B27A', PAL_EDGE = '#9E7C4A';
const OK_FILL = '#17A673', OK_EDGE = '#0E6B4B';
const NG_FILL = '#E03B36', NG_EDGE = '#A32723';

function drawGauge(){
  const lbl = document.getElementById('alignLbl');
  const lbl2 = document.getElementById('alignLbl2');
  const g = G.gauge;
  const shown = !!g || !!G.place;
  if(G.alignShown !== shown){
    G.alignShown = shown;
    document.getElementById('alignL').style.display = shown ? 'block' : 'none';
    document.getElementById('alignR').style.display = shown ? 'block' : 'none';
  }
  if(!shown) return;
  if(!g){ drawPlace(); return; }

  const okLat = Math.abs(g.lat) < CFG.tolLat;
  const okAng = Math.abs(g.ang) < CFG.tolAng;
  const okY = Math.abs(g.dy) < CFG.tolY;
  const okT = Math.abs(g.tilt) < CFG.tolTilt;
  const okR = !!g.okR;
  const S = 84, FL = CFG.forkTip*S, half = CFG.palHalf*S;

  const cx = 109, cy = 60;
  gTop.clearRect(0,0,218,150);
  gTop.strokeStyle = '#DCE4EC'; gTop.lineWidth = 2;
  gTop.setLineDash([6,5]);
  gTop.beginPath(); gTop.moveTo(cx, 0); gTop.lineTo(cx, 150); gTop.stroke();
  gTop.setLineDash([]);
  gTop.fillStyle = PAL_FILL; gTop.strokeStyle = PAL_EDGE; gTop.lineWidth = 3;
  gTop.beginPath(); gTop.rect(cx-half, cy-half, half*2, half*2); gTop.fill(); gTop.stroke();
  gTop.fillStyle = '#FFFFFF';
  for(const hx of [-CFG.forkGap*S, CFG.forkGap*S]){
    gTop.beginPath(); gTop.rect(cx+hx-0.11*S, cy-half+2, 0.22*S, half*2-4);
    gTop.fill(); gTop.stroke();
  }

  /* 팔레트를 화면에 고정해두고 지겟발을 그린다.
     lat 과 ang 은 지게차 기준이라, 팔레트 중심을 축으로 돌려야 한다. */
  const A = g.ang;
  const lon = CFG.forkTip + CFG.palHalf - g.pen;
  const bx = cx + (g.lat*Math.cos(A) + lon*Math.sin(A))*S;
  const by = cy + (lon*Math.cos(A) - g.lat*Math.sin(A))*S;
  const posOk = okLat && okAng && okR;
  gTop.save();
  gTop.translate(bx, by);
  gTop.rotate(-A);
  gTop.fillStyle = posOk ? OK_FILL : NG_FILL;
  gTop.strokeStyle = posOk ? OK_EDGE : NG_EDGE;
  gTop.lineWidth = 2.5;
  for(const fx of [-CFG.forkGap*S, CFG.forkGap*S]){
    gTop.beginPath(); gTop.rect(fx-0.055*S, -FL, 0.11*S, FL);
    gTop.fill(); gTop.stroke();
  }
  gTop.restore();

  const SY = 300, ground = 78, nearX = 112;
  gSide.clearRect(0,0,218,92);
  gSide.strokeStyle = '#C7D0D9'; gSide.lineWidth = 2.5;
  gSide.beginPath(); gSide.moveTo(0, ground+0.75); gSide.lineTo(218, ground+0.75); gSide.stroke();
  const pTop = ground - CFG.palH*SY;
  gSide.fillStyle = PAL_FILL; gSide.strokeStyle = PAL_EDGE; gSide.lineWidth = 3;
  gSide.beginPath(); gSide.rect(nearX, pTop, CFG.palHalf*2*S, CFG.palH*SY); gSide.fill(); gSide.stroke();
  gSide.fillStyle = '#FFFFFF';
  gSide.beginPath(); gSide.rect(nearX+2, ground - 0.098*SY, CFG.palHalf*2*S-4, 0.076*SY);
  gSide.fill(); gSide.stroke();
  const fy = ground - (CFG.holeY + g.dy)*SY;
  const tipX = nearX + Math.min(g.pen, CFG.palHalf*2)*S;
  const hOk = okY && okT && okR;
  gSide.save();
  gSide.translate(tipX - FL, fy);
  gSide.rotate(-g.tilt*1.8);
  gSide.fillStyle = hOk ? OK_FILL : NG_FILL;
  gSide.strokeStyle = hOk ? OK_EDGE : NG_EDGE;
  gSide.lineWidth = 2.5;
  gSide.beginPath(); gSide.rect(0, -5, FL, 10); gSide.fill(); gSide.stroke();
  gSide.restore();

  const cm = Math.round(g.dy*100);
  const allOk = okLat && okAng && okY && okT && okR;
  lbl.textContent =
      g.over ? '팔레트 위로 지나갑니다'
    : !okT ? '마스트 수평 아님 · ' + (Math.round(Math.abs(g.tilt)*180/Math.PI*10)/10).toFixed(1) + '°'
    : !okY ? '포크 높이 ' + (cm >= 0 ? '+' : '') + cm + 'cm'
    : !okAng ? '각도 ' + Math.round(Math.abs(g.ang)*180/Math.PI) + '° 틀어짐'
    : !okLat ? '좌우 ' + Math.round(g.lat*100) + 'cm'
    : !okR ? '리치를 내미세요 · ' + Math.round(g.reach*100) + 'cm'
    : '진입 가능';
  lbl.className = 'lbl ' + (allOk ? 'ok' : 'bad');
  lbl2.textContent = '높이 ' + (cm >= 0 ? '+' : '') + cm + 'cm';
  lbl2.className = 'lbl2 ' + (okY && okT ? 'ok' : 'bad');
}

/* 랙·평치에 내려놓을 때의 게이지.
   화면 가운데가 내가 든 팔레트이고, 점선이 놓일 자리다. */
function drawPlace(){
  const q = G.place;
  const lbl = document.getElementById('alignLbl');
  const lbl2 = document.getElementById('alignLbl2');
  const S = 84, half = CFG.palHalf*S, slotHalf = 0.60*S;
  const cx = 109, cy = 66;

  const off = Math.hypot(q.lat, q.lon);
  const okXZ = off <= CFG.putTolXZ;
  const okAng = Math.abs(q.ang) <= CFG.putTolAng;
  const okTilt = !q.rack || Math.abs(q.tilt) <= CFG.putTilt;
  const okDown = q.dy >= -0.02;

  /* ── 위에서 본 모습 ── */
  gTop.clearRect(0,0,218,150);
  gTop.strokeStyle = '#DCE4EC'; gTop.lineWidth = 2;
  gTop.setLineDash([6,5]);
  gTop.beginPath(); gTop.moveTo(cx, 0); gTop.lineTo(cx, 150); gTop.stroke();
  gTop.setLineDash([]);

  // 놓일 자리
  const tx = cx + q.lat*S, ty = cy + q.lon*S;
  const okPos = okXZ && okAng;
  gTop.save();
  gTop.translate(tx, ty);
  gTop.rotate(-q.ang);
  gTop.strokeStyle = okPos ? OK_EDGE : NG_EDGE;
  gTop.fillStyle = okPos ? 'rgba(23,166,115,.16)' : 'rgba(224,59,54,.14)';
  gTop.lineWidth = 3.5;
  gTop.setLineDash([9,6]);
  gTop.beginPath(); gTop.rect(-slotHalf, -slotHalf, slotHalf*2, slotHalf*2);
  gTop.fill(); gTop.stroke();
  gTop.setLineDash([]);
  gTop.restore();

  // 내가 든 팔레트
  gTop.fillStyle = PAL_FILL; gTop.strokeStyle = PAL_EDGE; gTop.lineWidth = 3;
  gTop.beginPath(); gTop.rect(cx-half, cy-half, half*2, half*2); gTop.fill(); gTop.stroke();
  gTop.fillStyle = '#FFFFFF';
  for(const hx of [-CFG.forkGap*S, CFG.forkGap*S]){
    gTop.beginPath(); gTop.rect(cx+hx-0.11*S, cy-half+2, 0.22*S, half*2-4);
    gTop.fill(); gTop.stroke();
  }

  // 편차 화살표
  if(off > 0.03){
    gTop.strokeStyle = okXZ ? OK_FILL : NG_FILL; gTop.lineWidth = 2;
    gTop.beginPath(); gTop.moveTo(cx, cy); gTop.lineTo(tx, ty); gTop.stroke();
  }
  gTop.fillStyle = '#5A6875';
  gTop.font = 'bold 11px ui-monospace, monospace';
  gTop.textAlign = 'left';
  gTop.fillText('편차 ' + Math.round(off*100) + 'cm', 5, 13);
  gTop.fillText('각도 ' + Math.round(Math.abs(q.ang)*180/Math.PI) + '°', 5, 27);

  /* ── 옆에서 본 모습 ── */
  const SY = 150, base = 74, x0 = 34;
  gSide.clearRect(0,0,218,92);

  // 놓일 면 (랙 단 또는 바닥)
  gSide.fillStyle = q.rack ? '#2A5FA6' : '#C7D0D9';
  gSide.fillRect(x0 - 12, base, 172, q.rack ? 10 : 6);
  gSide.fillStyle = '#5A6875';
  gSide.font = 'bold 11px ui-monospace, monospace';
  gSide.textAlign = 'left';
  gSide.fillText(q.rack ? '랙 단' : '바닥', 5, 88);

  // 내 팔레트 — 마스트 기울기만큼 기운다
  const py = base - Math.max(q.dy, -0.05)*SY;
  gSide.save();
  gSide.translate(x0 + 74, py);
  gSide.rotate(-q.tilt*1.8);
  gSide.fillStyle = PAL_FILL;
  gSide.strokeStyle = okTilt ? PAL_EDGE : NG_EDGE;
  gSide.lineWidth = okTilt ? 2 : 3;
  gSide.beginPath(); gSide.rect(-74, -CFG.palH*SY, 148, CFG.palH*SY);
  gSide.fill(); gSide.stroke();
  gSide.restore();

  // 여유 높이
  const hOk = okDown && q.dy < 0.35;
  gSide.strokeStyle = hOk ? OK_FILL : (okDown ? '#1A73E8' : NG_FILL);
  gSide.lineWidth = 2;
  gSide.beginPath();
  gSide.moveTo(x0 + 168, base); gSide.lineTo(x0 + 168, py);
  gSide.stroke();
  gSide.fillStyle = hOk ? OK_EDGE : (okDown ? '#0F4A9C' : NG_EDGE);
  gSide.textAlign = 'right';
  gSide.fillText((q.dy >= 0 ? '+' : '') + Math.round(q.dy*100) + 'cm', 214, base - 6);

  lbl.textContent =
    !okTilt ? '마스트를 수평으로'
    : !okDown ? '단보다 낮습니다 · 더 올리세요'
    : !okXZ ? '위치 이탈 · ' + Math.round(off*100) + 'cm'
    : !okAng ? '각도 틀어짐'
    : (q.dy > 0.35 ? '자리 맞음 · ' + Math.round(q.dy*100) + 'cm 더 내리세요' : '내려놓기 가능');
  lbl.className = 'lbl ' + ((okTilt && okDown && okXZ && okAng) ? 'ok' : 'bad');
  lbl2.textContent = '여유 ' + (q.dy >= 0 ? '+' : '') + Math.round(q.dy*100) + 'cm';
  lbl2.className = 'lbl2 ' + (okDown && okTilt ? 'ok' : 'bad');
}

/* ============================================================
   시업점검
   처음 배울 때는 전 항목에 결함을 심는다. 정상인 걸 본 적이 없으면
   무엇이 결함인지 알 수 없기 때문이다. 두 번째부터는 일부만 심는다.
   ============================================================ */
/* 법정 근거 — 산업안전보건기준에 관한 규칙 제35조 [별표 3] 9호
   지게차를 사용하여 작업을 하는 때
     가. 제동장치 및 조종장치 기능의 이상 유무
     나. 하역장치 및 유압장치 기능의 이상 유무
     다. 바퀴의 이상 유무
     라. 전조등·후미등·방향지시기 및 경보장치 기능의 이상 유무
   법정 항목은 이 네 가지뿐이고, 아래 항목은 그것을 실제로 볼 수 있는
   부위로 쪼갠 것이다. 법정 근거가 없는 항목은 넣지 않는다. */
const DEFECTS = [

function inspSvg(k, bad){
  const S = b => '<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg">' + b + '</svg>';
  const D = '#5A6875', R = '#E03B36', OK = '#17A673';
  const tag = (t, c, x, y)=> '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-size="13" font-weight="700" fill="' + c + '">' + t + '</text>';

  if(k === 'brake'){
    return S(
      '<path d="M60 128 L240 128" stroke="#B9C2CC" stroke-width="6" stroke-linecap="round"/>' +
      '<rect x="96" y="' + (bad ? 74 : 60) + '" width="108" height="26" rx="8" fill="#8A96A2" stroke="' + D + '" stroke-width="2"' +
        (bad ? ' transform="rotate(6 150 87)"' : '') + '/>' +
      '<path d="M150 100 L150 128" stroke="' + D + '" stroke-width="6"/>' +
      (bad
        ? '<path d="M214 62 l22 0 M225 52 l0 22" stroke="' + R + '" stroke-width="4" stroke-linecap="round"/>' +
          '<path d="M62 62 q14 14 0 28" fill="none" stroke="' + R + '" stroke-width="3"/>' + tag('복귀 지연', R, 150, 30)
        : tag('즉시 복귀', OK, 150, 30)));
  }
  if(k === 'ctrl'){
    const lever = (x, off)=>
      '<rect x="' + (x-13) + '" y="34" width="26" height="84" rx="13" fill="#E1E8EF" stroke="' + D + '" stroke-width="2"/>' +
      '<rect x="' + (x-11) + '" y="' + (62 + off) + '" width="22" height="26" rx="10" fill="#3A4553"/>';
    return S(lever(78, 0) + lever(150, bad ? -26 : 0) + lever(222, 0) +
      (bad
        ? '<circle cx="150" cy="49" r="26" fill="none" stroke="' + R + '" stroke-width="2.5" stroke-dasharray="5 4"/>' + tag('중립 복귀 안 됨', R, 150, 142)
        : tag('모두 중립', OK, 150, 142)));
  }
  if(k === 'fork'){
    return S(
      '<rect x="34" y="26" width="18" height="104" rx="3" fill="#B9C2CC" stroke="' + D + '" stroke-width="2"/>' +
      '<rect x="52" y="44" width="150" height="12" rx="2" fill="#CBD5DE" stroke="' + D + '" stroke-width="2"/>' +
      '<rect x="52" y="' + (bad ? 104 : 98) + '" width="150" height="12" rx="2" fill="#CBD5DE" stroke="' + D + '" stroke-width="2"' +
        (bad ? ' transform="rotate(7 52 110)"' : '') + '/>' +
      (bad
        ? '<path d="M56 98 l7 6 l-6 5 l8 5" fill="none" stroke="' + R + '" stroke-width="3"/>' +
          '<circle cx="60" cy="106" r="17" fill="none" stroke="' + R + '" stroke-width="2.5" stroke-dasharray="5 4"/>' + tag('균열 · 휨', R, 246, 112)
        : tag('정상', OK, 246, 112)));
  }
  if(k === 'chain'){
    const links = (x, slack)=>{
      let o = '';
      for(let i=0;i<9;i++){
        const y = 20 + i*13, dx = slack ? Math.sin(i*0.8)*7 : 0;
        o += '<rect x="' + (x-6+dx) + '" y="' + y + '" width="12" height="10" rx="4" fill="none" stroke="' + D + '" stroke-width="2.4"/>';
      }
      return o;
    };
    return S('<rect x="20" y="10" width="10" height="130" fill="#CBD5DE"/>' +
      '<rect x="270" y="10" width="10" height="130" fill="#CBD5DE"/>' +
      links(105, false) + links(195, bad) +
      (bad
        ? '<circle cx="195" cy="76" r="30" fill="none" stroke="' + R + '" stroke-width="2.5" stroke-dasharray="5 4"/>' + tag('한쪽 늘어짐', R, 150, 146)
        : tag('장력 같음', OK, 150, 146)));
  }
  if(k === 'hose'){
    return S(
      '<rect x="150" y="14" width="34" height="96" rx="6" fill="#B9C2CC" stroke="' + D + '" stroke-width="2"/>' +
      '<path d="M150 60 C110 60 90 88 60 92" fill="none" stroke="' + D + '" stroke-width="7" stroke-linecap="round"/>' +
      '<rect x="140" y="52" width="16" height="16" rx="3" fill="#8A96A2"/>' +
      (bad
        ? '<path d="M148 68 q3 10 0 16 q-3 -6 0 -16" fill="' + R + '"/>' +
          '<ellipse cx="148" cy="126" rx="26" ry="6" fill="' + R + '" opacity="0.45"/>' + tag('연결부 누유', R, 150, 146)
        : tag('누유 없음', OK, 150, 146)));
  }
  if(k === 'wheel'){
    return S(
      '<circle cx="150" cy="72" r="50" fill="#3A4553"/>' +
      '<circle cx="150" cy="72" r="' + (bad ? 47 : 50) + '" fill="none" stroke="' + D + '" stroke-width="3"/>' +
      '<circle cx="150" cy="72" r="20" fill="#B9C2CC" stroke="' + D + '" stroke-width="2"/>' +
      (bad
        ? '<path d="M150 22 a50 50 0 0 1 34 13 l-34 37 z" fill="#4A5563"/>' +
          '<path d="M186 96 l12 9 l-9 5 z" fill="' + R + '"/>' +
          '<circle cx="188" cy="100" r="16" fill="none" stroke="' + R + '" stroke-width="2.5" stroke-dasharray="5 4"/>' + tag('이물 · 편마모', R, 150, 142)
        : tag('정상', OK, 150, 142)));
  }
  if(k === 'beep' || k === 'horn'){
    return S(
      '<rect x="66" y="46" width="34" height="52" rx="5" fill="#B9C2CC" stroke="' + D + '" stroke-width="2"/>' +
      '<path d="M100 52 l30 -22 v112 l-30 -22 z" fill="#8A96A2" stroke="' + D + '" stroke-width="2"/>' +
      (!bad
        ? '<path d="M148 52 a30 30 0 0 1 0 40" fill="none" stroke="' + OK + '" stroke-width="4" stroke-linecap="round"/>' +
          '<path d="M164 38 a52 52 0 0 1 0 68" fill="none" stroke="' + OK + '" stroke-width="4" stroke-linecap="round"/>' + tag('소리 남', OK, 224, 80)
        : '<path d="M152 46 l52 52 M204 46 l-52 52" stroke="' + R + '" stroke-width="5" stroke-linecap="round"/>' +
          tag(k === 'beep' ? '경보음 없음' : '경음기 안 울림', R, 178, 132)));
  }
  {
    const lamp = (x, on)=>
      '<circle cx="' + x + '" cy="72" r="24" fill="' + (on ? '#F7E7A8' : '#9AA5AE') + '" stroke="' + D + '" stroke-width="2"/>' +
      (on ? '<path d="M' + (x+28) + ' 60 l22 -8 M' + (x+28) + ' 72 l24 0 M' + (x+28) + ' 84 l22 8" stroke="#E8C64A" stroke-width="3" stroke-linecap="round"/>' : '');
    return S('<rect x="30" y="34" width="240" height="76" rx="10" fill="#E5CE86" stroke="#A98F3C" stroke-width="2"/>' +
      lamp(84, !bad) + lamp(196, true) +
      (bad
        ? '<circle cx="84" cy="72" r="32" fill="none" stroke="' + R + '" stroke-width="2.5" stroke-dasharray="5 4"/>' + tag('한쪽 불량', R, 150, 140)
        : tag('모두 점등', OK, 150, 140)));
  }
}

const INSP = { i:0, answered:false, correct:false, bad:[], miss:0, hit:0 };

function inspStart(firstTime){
  INSP.i = 0; INSP.answered = false; INSP.miss = 0; INSP.hit = 0;
  INSP.bad = DEFECTS.map(()=> true);
  if(!firstTime){
    // 두 번째부터는 일부만 심는다
    INSP.bad = DEFECTS.map(()=> false);
    const n = 1 + Math.floor(Math.random()*3);
    const idx = DEFECTS.map((_,i)=>i).sort(()=> Math.random()-0.5).slice(0, n);
    for(const i of idx) INSP.bad[i] = true;
  }
  G.defects = {}; G.defectSeen = {};
  showSheet(inspSheet());
}

function inspSheet(){
  const d = DEFECTS[INSP.i];
  const bad = INSP.bad[INSP.i];
  let fb = '', btns;
  if(INSP.answered){
    fb = '<div class="fb ' + (INSP.correct ? 'ok' : 'ng') + '">' +
      (INSP.correct ? '맞습니다. ' : '틀렸습니다. ') + (bad ? d.bad : d.good) +
      (!INSP.correct && bad ? ' 이대로 두면 ' + d.eff + '.' : '') + '</div>';
    btns = '<button class="btn primary" data-act="inspNext">' +
      (INSP.i + 1 >= DEFECTS.length ? '점검 마치기' : '다음 항목') + '</button>';
  }else{
    fb = '<div class="fb">&nbsp;</div>';
    btns = '<button class="btn" data-act="inspGood">정상</button>' +
           '<button class="btn" data-act="inspBad">결함</button>';
  }
  return '<div class="insp">' +
    '<div class="prog">시업점검 ' + (INSP.i+1) + ' / ' + DEFECTS.length + ' · ' + d.law + '</div>' +
    '<h1>' + d.n + '</h1>' +
    '<div class="fig">' + inspSvg(d.k, bad) + '</div>' +
    '<div class="q">' + d.q + '</div>' +
    '<div class="hint">' + d.hint + '</div>' + fb +
    '<div class="row">' + btns + '</div></div>';
}

function inspAnswer(sayBad){
  if(INSP.answered) return;
  const bad = INSP.bad[INSP.i];
  INSP.correct = (sayBad === bad);
  INSP.answered = true;
  if(INSP.correct){ INSP.hit++; blip(760, 0.12, 'triangle', 0.05); }
  else{
    if(bad){ INSP.miss++; G.defects[DEFECTS[INSP.i].k] = true; }
    thud(0.25);
  }
  showSheet(inspSheet());
}

function inspNext(){
  INSP.i++;
  INSP.answered = false;
  if(INSP.i >= DEFECTS.length){ inspDone(); return; }
  showSheet(inspSheet());
}

function inspDone(){
  const found = DEFECTS.filter((d, i)=> INSP.bad[i] && !G.defects[d.k]);
  const rows = DEFECTS.map((d, i)=>{
    const bad = INSP.bad[i];
    const missed = !!G.defects[d.k];
    return '<li class="' + (missed ? 'ng' : 'ok') + '"><span>' + d.n + '</span>' +
      '<span class="r">' + (missed ? '못 찾음' : (bad ? '찾음' : '정상')) + '</span></li>';
  }).join('');
  const head = INSP.miss === 0
    ? '<h1>점검 완료</h1><div class="sub">결함을 모두 찾았습니다</div>'
    : '<h1>점검 완료</h1><div class="sub">못 찾은 결함이 ' + INSP.miss + '건 있습니다. 그대로 운행합니다</div>';
  const fix = found.length
    ? '<div class="sub">찾아낸 결함 ' + found.length + '건은 정비 요청을 해야 운행할 수 있습니다. ' +
      '결함을 알고도 그대로 운행하는 것은 그 자체가 위반입니다.</div>' +
      '<div class="row"><button class="btn primary" data-act="inspFix">정비 요청 후 운행</button></div>'
    : '<div class="row"><button class="btn primary" data-act="eduDrive">운행 시작</button></div>';
  showSheet(head + '<ul class="chk">' + rows + '</ul>' +
    '<div class="sub">근거는 산업안전보건기준에 관한 규칙 별표 3 제9호입니다. ' +
    '제동·조종장치, 하역·유압장치, 바퀴, 전조등·후미등·방향지시기·경보장치 네 가지이고, ' +
    '위 항목은 그것을 실제로 볼 수 있는 부위로 쪼갠 것입니다.</div>' + fix);
}

/* 찾아낸 결함은 정비 요청을 거쳐야 없어진다 */
function inspFix(){
  const n = DEFECTS.filter((d, i)=> INSP.bad[i] && !G.defects[d.k]).length;
  showSheet('<h1>정비 요청</h1>' +
    '<div class="sub">결함 ' + n + '건을 정비 요청했습니다. 수리를 마친 장비로 운행합니다.</div>' +
    '<ul><li>결함을 발견하면 운행하지 않고 <b>정비를 요청</b>합니다</li>' +
    '<li>수리 전까지는 그 장비를 쓰지 않습니다</li>' +
    '<li>못 찾고 지나친 결함은 그대로 남아 운행 중에 드러납니다</li></ul>' +
    '<div class="row"><button class="btn primary" data-act="eduDrive">운행 시작</button></div>');
  blip(760, 0.13, 'triangle', 0.05);
}

function startStep(){
  G.flags = {};
  if(G.mode === 'edu') eduSave();
  const st = TUT[G.step];
  if(!st) return;
  if(G.step === 4) G.flags.p = pal('2F-C1-1-1');
  if(G.step === 5) G.flags.p = truck.carry || pal('2F-C1-1-1');
  if(G.step === 6) G.flags.p = pal('2F-C1-3-1') || truck.carry;
  if(G.step === 7) G.flags.p2 = pal('2F-A1-2-2');
  if(st.charge && G.batt > 50) G.batt = 42;

  targetRing.visible = !!st.marker;
  targetPost.visible = !!st.marker;
  if(st.marker){
    targetRing.position.set(st.marker.x, 0.008, st.marker.z);
    targetPost.position.set(st.marker.x, 3.5, st.marker.z);
  }
  setHighlight(st.highlight);
  showTask('교육 ' + (G.step+1) + ' / ' + TUT.length, st.title, st.desc);
}

function setHighlight(id){
  if(!id){ slotGhost.visible = false; return; }
  const s = place(id);
  if(!s){ slotGhost.visible = false; return; }
  slotGhost.visible = true;
  slotGhost.position.set(s.x, s.y + 0.45, s.z);
}

   작업
   ============================================================ */
function makeMission(){
  const src = pallets.filter(p=> !p.carried && !p.broken && (p.slot || p.zone) &&
    !(p.slot && p.slot.practice) && (p.slot ? p.slot.z : p.zone.z) < 40);
  if(!src.length) return null;
  const s = src[Math.floor(Math.random()*src.length)];
  const from = s.slot || s.zone;
  const dests = slots.concat(zones).filter(v=> !v.pallet && v !== from && !v.practice && v.z < 40);
  if(!dests.length) return null;
  return { pallet:s, from:from, to:dests[Math.floor(Math.random()*dests.length)] };
}

function startChargeStep(){
  G.mission = null; G.chargeStep = true;
  slotGhost.visible = false;
  targetRing.visible = true; targetPost.visible = true;
  targetRing.position.set(CHARGE.x, 0.008, CHARGE.z);
  targetPost.position.set(CHARGE.x, 3.5, CHARGE.z);
  showTask('마지막 순서', '충전 구역으로 이동해 충전',
    '구역 안에 세우고 브레이크를 뗀 뒤, 포크 하강 · 리치 인 하면 절차가 시작됩니다.');
}

function startMission(){
  const m = makeMission();
  G.mission = m;
  if(!m){ finish(); return; }
  setHighlight(m.from.id);
  targetRing.visible = false; targetPost.visible = false;
  showTask('작업 ' + (G.missionIdx+1) + ' / ' + G.missionTotal,
    '<span class="code">' + m.from.id + '</span> 팔레트를<br><span class="code">' + m.to.id + '</span> 로 이동', '');
}

function checkObjective(){
  if(G.mode === 'rush' && G.mission){
    const m = G.mission;
    if(!m.pallet && m.from) m.pallet = m.from.pallet;
    if(m.pallet){
      const at = m.pallet.slot || m.pallet.zone;
      if(at === m.to && !truck.carry){
        G.rushIdx++;
        blip(760, 0.12, 'triangle', 0.05);
        rushStep();
      }else if(truck.carry === m.pallet) setHighlight(m.to.id);
    }
    return;
  }
  if(G.mode === 'edu'){
    const st = TUT[G.step];
    if(!st) return;
    if((G.step === 5 || G.step === 6) && !G.flags.p && truck.carry) G.flags.p = truck.carry;
    if(!G.flags.p && (G.step === 5 || G.step === 6)) return;
    if(st.check()){
      G.step++;
      if(G.step >= TUT.length) eduFinish();
      else{
        blip(760, 0.12, 'triangle', 0.05);
        toast(G.step + ' / ' + TUT.length + ' 단계 통과', true);
        eduSave(); startStep();
      }
    }
    return;
  }
  if(G.mode === 'mission' && G.mission){
    const m = G.mission;
    const at = m.pallet.slot || m.pallet.zone;
    if(at === m.to && !truck.carry){
      G.missionIdx++;
      if(G.missionIdx >= G.missionTotal) startChargeStep();
      else startMission();
    }else if(truck.carry === m.pallet) setHighlight(m.to.id);
  }
}

let practiceGroup = null;
const obstacles = [];

function clearPractice(){
  if(practiceGroup){ scene.remove(practiceGroup); practiceGroup = null; }
  obstacles.length = 0;
}
function makeCone(x, z){
  const g = new THREE.Group();
  const c = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.62, 10), mat(0xE0552E, 0.8));
  c.position.y = 0.33; c.castShadow = true; g.add(c);
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.05, 0.46), mat(0x2E3742, 0.8));
  b.position.y = 0.025; g.add(b);
  const r = new THREE.Mesh(new THREE.CylinderGeometry(0.155, 0.155, 0.10, 10), mat(0xF0F0F0, 0.8));
  r.position.y = 0.38; g.add(r);
  g.position.set(x, 0, z);
  return g;
}
function buildLevelProps(lv){
  clearPractice();
  practiceGroup = new THREE.Group();
  for(const c of (lv.cones || [])){
    const m = makeCone(c.x, c.z);
    practiceGroup.add(m);
    obstacles.push({ x:c.x, z:c.z, r:0.55, mesh:m, hit:false, cone:true });
  }
  for(const w of (lv.walls || [])){
    const len = w.x1 - w.x0;
    const b = new THREE.Mesh(new THREE.BoxGeometry(len, 1.30, 0.30), mat(COLOR.upright, 0.7));
    b.position.set((w.x0 + w.x1)/2, 0.65, w.z); b.castShadow = true;
    practiceGroup.add(b);
    for(let x=w.x0; x<=w.x1; x+=1.0) obstacles.push({ x:x, z:w.z, r:0.62, mesh:null, hit:false });
  }
  scene.add(practiceGroup);
}

function drillPallet(){
  if(G.drillPallet) return G.drillPallet;
  const g = new THREE.Group();
  g.rotation.order = 'YXZ';
  g.add(makePallet(0)); g.add(makeLoad(3));
  scene.add(g);
  const p = { cargo:CARGO[0], w:CARGO[0].w,
              id:'DRILL', x:0, z:0, y:0, yaw:0, pitch:0, pickY:0, mesh:g,
              slot:null, zone:null, carried:false, inserted:false,
              broken:false, fallV:0, falling:false };
  pallets.push(p);
  G.drillPallet = p;
  return p;
}
function pickSpawn(){
  const lv = PICK_LEVELS[G.drillLv];
  const p = drillPallet();
  if(p.slot){ p.slot.pallet = null; p.slot = null; }
  const jl = (Math.random()*2 - 1) * lv.lat;
  const ja = (Math.random()*2 - 1) * lv.ang;
  if(lv.kind === 'rack'){
    const bi = Math.floor(Math.random()*PRAC_RACK.xs.length);
    const s0 = place('연습-' + (bi+1) + '-' + (lv.level+1));
    p.x = s0.x + jl; p.z = s0.z; p.y = s0.y; p.yaw = ja;
    p.slot = s0; s0.pallet = p;
  }else{
    const d = 3.2;
    p.x = truck.x + dirX(truck.h)*d + nrmX(truck.h)*jl;
    p.z = truck.z + dirZ(truck.h)*d + nrmZ(truck.h)*jl;
    p.y = 0; p.yaw = truck.h + ja;
  }
  p.pitch = 0; p.carried = false; p.inserted = false; p.falling = false;
  truck.carry = null;
}
function pickStartPose(){
  const lv = PICK_LEVELS[G.drillLv];
  if(lv.kind === 'rack'){
    truck.x = PRAC_RACK.xs[1]; truck.z = PRAC_RACK.z - 3.6; truck.h = 0;
  }else{
    truck.x = -19; truck.z = 66; truck.h = 0;
  }
  truck.v = 0; truck.lift = 0.06; truck.reach = 0; truck.tilt = 0;
  G.wheel = 0; G.throttle = 0; truck.carry = null;
}

function drillTask(){
  if(G.drill === 'pick'){
    const lv = PICK_LEVELS[G.drillLv];
    showTask('꽂기 연습 ' + (G.drillLv+1) + ' / ' + PICK_LEVELS.length, lv.n,
      lv.d + '<br><b>' + G.drillN + ' / ' + lv.need + '</b> 성공 · 헛손질 ' + G.drillMiss + '회');
  }else{
    const lv = DRIVE_LEVELS[G.drillLv];
    showTask('주행 연습 ' + (G.drillLv+1) + ' / ' + DRIVE_LEVELS.length, lv.n,
      lv.d + '<br>구간 <b>' + (G.drillI+1) + ' / ' + lv.gates.length + '</b>' +
      (lv.need > 1 ? ' · 완주 ' + G.drillN + ' / ' + lv.need : '') +

function driveMarker(){

  const w = lv.gates[G.drillI];
  targetRing.visible = true; targetPost.visible = true;
  targetRing.position.set(w.x, 0.008, w.z);
  targetPost.position.set(w.x, 3.5, w.z);

function drillLoadLevel(){
  G.drillN = 0; G.drillI = 0; G.drillMiss = 0;
  G.damage = 0;
  if(G.drill === 'drive'){
    const lv = DRIVE_LEVELS[G.drillLv];
    buildLevelProps(lv);
    truck.x = lv.start.x; truck.z = lv.start.z; truck.h = lv.start.h;
    truck.v = 0; truck.lift = 0.15; truck.reach = 0; truck.tilt = CFG.keepTilt + 0.02;
    G.wheel = 0; G.throttle = 0; truck.carry = null;
    driveMarker();
  }else{
    clearPractice();
    targetRing.visible = false; targetPost.visible = false;
    pickStartPose();
    pickSpawn();
  }
  camera.userData.tx = truck.x; camera.userData.tz = truck.z;
  drillTask();
}
function drillStart(kind){
  hideSheet(); enterMode();
  G.mode = 'drill'; G.drill = kind; G.drillLv = 0;
  G.time = 0; G.damage = 0; G.defects = {}; G.defectSeen = {}; G.chargeStep = false; G.mission = null;
  applyTime(2);
  resetWorld();
  slotGhost.visible = false;
  setView(kind === 'pick' ? 'fork' : 'cab');
  drillLoadLevel();
  G.running = true;
  applyLayout();
}
function drillPass(){
  const list = G.drill === 'drive' ? DRIVE_LEVELS : PICK_LEVELS;
  G.running = false;
  const last = G.drillLv + 1 >= list.length;
  blip(880, 0.16, 'sine', 0.06);
  setTimeout(()=> blip(1320, 0.22, 'sine', 0.05), 150);
  showSheet('<h1>' + list[G.drillLv].n + ' 통과</h1>' +
    '<div class="sub">접촉·헛손질 ' + G.drillMiss + '회</div>' +
    (last
      ? '<div class="sub">' + (G.drill === 'drive'
          ? '주행 연습을 모두 마쳤습니다. 이제 꽂기 연습으로 넘어가세요.'
          : '꽂기 연습을 모두 마쳤습니다. 교육 과정으로 넘어가세요.') + '</div>' +
        '<div class="row"><button class="btn primary" data-act="' +
          (G.drill === 'drive' ? 'drillPick' : 'eduCourse') + '">' +
          (G.drill === 'drive' ? '꽂기 연습' : '교육 과정') + '</button>' +
        '<button class="btn" data-act="drillAgain">다시</button>' +
        '<button class="btn" id="btnBack">메뉴</button></div>'
      : '<div class="row"><button class="btn primary" data-act="drillNext">다음 단계</button>' +
        '<button class="btn" data-act="drillAgain">다시</button>' +
        '<button class="btn" id="btnBack">메뉴</button></div>'));
}
function drillNext(){
  const list = G.drill === 'drive' ? DRIVE_LEVELS : PICK_LEVELS;
  if(G.drillLv + 1 < list.length) G.drillLv++;
  hideSheet(); drillLoadLevel(); G.running = true;
}
function drillAgain(){ hideSheet(); drillLoadLevel(); G.running = true; }

function drillCheck(){
  if(G.drill === 'pick'){
    const lv = PICK_LEVELS[G.drillLv];
    const p = G.drillPallet;
    if(p && truck.carry === p){
      G.drillN++;
      blip(780, 0.13, 'triangle', 0.05);
      p.carried = false;
      if(G.drillN >= lv.need){ drillPass(); return; }
      pickStartPose(); pickSpawn(); drillTask();
    }
  }else{
    const lv = DRIVE_LEVELS[G.drillLv];
    const w = lv.gates[G.drillI];
    if(near(w.x, w.z, 1.6) && Math.abs(truck.v) < 0.25){
      blip(720, 0.12, 'triangle', 0.05);
      if(G.drillI + 1 < lv.gates.length){ G.drillI++; driveMarker(); drillTask(); }
      else{
        G.drillN++;
        if(G.drillN >= lv.need){ drillPass(); return; }
        G.drillI = 0;
        truck.x = lv.start.x; truck.z = lv.start.z; truck.h = lv.start.h;
        truck.v = 0; G.wheel = 0; G.throttle = 0;
        camera.userData.tx = truck.x; camera.userData.tz = truck.z;
        driveMarker(); drillTask();
      }
    }
  }
}

      miss: G.inspMiss, hit: G.inspHit, defects: Object.keys(G.defects),
      first: false
    }));

function eduLoad(){

/* ============================================================
   소리
   ============================================================ */
const SND = {
  ctx:null, on:true,
  drive:null, driveGain:null,
  hydOsc:null, hydSub:null, hydGain:null,
  hornGain:null, scrapeGain:null, scrapeFilt:null, scrapeFilt2:null,
  scrapeOsc:null, scrapeOsc2:null,
  ambGain:null, ambFilt:null,
  beepT:0, relief:false, reliefT:0, lastLev:0, scrape:0, ambT:6
};

function initAudio(){
  if(SND.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  SND.ctx = new AC();
  const dst = SND.ctx.destination;

  const o = SND.ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 58;
  const f = SND.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380;
  const g = SND.ctx.createGain(); g.gain.value = 0;
  o.connect(f); f.connect(g); g.connect(dst); o.start();
  SND.drive = o; SND.driveGain = g;

  const hg = SND.ctx.createGain(); hg.gain.value = 0; hg.connect(dst);
  const o2 = SND.ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 128;
  const f2 = SND.ctx.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 640; f2.Q.value = 1.1;
  const g2 = SND.ctx.createGain(); g2.gain.value = 0.55;
  o2.connect(f2); f2.connect(g2); g2.connect(hg); o2.start();
  const o3 = SND.ctx.createOscillator(); o3.type = 'sawtooth'; o3.frequency.value = 64;
  const f3 = SND.ctx.createBiquadFilter(); f3.type = 'lowpass'; f3.frequency.value = 210;
  const g3 = SND.ctx.createGain(); g3.gain.value = 0.85;
  o3.connect(f3); f3.connect(g3); g3.connect(hg); o3.start();
  SND.hydOsc = o2; SND.hydSub = o3; SND.hydGain = hg;

  const hn = SND.ctx.createGain(); hn.gain.value = 0;
  const hf = SND.ctx.createBiquadFilter(); hf.type = 'lowpass'; hf.frequency.value = 2400;
  hn.connect(hf); hf.connect(dst);
  [[402,'sawtooth',1.0],[506,'sawtooth',0.7],[804,'square',0.22]].forEach(v=>{
    const ho = SND.ctx.createOscillator();
    ho.type = v[1]; ho.frequency.value = v[0];
    const hgn = SND.ctx.createGain(); hgn.gain.value = v[2];
    ho.connect(hgn); hgn.connect(hn); ho.start();
  });
  SND.hornGain = hn;

  const sr = SND.ctx.sampleRate;
  const nb = SND.ctx.createBuffer(1, Math.floor(sr*1.2), sr);
  const nd = nb.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i] = Math.random()*2 - 1;

  /* 지겟발이 바닥을 긁는 소리 — 둔탁하면 뭐가 잘못됐는지 모른다.
     좁은 대역에 몰아넣고 배음을 얹어 카랑카랑한 쇳소리로 만든다. */
  const ng = SND.ctx.createGain(); ng.gain.value = 0;
  ng.connect(dst);
  const ns = SND.ctx.createBufferSource(); ns.buffer = nb; ns.loop = true;
  const nf = SND.ctx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 3300; nf.Q.value = 7;
  const nfg = SND.ctx.createGain(); nfg.gain.value = 1.0;
  ns.connect(nf); nf.connect(nfg); nfg.connect(ng); ns.start();
  const nf2 = SND.ctx.createBiquadFilter(); nf2.type = 'bandpass'; nf2.frequency.value = 5400; nf2.Q.value = 9;
  const nfg2 = SND.ctx.createGain(); nfg2.gain.value = 0.55;
  ns.connect(nf2); nf2.connect(nfg2); nfg2.connect(ng);
  const so = SND.ctx.createOscillator(); so.type = 'sawtooth'; so.frequency.value = 2100;
  const sog = SND.ctx.createGain(); sog.gain.value = 0.16;
  so.connect(sog); sog.connect(ng); so.start();
  const so2 = SND.ctx.createOscillator(); so2.type = 'sawtooth'; so2.frequency.value = 3170;
  const sog2 = SND.ctx.createGain(); sog2.gain.value = 0.10;
  so2.connect(sog2); sog2.connect(ng); so2.start();
  SND.scrapeGain = ng; SND.scrapeFilt = nf; SND.scrapeFilt2 = nf2;
  SND.scrapeOsc = so; SND.scrapeOsc2 = so2;

  // 센터 환경음 — 컨베이어와 공조기
  const as = SND.ctx.createBufferSource(); as.buffer = nb; as.loop = true;
  const af = SND.ctx.createBiquadFilter(); af.type = 'lowpass'; af.frequency.value = 240;
  const ag = SND.ctx.createGain(); ag.gain.value = 0;
  as.connect(af); af.connect(ag); ag.connect(dst); as.start();
  const ah = SND.ctx.createOscillator(); ah.type = 'sine'; ah.frequency.value = 88;
  const ahg = SND.ctx.createGain(); ahg.gain.value = 0.35;
  ah.connect(ahg); ahg.connect(ag); ah.start();
  SND.ambGain = ag; SND.ambFilt = af;
}
function resumeAudio(){
  initAudio();
  if(SND.ctx && SND.ctx.state === 'suspended') SND.ctx.resume();
}
function blip(freq, dur, type, vol){
  if(!SND.ctx || !SND.on) return;
  const t = SND.ctx.currentTime;
  const o = SND.ctx.createOscillator(); o.type = type || 'sine'; o.frequency.value = freq;
  const g = SND.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol || 0.05, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(SND.ctx.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
/* 후진 경보 — 소음 속에서 뚫고 나와야 한다.
   낮으면 묻히므로 사람 귀가 가장 예민한 2~4kHz 대역을 쓴다. */
function backupBeep(){
  if(!SND.ctx || !SND.on) return;
  const t = SND.ctx.currentTime;
  const g = SND.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.055, t + 0.005);
  g.gain.setValueAtTime(0.055, t + 0.34);             // 끌어주는 구간
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
  const hp = SND.ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 1400;
  g.connect(hp); hp.connect(SND.ctx.destination);
  [[2050,'square',1.0],[4100,'square',0.45],[6150,'square',0.18],[2050*1.5,'sawtooth',0.10]]
  .forEach(v=>{
    const o = SND.ctx.createOscillator();
    o.type = v[1]; o.frequency.value = v[0];
    const og = SND.ctx.createGain(); og.gain.value = v[2];
    o.connect(og); og.connect(g);
    o.start(t); o.stop(t + 0.40);
  });
}
function carHonk(){
  if(!SND.ctx || !SND.on) return;
  const t = SND.ctx.currentTime;
  const g = SND.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.05, t + 0.02);
  g.gain.setValueAtTime(0.05, t + 0.30);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
  const lp = SND.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900;
  g.connect(lp); lp.connect(SND.ctx.destination);
  [[440,'sawtooth',1.0],[554,'sawtooth',0.75]].forEach(v=>{
    const o = SND.ctx.createOscillator();
    o.type = v[1]; o.frequency.value = v[0];
    const og = SND.ctx.createGain(); og.gain.value = v[2];
    o.connect(og); og.connect(g);
    o.start(t); o.stop(t + 0.46);
  });
}
function distantBeep(){
  if(!SND.ctx || !SND.on) return;
  let n = 0;
  const tick = ()=>{
    if(n++ > 3) return;
    blip(950, 0.10, 'square', 0.012);
    setTimeout(tick, 420);
  };
  tick();
}
function hydClick(down){
  if(!SND.ctx || !SND.on) return;
  const t = SND.ctx.currentTime, sr = SND.ctx.sampleRate;
  const b = SND.ctx.createBuffer(1, Math.floor(sr*0.09), sr);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 4);
  const src = SND.ctx.createBufferSource(); src.buffer = b;
  const f = SND.ctx.createBiquadFilter();
  f.type = 'bandpass'; f.frequency.value = down ? 520 : 900; f.Q.value = 1.2;
  const g = SND.ctx.createGain(); g.gain.value = down ? 0.16 : 0.10;
  src.connect(f); f.connect(g); g.connect(SND.ctx.destination); src.start(t);
}
function reliefHiss(){
  if(!SND.ctx || !SND.on) return;
  const t = SND.ctx.currentTime, sr = SND.ctx.sampleRate;
  const b = SND.ctx.createBuffer(1, Math.floor(sr*0.26), sr);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++){ const k = i/d.length; d[i] = (Math.random()*2-1)*Math.sin(Math.PI*k)*0.9; }
  const src = SND.ctx.createBufferSource(); src.buffer = b;
  const f = SND.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.8;
  const g = SND.ctx.createGain(); g.gain.value = 0.075;
  src.connect(f); f.connect(g); g.connect(SND.ctx.destination); src.start(t);
}
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* 부딪힌 재질에 따라 소리를 달리한다 */
function impact(kind, vol){
  if(!SND.ctx || !SND.on) return;
  const t = SND.ctx.currentTime, sr = SND.ctx.sampleRate, v = vol || 1;
  const noise = (dur, type, freq, q, gain, curve)=>{
    const b = SND.ctx.createBuffer(1, Math.max(64, Math.floor(sr*dur)), sr);
    const d = b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, curve);
    const src = SND.ctx.createBufferSource(); src.buffer = b;
    const f = SND.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    if(q) f.Q.value = q;
    const g = SND.ctx.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(SND.ctx.destination); src.start(t);
  };
  const ring = (freq, dur, gain, type)=>{
    const o = SND.ctx.createOscillator(); o.type = type || 'triangle'; o.frequency.value = freq;
    const g = SND.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(SND.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  };
  if(kind === 'steel'){
    noise(0.10, 'highpass', 1600, 0, 0.16*v, 2);
    ring(1180, 0.55, 0.055*v); ring(1760, 0.42, 0.035*v); ring(2640, 0.30, 0.020*v, 'sine');
    buzz(35);
  }else if(kind === 'concrete'){
    noise(0.24, 'lowpass', 300, 0, 0.42*v, 3);
    ring(96, 0.22, 0.070*v, 'sine');
    buzz(45);
  }else if(kind === 'plastic'){
    noise(0.07, 'bandpass', 900, 1.2, 0.16*v, 2);
    ring(520, 0.14, 0.030*v);
    buzz(15);
  }else if(kind === 'person'){
    noise(0.20, 'lowpass', 420, 0, 0.34*v, 3);
    for(let i=0;i<3;i++){
      setTimeout(()=>{
        if(!SND.ctx || !SND.on) return;
        const tt = SND.ctx.currentTime;
        const o = SND.ctx.createOscillator(); o.type = 'square'; o.frequency.value = 1180;
        const g = SND.ctx.createGain();
        g.gain.setValueAtTime(0.0001, tt);
        g.gain.linearRampToValueAtTime(0.075, tt + 0.01);
        g.gain.setValueAtTime(0.075, tt + 0.14);
        g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.20);
        o.connect(g); g.connect(SND.ctx.destination);
        o.start(tt); o.stop(tt + 0.22);
      }, i*230);
    }
    buzz([90, 60, 90, 60, 160]);
  }else{
    noise(0.20, 'lowpass', 340, 0, 0.35*v, 3);
  }
}

function thud(vol){
  if(!SND.ctx || !SND.on) return;
  const t = SND.ctx.currentTime, sr = SND.ctx.sampleRate;
  const b = SND.ctx.createBuffer(1, Math.floor(sr*0.20), sr);
  const d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/d.length, 3);
  const src = SND.ctx.createBufferSource(); src.buffer = b;
  const f = SND.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 340;
  const g = SND.ctx.createGain(); g.gain.value = vol || 0.35;
  src.connect(f); f.connect(g); g.connect(SND.ctx.destination); src.start(t);
}
function setHorn(on){
  if(G.horn === on) return;
  G.horn = on;
  if(on) resumeAudio();
  if(SND.ctx && SND.hornGain){
    const t = SND.ctx.currentTime;
    SND.hornGain.gain.cancelScheduledValues(t);
    SND.hornGain.gain.setTargetAtTime(on && SND.on && !G.defects.horn ? 0.085 : 0, t, on ? 0.006 : 0.02);
  }
  const el = document.getElementById('horn');
  if(el) el.classList.toggle('on', on);
}

function updateAudio(dt){
  if(!SND.ctx) return;
  const t = SND.ctx.currentTime;
  const sp = Math.abs(truck.v);
  SND.driveGain.gain.setTargetAtTime(SND.on ? Math.min(0.055, sp*0.032) : 0, t, 0.09);
  SND.drive.frequency.setTargetAtTime(54 + sp*72, t, 0.09);

  const lev = Math.max(Math.abs(levers.lift.val), Math.abs(levers.tilt.val), Math.abs(levers.reach.val));
  const rise = levers.lift.val < -0.05 ? 1 : 0;
  const load = truck.carry ? 1 : 0;
  SND.hydGain.gain.setTargetAtTime(SND.on ? lev*0.085 : 0, t, 0.04);
  SND.hydOsc.frequency.setTargetAtTime(128 - load*rise*22, t, 0.12);
  SND.hydSub.frequency.setTargetAtTime(64 - load*rise*11, t, 0.12);
  if(lev > 0.05 && SND.lastLev <= 0.05) hydClick(true);
  if(lev <= 0.05 && SND.lastLev > 0.05) hydClick(false);
  SND.lastLev = lev;

  SND.reliefT -= dt;
  if(SND.relief && SND.reliefT <= 0){ reliefHiss(); SND.reliefT = 0.30; }
  if(!SND.relief) SND.reliefT = 0;

  if(SND.scrapeGain){
    SND.scrapeGain.gain.setTargetAtTime(SND.on ? SND.scrape*0.085 : 0, t, 0.04);
    // 빠를수록 높고 날카롭게, 미세하게 흔들려 금속이 갈리는 느낌을 준다
    const jit = 1 + Math.sin(t*37) * 0.05;
    SND.scrapeFilt.frequency.setTargetAtTime((2600 + SND.scrape*1900)*jit, t, 0.05);
    SND.scrapeFilt2.frequency.setTargetAtTime((4600 + SND.scrape*2200)*jit, t, 0.05);
    SND.scrapeOsc.frequency.setTargetAtTime((1750 + SND.scrape*900)*jit, t, 0.06);
    SND.scrapeOsc2.frequency.setTargetAtTime((2640 + SND.scrape*1300)*jit, t, 0.06);
  }

  // 환경음 — 실내에서 크고, 밖으로 나가면 바람 소리로 바뀐다
  if(SND.ambGain){
    const inside = truck.z < WALL_Z;
    const lvl = G.running ? (inside ? 0.030 : 0.018) : 0.006;
    SND.ambGain.gain.setTargetAtTime(SND.on ? lvl : 0, t, 0.5);
    SND.ambFilt.frequency.setTargetAtTime(inside ? 240 : 620, t, 0.6);
    if(G.running && inside){
      SND.ambT -= dt;
      if(SND.ambT <= 0){ SND.ambT = 9 + Math.random()*14; distantBeep(); }
    }
  }

  if(G.defects.beep && G.throttle < -0.05 && G.pedal) defectHit('beep');
  if(SND.on && !G.defects.beep && G.throttle < -0.05 && (G.pedal || truck.v < -0.05)){
    SND.beepT -= dt;
    if(SND.beepT <= 0){ backupBeep(); SND.beepT = 0.60; }
  }else SND.beepT = 0;
}

const CERT_KEY = 'forklift_sim_cert_v1';
let certMem = [];
function hasGas(){ return typeof google !== 'undefined' && google.script && google.script.run; }
function loadCerts(){ return certMem; }
function refreshCerts(done){
  if(hasGas()){
    google.script.run
      .withSuccessHandler(list=>{ certMem = list || []; if(done) done(); })
      .withFailureHandler(()=>{ if(done) done(); })
      .listCertifications();
  }else{
    try{ certMem = JSON.parse(window.localStorage.getItem(CERT_KEY) || '[]'); }catch(e){}
    if(done) done();
  }
}
function persistCert(rec){
  certMem.push(rec);
  if(hasGas()){
    google.script.run.withSuccessHandler(list=>{ if(list) certMem = list; }).addCertification(rec);
  }else{
    try{ window.localStorage.setItem(CERT_KEY, JSON.stringify(certMem)); }catch(e){}
  }
}
function scoreBreak(){
  const over = Math.max(0, Math.round(G.time) - SCORE.timeFree);
  const dmg = G.damage * SCORE.perDamage;
  const tp = over * SCORE.perSec;
  const score = Math.max(0, SCORE.base - dmg - tp);
  return { over:over, dmg:dmg, tp:tp, score:score, pass: score >= SCORE.pass };
}
function recordRows(){
  const by = {};
  const get = n =>{
    if(!by[n]) by[n] = { name:n, score:null, damage:null, date:'', rush:null, rdate:'' };
    return by[n];
  };
  for(const c of loadCerts()){
    const r = get(String(c.name));
    if(r.score === null || c.score > r.score){ r.score = c.score; r.damage = c.damage; r.date = c.date || ''; }
  }
  for(const c of rushLoad()){
    const r = get(String(c.name));
    if(r.rush === null || c.total < r.rush){ r.rush = c.total; r.rdate = c.date || ''; }
  }
  const list = [];
  for(const k in by) list.push(by[k]);
  list.sort((a,b)=>{
    if((b.score||0) !== (a.score||0)) return (b.score||0) - (a.score||0);
    return (a.rush === null ? 1e9 : a.rush) - (b.rush === null ? 1e9 : b.rush);
  });
  return list;
}
function certListSheet(){
  const list = recordRows();
  const rows = list.length
    ? list.map((c,i)=> '<tr><td>' + (i+1) + '</td><td>' + esc(c.name) + '</td>' +
        '<td class="num">' + (c.score === null ? '-' : c.score + '점') + '</td>' +
        '<td class="num">' + (c.rush === null ? '-' : fmtTime(c.rush)) + '</td>' +
        '<td class="dt">' + esc(c.date || c.rdate || '') + '</td></tr>').join('')
    : '<tr><td colspan="5" class="none">아직 기록이 없습니다</td></tr>';
  return '<h1>기록</h1><div class="sub">수료 기준 ' + SCORE.pass +
    '점 · 속도전은 파손 1건당 ' + RUSH_PENALTY + '초</div>' +

    '<div class="row"><button class="btn primary" id="btnBack">돌아가기</button></div>';
}

    ? '<h1>수료</h1><div class="sub">기준 ' + SCORE.pass + '점을 넘겼습니다</div>'
    : '<h1>미수료</h1><div class="sub">기준 ' + SCORE.pass + '점에 미달했습니다</div>';
  const detail = '<table class="calc"><tbody>' +
    '<tr><td>기본</td><td class="num">' + SCORE.base + '</td></tr>' +
    '<tr><td>파손·오조작 ' + G.damage + '건</td><td class="num">-' + r.dmg + '</td></tr>' +
    '<tr><td>시간 초과 ' + r.over + '초</td><td class="num">-' + r.tp + '</td></tr>' +
    '<tr class="sum"><td>합계</td><td class="num">' + r.score + '</td></tr></tbody></table>';
  const foot = r.pass
    ? '<div class="namebox"><input id="certName" type="text" maxlength="12" placeholder="이름" value="' + esc(G.playerName) + '"></div>' +
      '<div class="row"><button class="btn primary" data-act="cert">수료자 명단에 등록</button>' +
      '<button class="btn" id="btnAgain">다시</button></div>'
    : '<div class="row"><button class="btn primary" id="btnAgain">처음부터 다시</button></div>';
  return head + '<div class="result">' +
    '<div><div class="k">점수</div><div class="v">' + r.score + '</div></div>' +
    '<div><div class="k">시간</div><div class="v">' + fmtTime(G.time) + '</div></div>' +
    '<div><div class="k">파손</div><div class="v">' + G.damage + '</div></div>' +
    '</div>' + detail + foot;
}

function resetWorld(){

function backToMenu(){

  clearPractice();

  applyTime(2);

}
function enterMode(){
  try{ history.pushState({ sim:1 }, ''); }catch(e){}
  if(!tourDone()) setTimeout(tourStart, 400);
}
function readMenuName(){
  const el = document.getElementById('menuName');
  if(el) G.playerName = (el.value || '').trim();
}
function registerCert(){
  const el = document.getElementById('certName');
  const name = (el && el.value || '').trim();
  if(!name){ if(el){ el.focus(); el.placeholder = '이름을 입력하세요'; } return; }
  G.playerName = name;
  const r = scoreBreak();
  const d = new Date();
  persistCert({
    name:name, score:r.score, damage:G.damage, time:Math.round(G.time),
    date: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0')
  });
  blip(880, 0.16, 'sine', 0.06);
  setTimeout(()=> blip(1320, 0.22, 'sine', 0.05), 150);
  showSheet(certListSheet());

function startRoam(){
  hideSheet(); enterMode();
  G.mode = 'roam'; G.time = 0; G.damage = 0; G.chargeStep = false; G.defects = {}; G.defectSeen = {};
  targetRing.visible = false; targetPost.visible = false; slotGhost.visible = false;
  loadRoam();
  G.goal = pickGoal();
  G.shutterT = G.outUnlocked ? 8.4 : 3.0;
  const tn = applyTime(Math.floor(Math.random()*TIMES.length));
  G.running = true;
  applyLayout();
  showTask('배회', tn + '의 센터',
    G.outUnlocked ? '셔터 밖에 야드와 도로가 있습니다.'
                  : '돌아다니면 지도가 채워집니다. 다 채우면 셔터가 열립니다.');
}

function bindSheet(){
  document.getElementById('overlay').addEventListener('click', e=>{
    resumeAudio();
    const act = e.target.getAttribute && e.target.getAttribute('data-act');
    if(act === 'cert'){ registerCert(); return; }
    if(act === 'inspGood'){ inspAnswer(false); return; }
    if(act === 'inspBad'){ inspAnswer(true); return; }
    if(act === 'inspNext'){ inspNext(); return; }
    if(act === 'inspFix'){ inspFix(); return; }
    if(act === 'eduDrive'){ eduDrive(); return; }
    if(act === 'eduCourse'){ autoFull(); eduEnter(); return; }
    if(act === 'drillDrive'){ autoFull(); drillStart('drive'); return; }
    if(act === 'drillPick'){ autoFull(); drillStart('pick'); return; }
    if(act === 'drillNext'){ drillNext(); return; }
    if(act === 'drillAgain'){ drillAgain(); return; }
    if(act === 'eduResume'){ eduResume(); return; }
    if(act === 'eduRestart'){ eduClear(); eduBegin(true); return; }
    if(act === 'rushSave'){ rushSave(); return; }
    if(act){ chargeAct(act); return; }
    const id = e.target.id;
    if(id === 'btnEdu'){
      autoFull(); readMenuName(); showSheet(eduMenuSheet());
    }else if(id === 'btnWork'){
      autoFull(); readMenuName(); showSheet(workSheet());
    }else if(id === 'btnRush'){
      autoFull(); rushStart();
    }else if(id === 'btnMis'){
      autoFull();
      readMenuName(); hideSheet(); enterMode();
      G.mode='mission'; G.missionIdx=0; G.time=0; G.damage=0;
      G.chargeStep=false; G.batt=100; G.lowWarned=false; G.battDead=false; G.running=true;
      G.defects = {}; G.defectSeen = {}; applyTime(2); startMission();
      toast('무작위 지시 ' + G.missionTotal + '건 · 마지막은 충전', true);
    }else if(id === 'btnRoam'){
      autoFull(); readMenuName(); startRoam();
    }else if(id === 'btnCert'){
      readMenuName(); refreshCerts(()=> showSheet(certListSheet()));
    }else if(id === 'btnBack'){
      if(G.mode !== 'menu') backToMenu(); else showSheet(menuSheet());
    }else if(id === 'btnAgain'){
      if(history.state && history.state.sim) history.back(); else backToMenu();
    }
  });
}

   HUD

const _gv = new THREE.Vector3();
function updateGuide(){
  const el = document.getElementById('guide');
  let p = null;
  if(targetPost.visible) p = targetPost.position;
  else if(slotGhost.visible) p = slotGhost.position;
  if(!p){ el.style.display = 'none'; return; }
  _gv.set(p.x, 1.2, p.z).project(camera);
  const behind = _gv.z > 1;
  let nx = _gv.x, ny = _gv.y;
  if(behind){ nx = -nx; ny = -ny; }
  if(!behind && Math.abs(nx) < 0.88 && Math.abs(ny) < 0.80){ el.style.display = 'none'; return; }
  const W = window.innerWidth, H = window.innerHeight;
  // 조작반이 덮는 아래쪽을 뺀 실제 보이는 영역 안에 붙인다
  const band = G.padYNow || 0;
  const cy2 = (H - band)/2;
  const mx = W/2 - 84, my = cy2 - 74;
  let dx = nx, dy = -ny;
  if(Math.abs(dx) < 1e-4 && Math.abs(dy) < 1e-4) dy = 1;
  const t = Math.min(mx/Math.max(Math.abs(dx),1e-4), my/Math.max(Math.abs(dy),1e-4));
  el.style.display = 'flex';
  el.style.left = (W/2 + dx*t) + 'px';
  el.style.top = (cy2 + dy*t) + 'px';
  document.getElementById('guideArrow').style.transform = 'rotate(' + (Math.atan2(dy, dx)*180/Math.PI) + 'deg)';
  document.getElementById('guideDist').textContent = Math.round(Math.hypot(truck.x - p.x, truck.z - p.z)) + 'm';
}
function updateRisk(){
  const el = document.getElementById('risk');
  if(!G.risk || !G.running){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.className = G.risk.lv === 'warn' ? 'warn' : '';
  document.getElementById('riskMsg').textContent = G.risk.msg;
  document.getElementById('riskBar').style.width = (G.risk.r*100).toFixed(0) + '%';
}
function updateHUD(dt){
  const roam = G.mode === 'roam';
  const bare = roam || G.mode === 'drill';
  document.getElementById('stat').style.display = bare ? 'none' : 'flex';
  document.getElementById('zoom').classList.toggle('up', bare);
  document.getElementById('btnMap').classList.toggle('hide', !roam);
  document.getElementById('btnRear').classList.toggle('hide', effView() !== 'cab');
  document.getElementById('statTime').textContent = fmtTime(G.time);

  b.textContent = Math.round(G.batt) + '%';

    G.toastT -= dt;

  }

  updateGuide();
}

function applyLayout(){
  const w = window.innerWidth, h = window.innerHeight;
  const coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  document.body.classList.toggle('touch', coarse);
  const portrait = h > w;
  document.body.classList.toggle('portrait', portrait);
  G.portrait = portrait;

  const cl = document.getElementById('ctlLeft');
  const cr = document.getElementById('ctlRight');
  const panel = document.getElementById('panel');

  /* 배치는 세로·가로가 같다. 폭에 맞춰 배율만 달라진다.
     아래 줄 = [핸들 + 브레이크] ... [레버 모듈 + 경음기]
     그 위   = 납작한 계기판, 필요할 때 정렬 게이지가 그 위에 겹친다. */
  let ui = UI_STEPS[G.uiStep] || 0;
  if(!ui) ui = coarse ? clamp(h/430, 0.85, 1.45) : clamp(h/840, 0.82, 1.10);
  const natW = cl.offsetWidth + cr.offsetWidth + 40;
  const natH = Math.max(cl.offsetHeight, cr.offsetHeight, 1);
  ui = clamp(Math.min(ui, w/natW, (h*(portrait ? 0.30 : 0.46))/natH), 0.5, 1.9);
  document.documentElement.style.setProperty('--ui', ui.toFixed(3));
  G.uiNow = ui;

  const ctlH = natH*ui;
  panel.style.bottom = Math.round(ctlH + 20) + 'px';
  // 계기판 좌우 상자를 아래 조작반과 같은 폭으로 맞춘다
  document.getElementById('panelL').style.width = Math.round(cl.offsetWidth*ui) + 'px';
  document.getElementById('panelR').style.width = Math.round(cr.offsetWidth*ui) + 'px';
  const ay = Math.round(ctlH + 20 + panel.offsetHeight + 8);
  document.getElementById('alignL').style.bottom = ay + 'px';
  document.getElementById('alignR').style.bottom = ay + 'px';

  // 계기판은 자리를 차지하고, 정렬 게이지는 그 위에 겹치기만 한다
  G.padY = portrait ? (ctlH + panel.offsetHeight + 30) : 0;
  G.uipNow = 0; G.panelW = 0;

  // 지시서가 시간·파손·배터리 카드를 침범하지 않게 폭을 잘라준다
  const taskEl = document.getElementById('task');
  const statEl = document.getElementById('stat');
  const statW = (statEl.style.display === 'none') ? 0 : statEl.offsetWidth;
  taskEl.style.maxWidth = Math.max(150, w - statW - 36) + 'px';

  document.getElementById('risk').style.top =
    Math.round(Math.min(140, (h - (G.padY || 0))*0.42)) + 'px';
  document.getElementById('toast').style.top =
    Math.round(Math.min(92, (h - (G.padY || 0))*0.22)) + 'px';
}

const TOUR_KEY = 'forklift_tour_v1';
const TOUR = [
  { el:'btnFull', t:'전체 화면',
    d:'시작할 때 자동으로 켜집니다. 원하지 않으면 이 버튼으로 끄면 되고, 그 뒤로는 자동으로 켜지지 않습니다.' },

  { el:'btnExit', t:'나가기',
    d:'언제든 메뉴로 나옵니다. 뒤로가기나 Esc 도 같습니다.' }
];
const TOUR_S = { i:0, on:false };

function tourDone(){
  try{ return window.localStorage.getItem(TOUR_KEY) === '1'; }catch(e){ return true; }
}
function tourEnd(){
  TOUR_S.on = false;
  document.getElementById('tour').style.display = 'none';
  document.getElementById('tourRing').style.display = 'none';
  try{ window.localStorage.setItem(TOUR_KEY, '1'); }catch(e){}
}
function tourVisible(id){
  if(!id) return true;
  const el = document.getElementById(id);
  if(!el) return false;
  const r = el.getBoundingClientRect();
  return r.width > 2 && r.height > 2;
}
function tourShow(){
  // 지금 화면에 없는 버튼은 건너뛴다
  while(TOUR_S.i < TOUR.length && !tourVisible(TOUR[TOUR_S.i].el)) TOUR_S.i++;
  const step = TOUR[TOUR_S.i];
  if(!step){ tourEnd(); return; }
  const box = document.getElementById('tour');
  const ring = document.getElementById('tourRing');
  document.getElementById('tourTtl').textContent = step.t;
  document.getElementById('tourTxt').textContent = step.d;
  document.getElementById('tourN').textContent = (TOUR_S.i+1) + ' / ' + TOUR.length;
  document.getElementById('tourNext').textContent =
    (TOUR_S.i + 1 >= TOUR.length) ? '시작' : '다음';
  box.style.display = 'block';

  const W = window.innerWidth, H = window.innerHeight;
  const bw = box.offsetWidth, bh = box.offsetHeight;
  const el = step.el ? document.getElementById(step.el) : null;
  if(el){
    const r = el.getBoundingClientRect();
    ring.style.display = 'block';
    ring.style.left = Math.round(r.left - 5) + 'px';
    ring.style.top = Math.round(r.top - 5) + 'px';
    ring.style.width = Math.round(r.width + 10) + 'px';
    ring.style.height = Math.round(r.height + 10) + 'px';
    box.style.left = Math.round(clamp(r.left + r.width/2 - bw/2, 10, W - bw - 10)) + 'px';
    box.style.top = Math.round(clamp(r.bottom + 12, 10, H - bh - 10)) + 'px';
  }else{
    ring.style.display = 'none';
    box.style.left = Math.round((W - bw)/2) + 'px';
    box.style.top = Math.round((H - bh)/2) + 'px';
  }
}
function tourNext(){ TOUR_S.i++; tourShow(); }
function tourStart(){
  if(tourDone() || TOUR_S.on) return;
  // 점검표 같은 화면이 덮고 있으면 그게 끝날 때까지 기다린다
  const ov = document.getElementById('overlay');
  if(!ov.classList.contains('hide') || !G.running){
    setTimeout(tourStart, 500);
    return;
  }
  TOUR_S.i = 0; TOUR_S.on = true;
  if(!G.barOpen){ G.barOpen = true; paintBar(); applyLayout(); }
  setTimeout(tourShow, 80);
}

/* 시작 버튼을 누르는 그 동작에 전체 화면을 얹는다.
   브라우저가 사용자 조작 없이는 허용하지 않기 때문이다.
   한 번 직접 끈 사람에게는 다시 걸지 않는다. */
const FULL_KEY = 'forklift_full_v1';
function autoFull(){
  try{ if(window.localStorage.getItem(FULL_KEY) === '0') return; }catch(e){}
  if(document.fullscreenElement || document.webkitFullscreenElement) return;
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if(!fn) return;
  try{
    const r = fn.call(el);
    if(r && r.catch) r.catch(()=>{});
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock('landscape').catch(()=>{});
    }
    setTimeout(resize, 350);
  }catch(e){}
}

/* 브라우저 주소창·툴바가 차지하는 세로를 되찾는다. 모바일에서 체감이 크다. */
function toggleFull(){
  const el = document.documentElement;
  try{
    if(document.fullscreenElement || document.webkitFullscreenElement){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      try{ window.localStorage.setItem(FULL_KEY, '0'); }catch(err){}
    }else{
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
      try{ window.localStorage.setItem(FULL_KEY, '1'); }catch(err){}
      if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock('landscape').catch(()=>{});
      }
    }
  }catch(e){ toast('이 브라우저에서는 전체 화면을 쓸 수 없습니다'); }
  setTimeout(resize, 350);
}

/* 후진할 때 시점을 뒤로 돌릴지. 사람에 따라 방향 감각이 끊기기도 한다. */

}

function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  applyLayout();
  if(TOUR_S.on) tourShow();
}

/* ============================================================
   루프
   ============================================================ */
let labelT = 0, saveT = 0;
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  readControls(dt);
  tickCharge(dt);
  updateAudio(dt);

  if(G.running){
    G.time += dt;
    if(G.mode === 'mission'){
      let dr = 0.05;
      if(Math.abs(truck.v) > 0.10) dr += 0.16;
      if(Math.abs(levers.lift.val) > 0.05) dr += 0.30;
      G.batt = Math.max(0, G.batt - dr*dt);
      if(G.batt >= 25) G.lowWarned = false;
      if(G.batt < 20 && !G.lowWarned){ G.lowWarned = true; toast('배터리 부족 · 속도 제한'); }
      if(G.batt <= 0 && !G.battDead){ G.battDead = true; G.damage += 1; toast('배터리 방전 · 비상 주행'); }
    }
    drive(dt);
    forkLogic(dt);
    hazards(dt);
    updatePeds(dt);
    updateCars(dt);
    if(G.mode === 'drill') drillCheck(); else checkObjective();
    if(G.mode !== 'roam' && G.mode !== 'drill') markLoose();
    if(G.mode === 'roam'){
      markCell();
      updateGoal();
      updateDiscoveries();
      saveT -= dt;
      if(saveT <= 0){ saveT = 6; saveRoam(); }
    }
  }else{
    SND.relief = false;
    SND.scrape = 0;
  }

  labelT -= dt;
  if(labelT <= 0){ labelT = 0.35; updateLabels(); }

  sync(dt);
  updateCamera(dt);
  updateHUD(dt);
  if(targetRing.visible) targetRing.material.opacity = 0.55 + 0.25*Math.sin(performance.now()*0.004);
  if(slotGhost.visible) slotGhost.material.opacity = 0.16 + 0.10*Math.sin(performance.now()*0.004);
  for(const d of discMeshes) if(d.halo.visible) d.halo.material.opacity = 0.35 + 0.22*Math.sin(performance.now()*0.003);
  renderer.render(scene, camera);
}

function init(){
  renderer = new THREE.WebGLRenderer({canvas:document.getElementById('scene'), antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.90;

  camera = new THREE.PerspectiveCamera(38, 1, 0.22, 260);
  camera.userData.tx = truck.x;
  camera.userData.tz = truck.z;
  camera.userData.z = G.zoom;

  clock = new THREE.Clock();
  buildWorld();
  setupPallets();
  buildLevers();
  bindControls();
  bindSheet();
  setPedal(false);
  G.shutterT = 3.0;
  try{
    const v = parseInt(window.localStorage.getItem(UI_KEY) || '0', 10);
    if(v >= 0 && v < UI_STEPS.length) G.uiStep = v;
  }catch(e){}
  loadRoam();
  try{ G.showMap = window.localStorage.getItem(MAP_KEY) === '1'; }catch(e){}
  document.getElementById('roamMore').classList.toggle('on', G.showMap);
  document.getElementById('btnMap').classList.toggle('on', G.showMap);
  try{
    const v = window.localStorage.getItem(VIEW_KEY);
    if(VIEWS.indexOf(v) >= 0) G.view = v;   // 없으면 기본값 운전석
  }catch(e){}
  try{
    const r = window.localStorage.getItem(REAR_KEY);
    if(r !== null) G.rearLook = (r === '1');
  }catch(e){}
  document.getElementById('btnRear').classList.toggle('on', G.rearLook);
  try{ G.barOpen = window.localStorage.getItem(BAR_KEY) === '1'; }catch(e){}
  paintBar();
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', ()=> setTimeout(resize, 220));
  window.addEventListener('pointerdown', resumeAudio, true);
  window.addEventListener('keydown', resumeAudio, true);
  window.addEventListener('beforeunload', ()=>{ if(G.mode === 'roam') saveRoam(); });
  try{ history.replaceState({ sim:0 }, ''); }catch(e){}
  window.addEventListener('popstate', ()=>{ if(G.mode !== 'menu') backToMenu(); });
  refreshCerts();
  showTask('준비', '지게차 연수원', '');
  showSheet(menuSheet());

  updateLabels();
  sync(0.016);
  updateCamera(0.016);
  renderer.compile(scene, camera);
  renderer.render(scene, camera);
  document.getElementById('boot').classList.add('gone');
  loop();
}

init();
</script>
